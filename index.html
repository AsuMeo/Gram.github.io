<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <title>VOLT Stream</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    :root { --bg: #000000; --surface: #121212; --surface2: #1a1a1a; --border: #222222; --text: #ffffff; --text-sub: #aaaaaa; --accent: #fe2c55; --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    html, body { width: 100%; height: 100%; background: #000; color: var(--text); font-family: var(--font); overflow: hidden; overscroll-behavior: none; -webkit-overflow-scrolling: touch; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-text-size-adjust: 100%; touch-action: manipulation; }
    body { touch-action: pan-y; }
    ::-webkit-scrollbar { display: none; }
    input, textarea { -webkit-user-select: text; user-select: text; }
    button, input, textarea { font: inherit; color: inherit; }
    button { border: 0; background: none; padding: 0; cursor: pointer; }

    .app-viewport { width: 100vw; height: 100vh; height: 100dvh; max-width: 480px; margin: 0 auto; background: var(--bg); position: relative; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 40px rgba(0,0,0,0.8); }

    /* === HEADER === */
    .header { position: absolute; top: 0; left: 0; right: 0; height: 56px; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 0 16px; background: transparent; }
    .header-tabs { display: flex; gap: 16px; font-size: 16px; font-weight: 600; }
    .tab { color: var(--text-sub); cursor: pointer; position: relative; padding-bottom: 4px; transition: color 0.15s ease; }
    .tab.active { color: var(--text); }
    .tab.active::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 16px; height: 2px; background: var(--text); border-radius: 2px; }

    /* === VIDEO FEED === */
    .feed { flex: 1; width: 100%; height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory; overscroll-behavior-y: contain; scrollbar-width: none; -ms-overflow-style: none; -webkit-overflow-scrolling: touch; }
    .feed::-webkit-scrollbar { display: none; }
    .video-card { width: 100%; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; position: relative; background: #000; display: flex; align-items: center; justify-content: center; }
    .stage { position: absolute; inset: 0; display: grid; place-items: center; background: #000; overflow: hidden; }
    .video-player { display: block; width: 100%; height: 100%; object-fit: contain; object-position: center; background: #000; outline: 0; }
    .poster { position: absolute; inset: 0; display: grid; place-items: center; background: #000; transition: opacity .16s linear; pointer-events: none; }
    .poster.hide { opacity: 0; }
    .spin { position: absolute; z-index: 6; left: 50%; top: 50%; width: 28px; height: 28px; margin: -14px; border: 2px solid #444; border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; display: none; }
    .video-card.wait .spin { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .shade { position: absolute; inset: auto 0 0; height: 34%; pointer-events: none; background: rgba(0,0,0,.38); mask-image: linear-gradient(transparent, #000); -webkit-mask-image: linear-gradient(transparent, #000); }
    .playflash { position: absolute; z-index: 9; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px; display: grid; place-items: center; border-radius: 50%; background: rgba(0,0,0,.45); opacity: 0; transform: scale(.82); pointer-events: none; }
    .playflash svg { width: 31px; height: 31px; fill: white; stroke: white; margin-left: 3px; }
    .playflash.show { animation: flash .55s ease; }
    @keyframes flash { 0% { opacity: 0; transform: scale(.7); } 25% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1); } }
    .heartburst { position: absolute; z-index: 10; left: 50%; top: 50%; width: 98px; height: 98px; margin: -49px; color: var(--accent); fill: currentColor; stroke: white; stroke-width: 1; opacity: 0; pointer-events: none; filter: drop-shadow(0 4px 10px #000); }
    .heartburst.go { animation: heart .7s ease-out; }
    @keyframes heart { 0% { opacity: 0; transform: scale(.2) rotate(-15deg); } 25% { opacity: 1; transform: scale(1.15) rotate(7deg); } 60% { opacity: 1; transform: scale(1) rotate(0); } 100% { opacity: 0; transform: translateY(-75px) scale(.75); } }
    .side-bar { position: absolute; right: 12px; bottom: 90px; display: flex; flex-direction: column; align-items: center; gap: 18px; z-index: 10; }
    .action-btn { background: none; border: none; color: var(--text); display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; font-size: 12px; font-weight: 500; }
    .icon-wrapper { width: 44px; height: 44px; border-radius: 50%; background: rgba(18,18,18,0.6); display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
    .action-btn:active .icon-wrapper { transform: scale(0.9); }
    .action-btn.liked svg { fill: var(--accent); stroke: var(--accent); animation: pop .24s ease-out; }
    @keyframes pop { 0% { transform: scale(.65); } 70% { transform: scale(1.2); } 100% { transform: scale(1); } }
    .action-btn.bookmarked svg { fill: #ffb703; stroke: #ffb703; }
    .video-info { position: absolute; left: 12px; bottom: 24px; right: 80px; z-index: 10; display: flex; flex-direction: column; gap: 8px; text-shadow: 0 1px 4px #000; pointer-events: none; }
    .username { font-weight: 700; font-size: 16px; letter-spacing: -0.2px; }
    .description { font-size: 14px; line-height: 1.35; color: rgba(255,255,255,0.95); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .music-track { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-sub); }
    .progress-container { position: absolute; bottom: 0; left: 0; right: 0; height: 18px; display: flex; align-items: flex-end; cursor: pointer; touch-action: none; z-index: 12; }
    .track { position: relative; width: 100%; height: 2px; background: rgba(255,255,255,.24); }
    .fill, .buffer { position: absolute; inset: 0 auto 0 0; transform-origin: left; width: 100%; transform: scaleX(0); }
    .buffer { background: rgba(255,255,255,.32); }
    .fill { background: #fff; }
    .progress-container:active .track { height: 4px; }

    /* === NAV === */
    .nav { height: 50px; background: var(--bg); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-around; z-index: 20; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--text-sub); font-size: 10px; background: none; border: none; cursor: pointer; width: 20%; }
    .nav-item.active { color: var(--text); }
    .create-btn { width: 42px; height: 28px; background: var(--text); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--bg); }

    /* === DRAWER (VIDEO COMMENTS) === */
    .drawer { position: absolute; bottom: 0; left: 0; right: 0; height: 65%; background: var(--surface); border-top-left-radius: 16px; border-top-right-radius: 16px; z-index: 30; transform: translateY(100%); transition: transform 0.25s cubic-bezier(0.1, 0.9, 0.2, 1); display: flex; flex-direction: column; border-top: 1px solid var(--border); }
    .drawer.open { transform: translateY(0); }
    .drawer-header { padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 600; }
    .drawer-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
    .comment-item { display: flex; gap: 12px; font-size: 13px; }
    .comment-avatar { width: 32px; height: 32px; border-radius: 50%; background: #222; flex-shrink: 0; display: grid; place-items: center; font-size: 12px; font-weight: 800; }
    .comment-content { display: flex; flex-direction: column; gap: 2px; }
    .comment-author { color: var(--text-sub); font-size: 12px; }
    .drawer-footer { padding: 10px 16px; border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: center; background: var(--bg); }
    .comment-input { flex: 1; background: var(--surface); border: 1px solid var(--border); padding: 10px 14px; border-radius: 20px; color: #fff; font-size: 13px; outline: none; -webkit-user-select: text; }
    .send-btn { background: none; border: none; color: var(--accent); font-weight: 600; font-size: 14px; cursor: pointer; }

    /* === OVERLAY === */
    .overlay-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.6); z-index: 25; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
    .overlay-backdrop.show { opacity: 1; pointer-events: auto; }

    /* === TOAST === */
    .toast { position: fixed; z-index: 90; left: 50%; bottom: 80px; translate: -50% 12px; max-width: min(90vw, 420px); padding: 10px 14px; border: 1px solid #2a2a30; border-radius: 10px; background: #141418; color: #fff; font-size: 13px; font-weight: 650; opacity: 0; pointer-events: none; transition: .2s; }
    .toast.on { opacity: 1; translate: -50% 0; }

    /* === MODALS === */
    .modal { position: fixed; z-index: 80; inset: 0; display: none; align-items: flex-end; justify-content: center; background: rgba(0,0,0,.68); padding: 20px 14px 14px; backdrop-filter: blur(5px); }
    .modal.open { display: flex; }
    .sheet { width: min(100%, 480px); border: 1px solid #29292e; border-radius: 17px; background: #101014; padding: 14px; box-shadow: 0 20px 80px #000; }
    .sheethead { height: 35px; display: flex; align-items: flex-start; justify-content: space-between; font-size: 15px; font-weight: 800; }
    .close { width: 30px; height: 30px; display: grid; place-items: center; margin-top: -7px; border-radius: 50%; background: #242429; }
    .close svg { width: 18px; height: 18px; }
    .urlrow { display: flex; gap: 8px; }
    .url { min-width: 0; flex: 1; height: 48px; border: 1px solid #303036; border-radius: 11px; outline: 0; background: #08080a; padding: 0 13px; font-size: 14px; color: #fff; }
    .url:focus { border-color: #666; }
    .go { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 11px; background: #fff; color: #000; }
    .hint { padding: 10px 2px 0; color: #929299; font-size: 11px; line-height: 16px; }
    .offline { position: absolute; z-index: 35; right: 16px; top: 16px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: none; }
    .offline.on { display: block; }
    .drop { position: fixed; z-index: 100; inset: 12px; display: none; place-items: center; border: 2px dashed #fff; border-radius: 16px; background: rgba(0,0,0,.88); font-size: 15px; font-weight: 800; pointer-events: none; }
    .drop.on { display: grid; }
    .empty { padding: 42px 10px; text-align: center; color: #777; font-size: 13px; }

    /* === CHANNEL VIEW === */
    .channel-view { 
      display: none; 
      flex-direction: column; 
      position: fixed; 
      inset: 0; 
      z-index: 15; 
      background: var(--bg); 
      width: 100%; 
      height: 100vh; 
      height: 100dvh;
      max-width: 480px;
      left: 50%;
      transform: translateX(-50%);
    }
    .channel-view.active { display: flex; }
    .channel-header { 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      padding: 12px 16px; 
      border-bottom: 1px solid var(--border); 
      background: var(--bg); 
      flex-shrink: 0; 
      height: 60px;
    }
    .channel-header .back-btn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; background: var(--surface); color: var(--text); border: none; flex-shrink: 0; }
    .channel-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: var(--surface); flex-shrink: 0; }
    .channel-header-info { flex: 1; min-width: 0; }
    .channel-header-name { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .channel-header-sub { font-size: 12px; color: var(--text-sub); }
    .channel-header .settings-btn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; background: var(--surface); color: var(--text); border: none; flex-shrink: 0; }

    /* === CHANNEL POSTS SCROLL === */
    .channel-posts { 
      flex: 1; 
      overflow-y: scroll; 
      overflow-x: hidden;
      padding: 12px; 
      display: flex; 
      flex-direction: column; 
      gap: 16px; 
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      min-height: 0;
    }
    .channel-posts::-webkit-scrollbar { display: none; }

    .channel-post { 
      background: var(--surface); 
      border-radius: 16px; 
      border: 1px solid var(--border); 
      overflow: hidden; 
      flex-shrink: 0;
      width: 100%;
    }
    .channel-post-header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
    .channel-post-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: #222; flex-shrink: 0; }
    .channel-post-meta { flex: 1; min-width: 0; }
    .channel-post-author { font-size: 14px; font-weight: 600; }
    .channel-post-time { font-size: 11px; color: var(--text-sub); }
    .channel-post-text { padding: 0 14px 10px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
    .channel-post-media { width: 100%; display: grid; gap: 2px; }
    .channel-post-media.single { grid-template-columns: 1fr; }
    .channel-post-media.double { grid-template-columns: 1fr 1fr; }
    .channel-post-media.triple { grid-template-columns: 1fr 1fr; }
    .channel-post-media.triple .media-item:first-child { grid-column: 1 / -1; }
    .channel-post-media.quad { grid-template-columns: 1fr 1fr; }
    .channel-post-media .media-item { position: relative; aspect-ratio: 1; overflow: hidden; background: #111; cursor: pointer; }
    .channel-post-media .media-item img, .channel-post-media .media-item video { width: 100%; height: 100%; object-fit: cover; }
    .channel-post-media .media-item .media-type-icon { position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; background: rgba(0,0,0,0.6); border-radius: 6px; display: grid; place-items: center; color: #fff; }
    .channel-post-actions { display: flex; align-items: center; padding: 10px 14px; gap: 20px; border-top: 1px solid var(--border); }
    .channel-post-action { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-sub); background: none; border: none; cursor: pointer; }
    .channel-post-action.active { color: var(--accent); }
    .channel-post-action svg { width: 18px; height: 18px; }
    .channel-add-btn { position: fixed; bottom: 24px; right: 24px; width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: #fff; border: none; display: grid; place-items: center; box-shadow: 0 4px 20px rgba(254,44,85,0.4); z-index: 20; cursor: pointer; }
    .channel-add-btn:active { transform: scale(0.92); }

    /* === TG-STYLE COMMENTS SCREEN === */
    .tg-comments-screen { 
      display: none; 
      flex-direction: column; 
      position: fixed; 
      inset: 0; 
      z-index: 50; 
      background: var(--bg); 
      width: 100%; 
      height: 100vh;
      height: 100dvh;
      max-width: 480px;
      left: 50%;
      transform: translateX(-50%);
    }
    .tg-comments-screen.active { display: flex; }
    .tg-comments-header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--bg); flex-shrink: 0; height: 56px; }
    .tg-comments-header .back-btn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; background: var(--surface); color: var(--text); border: none; flex-shrink: 0; }
    .tg-comments-header-title { font-size: 16px; font-weight: 700; flex: 1; text-align: center; margin-right: 48px; }
    .tg-comments-post-preview { padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0; max-height: 40vh; overflow-y: auto; }
    .tg-comments-post-preview .preview-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .tg-comments-post-preview .preview-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #222; flex-shrink: 0; }
    .tg-comments-post-preview .preview-author { font-size: 14px; font-weight: 700; color: var(--text); }
    .tg-comments-post-preview .preview-time { font-size: 11px; color: var(--text-sub); }
    .tg-comments-post-preview .preview-text { font-size: 14px; line-height: 1.45; color: var(--text); margin-bottom: 10px; word-break: break-word; }
    .tg-comments-post-preview .preview-media { width: 100%; border-radius: 12px; overflow: hidden; margin-top: 8px; }
    .tg-comments-post-preview .preview-media img, .tg-comments-post-preview .preview-media video { width: 100%; max-height: 200px; object-fit: cover; display: block; }
    .tg-comments-post-preview .preview-media-grid { width: 100%; display: grid; gap: 2px; border-radius: 12px; overflow: hidden; margin-top: 8px; }
    .tg-comments-post-preview .preview-media-grid.single { grid-template-columns: 1fr; }
    .tg-comments-post-preview .preview-media-grid.double { grid-template-columns: 1fr 1fr; }
    .tg-comments-post-preview .preview-media-grid.triple { grid-template-columns: 1fr 1fr; }
    .tg-comments-post-preview .preview-media-grid.triple .pm-item:first-child { grid-column: 1 / -1; }
    .tg-comments-post-preview .preview-media-grid.quad { grid-template-columns: 1fr 1fr; }
    .tg-comments-post-preview .preview-media-grid .pm-item { position: relative; aspect-ratio: 1; overflow: hidden; background: #111; }
    .tg-comments-post-preview .preview-media-grid .pm-item img, .tg-comments-post-preview .preview-media-grid .pm-item video { width: 100%; height: 100%; object-fit: cover; }
    .tg-comments-list { 
      flex: 1; 
      overflow-y: scroll; 
      padding: 12px 16px; 
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      min-height: 0;
    }
    .tg-comments-list::-webkit-scrollbar { display: none; }
    .tg-comment { display: flex; gap: 10px; align-items: flex-start; flex-shrink: 0; }
    .tg-comment-avatar { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, #fe2c55, #ff6b6b); flex-shrink: 0; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #fff; }
    .tg-comment-body { flex: 1; background: var(--surface2); border-radius: 14px; padding: 10px 14px; }
    .tg-comment-author { font-weight: 600; font-size: 13px; color: var(--accent); margin-bottom: 3px; }
    .tg-comment-text { font-size: 14px; line-height: 1.4; color: var(--text); word-break: break-word; }
    .tg-comment-time { font-size: 11px; color: var(--text-sub); margin-top: 4px; }
    .tg-comments-input-row { display: flex; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--border); background: var(--bg); flex-shrink: 0; align-items: center; }
    .tg-comments-input { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 22px; padding: 10px 16px; font-size: 14px; color: #fff; outline: none; -webkit-user-select: text; }
    .tg-comments-send { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: #fff; border: none; display: grid; place-items: center; cursor: pointer; flex-shrink: 0; }
    .tg-comments-send:active { transform: scale(0.92); }
    .tg-comments-empty { text-align: center; color: var(--text-sub); font-size: 14px; padding: 40px 20px; flex-shrink: 0; }

    /* === SETTINGS / CREATE POST === */
    .channel-settings-sheet { width: min(100%, 480px); border: 1px solid var(--border); border-radius: 20px 20px 0 0; background: var(--surface); padding: 20px; }
    .channel-settings-field { margin-bottom: 14px; }
    .channel-settings-field label { display: block; font-size: 12px; color: var(--text-sub); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .channel-settings-field input, .channel-settings-field textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; font-size: 14px; color: #fff; outline: none; }
    .channel-settings-field textarea { min-height: 80px; resize: vertical; }
    .channel-settings-avatar-preview { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; background: #222; margin: 8px 0; }
    .channel-settings-save { width: 100%; padding: 14px; border-radius: 14px; background: var(--accent); color: #fff; font-size: 15px; font-weight: 700; border: none; cursor: pointer; margin-top: 8px; }
    .create-post-sheet { width: min(100%, 480px); border: 1px solid var(--border); border-radius: 20px 20px 0 0; background: var(--surface); padding: 20px; max-height: 85vh; overflow-y: auto; }
    .create-post-textarea { width: 100%; min-height: 100px; background: var(--bg); border: 1px solid var(--border); border-radius: 14px; padding: 14px; font-size: 15px; color: #fff; outline: none; resize: vertical; margin-bottom: 12px; }
    .create-post-media-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .create-post-media-row { display: flex; gap: 8px; align-items: center; }
    .create-post-media-row input { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 13px; color: #fff; outline: none; }
    .create-post-media-row select { width: 90px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px; font-size: 13px; color: #fff; outline: none; }
    .create-post-media-row .remove-media { width: 32px; height: 32px; border-radius: 8px; background: rgba(254,44,85,0.15); color: var(--accent); border: none; display: grid; place-items: center; cursor: pointer; }
    .create-post-add-media { display: flex; align-items: center; gap: 6px; padding: 10px 14px; border-radius: 10px; background: rgba(255,255,255,0.05); color: var(--text-sub); font-size: 13px; border: 1px dashed var(--border); cursor: pointer; margin-bottom: 12px; }
    .create-post-actions { display: flex; gap: 10px; }
    .create-post-actions button { flex: 1; padding: 14px; border-radius: 14px; font-size: 15px; font-weight: 700; border: none; cursor: pointer; }
    .create-post-cancel { background: var(--bg); color: var(--text); }
    .create-post-submit { background: var(--accent); color: #fff; }

  <script>

  (function(){
    "use strict";

    if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");

    var $ = function(s, r) { r = r || document; return r.querySelector(s); };
    var $$ = function(s, r) { r = r || document; return Array.from(r.querySelectorAll(s)); };

    var feed = $("#feed");
    var tpl = $("#cardTpl");
    var modal = $("#modal");
    var drawer = $("#commentsDrawer");
    var toastEl = $("#toast");
    var backdrop = $("#backdrop");

    // Firebase
    var firebaseConfig = {
      apiKey: "AIzaSyBm0mIvHVznIeF2PoFk6dtdaiT5r877wyA",
      authDomain: "meow-874ce.firebaseapp.com",
      databaseURL: "https://meow-874ce-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "meow-874ce",
      storageBucket: "meow-874ce.firebasestorage.app",
      messagingSenderId: "471541334599",
      appId: "1:471541334599:web:567af3e7dbe70a37572762"
    };
    var db = null;
    var videosRef = null;
    var firebaseLoaded = false;
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      videosRef = db.ref("videos");
    } catch(e) { console.log("Firebase init failed:", e); }

    // Variables
    var items = [];
    var current = 0;
    var lastTap = 0;
    var toastTimer;
    var io;
    var dragDepth = 0;
    var isMuted = false;
    var deviceId = localStorage.getItem("tkm-device") || ("dev_" + Math.random().toString(36).slice(2, 10));
    localStorage.setItem("tkm-device", deviceId);
    var key = "tkm-feed-v1";
    var commentKey = "tkm-comments-v1";

    function clean(x) { return String(x || "").replace(/[<>]/g, ""); }
    function compact(n) { return Intl.NumberFormat("ru", { notation: "compact", maximumFractionDigits: 1 }).format(n || 0); }

    // Firebase video listeners
    if (db) {
      videosRef.orderByChild("timestamp").limitToLast(50).on("child_added", function(snap) {
        if (!firebaseLoaded) return;
        var v = snap.val();
        if (!v || !v.src) return;
        if (items.some(function(x) { return x.src === v.src; })) return;
        items.unshift({ src: v.src, user: v.user || "@direct", desc: v.desc || "", music: v.music || "", likes: v.likes || 0, bookmarks: v.bookmarks || 0, shares: v.shares || 0, timestamp: v.timestamp });
        render();
        toast("Новое видео в ленте!");
      });

      videosRef.orderByChild("timestamp").limitToLast(50).once("value", function(snap) {
        var data = snap.val();
        if (data) {
          var vids = Object.values(data).sort(function(a, b) { return (b.timestamp || 0) - (a.timestamp || 0); });
          if (vids.length > 0) {
            items = vids.map(function(v) { return { src: v.src, user: v.user || "@direct", desc: v.desc || "", music: v.music || "", likes: v.likes || 0, bookmarks: v.bookmarks || 0, shares: v.shares || 0, timestamp: v.timestamp }; });
          }
        }
        firebaseLoaded = true;
        render();
        if (items.length > 0) activate(0, true);
      });

      db.ref("likes").on("value", function(snap) {
        var data = snap.val(); if (!data) return;
        items.forEach(function(x, i) {
          var safeSrc = encodeURIComponent(x.src).replace(/\./g, "%2E");
          if (data[safeSrc] !== undefined) {
            x.likes = data[safeSrc];
            var card = feed.children[i]; if (!card) return;
            var lc = $(".like-count", card); if (lc) lc.textContent = compact(x.likes);
          }
        });
      });

      db.ref("userLikes/" + deviceId).on("value", function(snap) {
        var data = snap.val(); if (!data) return;
        items.forEach(function(x, i) {
          var safeSrc = encodeURIComponent(x.src).replace(/\./g, "%2E");
          if (data[safeSrc] === true) {
            x.liked = true;
            var card = feed.children[i]; if (!card) return;
            var lb = $(".like-btn", card); if (lb) lb.classList.add("liked");
          } else if (data[safeSrc] === false) {
            x.liked = false;
            var card = feed.children[i]; if (!card) return;
            var lb = $(".like-btn", card); if (lb) lb.classList.remove("liked");
          }
        });
      });
    }

    function load() {
      try { var saved = JSON.parse(localStorage.getItem(key) || "[]"); if (Array.isArray(saved) && saved.length) items = saved; } catch(e) {}
      var q = new URLSearchParams(location.search).get("v");
      if (q && /^https?:\/\//i.test(q) && !items.some(function(x) { return x.src === q; })) items.unshift({ src: q, user: "@direct", desc: "", music: "", likes: 0, bookmarks: 0, shares: 0 });
    }
    function save() { try { localStorage.setItem(key, JSON.stringify(items.slice(0, 50))); } catch(e) {} }

    function getAllComments() { try { return JSON.parse(localStorage.getItem(commentKey) || "{}"); } catch(e) { return {}; } }
    function getComments(src) { return getAllComments()[src] || []; }
    function saveComments(all) { try { localStorage.setItem(commentKey, JSON.stringify(all)); } catch(e) {} }

    var activeCommentRef = null;
    function listenComments(src) {
      if (!db) return;
      if (activeCommentRef) activeCommentRef.off("value");
      var safeSrc = encodeURIComponent(src).replace(/\./g, "%2E");
      activeCommentRef = db.ref("comments/" + safeSrc);
      activeCommentRef.on("value", function(snap) {
        var data = snap.val(); if (!data) return;
        var list = Object.values(data).sort(function(a, b) { return (a.timestamp || 0) - (b.timestamp || 0); });
        var all = getAllComments(); all[src] = list.map(function(x) { return x.text; }); saveComments(all);
        if (items[current] && items[current].src === src) {
          $("#commentsCountText").textContent = list.length + " комментариев";
          $("#commentsList").innerHTML = list.length ? list.map(function(x) { return '<div class="comment-item"><div class="comment-avatar">' + clean(x.author || "@user").slice(0, 2).toUpperCase() + '</div><div class="comment-content"><span class="comment-author">' + clean(x.author || "@user") + '</span><span>' + clean(x.text) + '</span></div></div>'; }).join("") : '<div class="empty">Пока пусто</div>';
          var cc = $(".comment-count", feed.children[current]); if (cc) cc.textContent = compact(list.length);
        }
      });
    }

    function render() {
      feed.innerHTML = "";
      items.forEach(function(x, i) {
        var c = tpl.content.firstElementChild.cloneNode(true);
        c.dataset.i = i; c.dataset.src = x.src;
        $(".username", c).textContent = clean(x.user || "@direct");
        $(".description", c).textContent = clean(x.desc || "");
        $(".music-text", c).textContent = clean(x.music || "Оригинальный звук");
        $(".like-count", c).textContent = compact(x.likes);
        $(".comment-count", c).textContent = compact(getComments(x.src).length);

            var time = c.timestamp ? new Date(c.timestamp).toLocaleString("ru", { hour: "2-digit", minute: "2-digit" }) : "";
            var initials = clean(c.author || "@user").slice(0, 2).toUpperCase();
            return '<div class="tg-comment"><div class="tg-comment-avatar">' + initials + '</div><div class="tg-comment-body"><div class="tg-comment-author">' + clean(c.author || "@user") + '</div><div class="tg-comment-text">' + clean(c.text) + '</div><div class="tg-comment-time">' + time + '</div></div></div>';
          }).join("");
          // Скролл вниз к последнему комменту
          setTimeout(function() { tgCommentsList.scrollTop = tgCommentsList.scrollHeight; }, 50);
        }
        tgCommentsTitle.textContent = list.length + " комментариев";
      });

      tgCommentsScreen.classList.add("active");
    };

    function closeTgComments() {
      tgCommentsScreen.classList.remove("active");
      if (currentTgCommentsRef) { currentTgCommentsRef.off("value"); currentTgCommentsRef = null; }
      currentTgPostKey = null;
    }

    $("#tgCommentsBack").addEventListener("click", closeTgComments);

    tgCommentsSend.addEventListener("click", function() {
      var text = tgCommentsInput.value.trim();
      if (!text || !db || !currentTgPostKey) return;
      var comment = { author: "@" + deviceId.slice(-6), text: text, timestamp: firebase.database.ServerValue.TIMESTAMP };
      db.ref("channel/posts/" + currentTgPostKey + "/comments").push(comment, function(err) {
        if (err) toast("Ошибка отправки");
        else { tgCommentsInput.value = ""; toast("Комментарий отправлен"); }
      });
      if (navigator.vibrate) navigator.vibrate(8);
    });

    tgCommentsInput.addEventListener("keydown", function(e) {
      if (e.key === "Enter") tgCommentsSend.click();
    });

    window.playChanMedia = function(el, url, type) {
      if (type === "video") {
        var v = document.createElement("video"); v.src = url; v.controls = true; v.playsinline = true;
        v.style.cssText = "position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000;z-index:100;";
        v.onclick = function() { v.remove(); }; document.body.appendChild(v); v.play().catch(function() {});
      } else if (type === "audio") {
        var a = document.createElement("audio"); a.src = url; a.controls = true;
        a.style.cssText = "position:fixed;bottom:80px;left:50%;transform:translateX(-50%);width:90%;max-width:400px;z-index:100;border-radius:12px;";
        a.onended = function() { a.remove(); }; document.body.appendChild(a); a.play().catch(function() {});
      } else {
        var img = document.createElement("img"); img.src = url;
        img.style.cssText = "position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000;z-index:100;";
        img.onclick = function() { img.remove(); }; document.body.appendChild(img);
      }
    };

    window.likeChanPost = function(postKey) {
      if (!db || !postKey) return;
      var likesRef = db.ref("channel/posts/" + postKey + "/likes");
      var likedByRef = db.ref("channel/posts/" + postKey + "/likedBy/" + deviceId);
      likedByRef.once("value", function(snap) {
        if (snap.val()) { likedByRef.remove(); likesRef.transaction(function(curr) { return Math.max(0, (curr || 0) - 1); }); }
        else { likedByRef.set(true); likesRef.transaction(function(curr) { return (curr || 0) + 1; }); }
      });
      if (navigator.vibrate) navigator.vibrate(8);
    };

    window.shareChanPost = function(postKey) {
      var post = channelPostsByKey[postKey]; if (!post) return;
      var text = (post.text || "") + " — " + channelData.name;
      if (navigator.share) navigator.share({ title: channelData.name, text: text }).catch(function() {});
      else toast("Пост скопирован");
    };

    window.updateMediaUrl = function(i, url) { postMediaItems[i].url = url; };
    window.updateMediaType = function(i, type) { postMediaItems[i].type = type; };
    window.removeMedia = function(i) { postMediaItems.splice(i, 1); renderPostMediaList(); };

    $("#channelBtn").addEventListener("click", function() { channelView.classList.add("active"); document.querySelector(".nav").style.display = "none"; document.querySelector(".header").style.display = "none"; });
    $("#channelBack").addEventListener("click", function() { channelView.classList.remove("active"); document.querySelector(".nav").style.display = "flex"; document.querySelector(".header").style.display = "flex"; });

    $("#channelSettingsBtn").addEventListener("click", function() {
      $("#settingsChannelName").value = channelData.name || "";
      $("#settingsChannelAvatar").value = channelData.avatar || "";
      $("#settingsChannelDesc").value = channelData.description || "";
      $("#settingsAvatarPreview").src = channelData.avatar || "";
      channelSettingsModal.classList.add("open");
    });

    $("#closeChannelSettings").addEventListener("click", function() { channelSettingsModal.classList.remove("open"); });
    channelSettingsModal.addEventListener("click", function(e) { if (e.target === channelSettingsModal) channelSettingsModal.classList.remove("open"); });
    $("#settingsChannelAvatar").addEventListener("input", function(e) { $("#settingsAvatarPreview").src = e.target.value; });

    $("#saveChannelSettings").addEventListener("click", function() {
      if (!db) { toast("Нет подключения к Firebase"); return; }
      var newData = { name: $("#settingsChannelName").value.trim() || channelData.name, avatar: $("#settingsChannelAvatar").value.trim(), description: $("#settingsChannelDesc").value.trim(), subscribers: channelData.subscribers || 0, updatedAt: Date.now() };
      db.ref("channel/info").set(newData, function(err) { if (err) toast("Ошибка: " + err.message); else toast("Настройки сохранены!"); });
      channelSettingsModal.classList.remove("open");
    });

    $("#channelAddBtn").addEventListener("click", function() { postMediaItems = []; $("#postText").value = ""; renderPostMediaList(); createPostModal.classList.add("open"); });
    $("#closeCreatePost").addEventListener("click", function() { createPostModal.classList.remove("open"); });
    $("#cancelPost").addEventListener("click", function() { createPostModal.classList.remove("open"); });
    createPostModal.addEventListener("click", function(e) { if (e.target === createPostModal) createPostModal.classList.remove("open"); });

    function renderPostMediaList() {
      postMediaList.innerHTML = postMediaItems.map(function(m, i) {
        return '<div class="create-post-media-row"><input type="url" value="' + clean(m.url) + '" placeholder="https://..." onchange="window.updateMediaUrl(' + i + ',this.value)"><select onchange="window.updateMediaType(' + i + ',this.value)"><option value="image" ' + (m.type === "image" ? "selected" : "") + '>Фото</option><option value="video" ' + (m.type === "video" ? "selected" : "") + '>Видео</option><option value="audio" ' + (m.type === "audio" ? "selected" : "") + '>Аудио</option></select><button class="remove-media" onclick="window.removeMedia(' + i + ')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><use href="#i-close"/></svg></button></div>';
      }).join("");
    }

    $("#addMediaBtn").addEventListener("click", function() { postMediaItems.push({ url: "", type: "image" }); renderPostMediaList(); });

    $("#submitPost").addEventListener("click", function() {
      if (!db) { toast("Нет подключения к Firebase"); return; }
      var text = $("#postText").value.trim();
      var media = postMediaItems.filter(function(m) { return m.url.trim(); });
      if (!text && media.length === 0) { toast("Добавьте текст или медиа"); return; }
      var newPost = { text: text, media: media, likes: 0, likedBy: {}, comments: {}, timestamp: firebase.database.ServerValue.TIMESTAMP, author: "@" + deviceId.slice(-6) };
      db.ref("channel/posts").push(newPost, function(err) { if (err) toast("Ошибка: " + err.message); else toast("Пост опубликован! Виден всем!"); });
      createPostModal.classList.remove("open");
    });

    // INIT
    if (db) initChannelRTDB();
    load(); render();
    if (items.length > 0) activate(0, true);
  })();
  </script>
</body>
</html>
