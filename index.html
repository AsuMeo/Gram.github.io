    // Populate Pickers
    function populateStickersInPickers() {
        window.switchPickerTab = (context, tab) => {
            if (context === 'post') {
                currentPostPickerTab = tab;
                document.querySelectorAll('#post-sticker-picker .picker-tab-btn').forEach(btn => btn.classList.remove('active'));
                event.target.classList.add('active');
                document.getElementById('post-picker-title').textContent = tab === 'stickers' ? 'Стикеры Tsuyu' : 'Премиум Эмодзи Tsuyu';
            } else {
                currentCommentPickerTab = tab;
                document.querySelectorAll('#comments-sticker-picker .picker-tab-btn').forEach(btn => btn.classList.remove('active'));
                event.target.classList.add('active');
                document.getElementById('comments-picker-title').textContent = tab === 'stickers' ? 'Стикеры Tsuyu' : 'Премиум Эмодзи Tsuyu';
            }
            renderPickerGrid(context);
        };

        renderPickerGrid('post');
        renderPickerGrid('comments');
    }

    function renderPickerGrid(context) {
        const gridEl = context === 'post' ? postStickerGrid : commentsStickerGrid;
        const currentTab = context === 'post' ? currentPostPickerTab : currentCommentPickerTab;

        if (currentTab === 'stickers') {
            if (!stickerPack || stickerPack.length === 0) {
                gridEl.innerHTML = `<div style="font-size:11px;color:var(--text-secondary);grid-column:span 4;text-align:center;padding:15px 0;">Загрузите ZIP архив со стикерами в настройках профиля.</div>`;
            } else {
                gridEl.innerHTML = stickerPack.map((st, idx) => `
                    <img class="sticker-item" src="${st}" onclick="selectItem('${context}', 'sticker', ${idx})">
                `).join('');
            }
        } else {
            if (!emojiPack || emojiPack.length === 0) {
                gridEl.innerHTML = `<div style="font-size:11px;color:var(--text-secondary);grid-column:span 4;text-align:center;padding:15px 0;">Загрузите ZIP архив с эмодзи в настройках профиля.</div>`;
            } else {
                gridEl.innerHTML = emojiPack.map((em, idx) => `
                    <img class="sticker-item" src="${em}" onclick="selectItem('${context}', 'emoji', ${idx})">
                `).join('');
            }
        }
    }

    window.selectItem = function(context, type, idx) {
        if (type === 'sticker' && !channelPermissions.allowStickers) {
            alert("Стикеры запрещены владельцем канала.");
            return;
        }
        if (type === 'emoji' && !channelPermissions.allowPremiumEmoji) {
            alert("Премиум эмодзи запрещены владельцем канала.");
            return;
        }

        if (context === 'post') {
            if (type === 'sticker') {
                selectedStickerForPost = stickerPack[idx];
                postStickerPicker.classList.add('hidden');
                tgFileStatus.textContent = "Выбран стикер!";
            } else {
                insertEmojiToEditable('new-post-text', emojiPack[idx]);
                postStickerPicker.classList.add('hidden');
            }
        } else {
            if (type === 'sticker') {
                if (!activePostForComments) return;
                const now = new Date();
                const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
                
                const commentObj = {
                    id: Date.now().toString(),
                    name: userProfile.name,
                    avatar: userProfile.avatar,
                    text: '',
                    sticker: stickerPack[idx],
                    mediaList: [],
                    time: timeStr,
                    timestamp: Date.now()
                };

                db.ref(`posts/${activePostForComments.id}/comments/${commentObj.id}`).set(commentObj);
                commentsStickerPicker.classList.add('hidden');
            } else {
                insertEmojiToEditable('tg-comment-input', emojiPack[idx]);
                commentsStickerPicker.classList.add('hidden');
            }
        }
    };

    postStickerToggle.addEventListener('click', () => {
        postStickerPicker.classList.toggle('hidden');
    });

    tgCommentStickerToggle.addEventListener('click', () => {
        commentsStickerPicker.classList.toggle('hidden');
    });

    // Realtime Reactions Toggle
    window.toggleReaction = function(postId, reactionKey) {
        if (!currentUser) return;
        const post = posts.find(p => p.id === postId);
        if (!post) return;

        const postRef = db.ref(`posts/${postId}/reactions/${reactionKey}`);
        postRef.transaction((r) => {
            if (!r) {
                return {
                    count: 1,
                    emoji: reactionKey === 'heart' ? '❤️' : (reactionKey === 'cupid' ? '💘' : ''),
                    isCustom: reactionKey.startsWith('custom_'),
                    users: { [currentUser.uid]: true }
                };
            }
            if (!r.users) r.users = {};
            if (r.users[currentUser.uid]) {
                delete r.users[currentUser.uid];
                r.count = Math.max(0, (r.count || 1) - 1);
            } else {
                r.users[currentUser.uid] = true;
                r.count = (r.count || 0) + 1;
            }
            return r;
        });
    };

    // Realtime Poll Voting
    window.votePoll = function(postId, optionIndex) {
        if (!currentUser) return;
        const pollRef = db.ref(`posts/${postId}/poll`);
        pollRef.transaction((poll) => {
            if (!poll) return poll;
            if (!poll.votes) poll.votes = {};
            if (poll.votes[currentUser.uid] !== undefined) return poll; // Already voted

            poll.votes[currentUser.uid] = optionIndex;
            if (poll.options && poll.options[optionIndex]) {
                poll.options[optionIndex].votes = (poll.options[optionIndex].votes || 0) + 1;
            }
            return poll;
        });
    };

    // Open Comments Overlay
    window.openTGCommentsScreen = function(postId) {
        activePostForComments = posts.find(p => p.id === postId);
        if (!activePostForComments) return;

        originalPostContainer.innerHTML = buildPostHTML(activePostForComments, true);

        if (userProfile.avatar) {
            tgCommentUserAvatar.innerHTML = `<img src="${userProfile.avatar}">`;
        } else {
            tgCommentUserAvatar.textContent = escapeHTML((userProfile.name || 'U').substring(0, 1).toUpperCase());
        }

        renderTGCommentsFeed();
        tgCommentsScreen.classList.add('active');
    };

    function closeTGCommentsScreen() {
        tgCommentsScreen.classList.remove('active');
        activePostForComments = null;
        commentAttachedMediaList = [];
        renderCommentAttachmentsPreview();
    }

    closeCommentsBtn.addEventListener('click', closeTGCommentsScreen);

    function renderTGCommentsFeed() {
        if (!activePostForComments) return;
        const commentsObj = activePostForComments.comments || {};
        const commentsArr = Object.keys(commentsObj).map(k => commentsObj[k]).sort((a,b) => a.timestamp - b.timestamp);
        
        tgCommentsSubtitle.textContent = `${commentsArr.length} комментариев`;

        if (commentsArr.length === 0) {
            commentsFeedContainer.innerHTML = `
                <div class="empty-state" style="padding: 30px 0;">
                    <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
                    <p>Будьте первым, кто оставит комментарий!</p>
                </div>
            `;
            return;
        }

        commentsFeedContainer.innerHTML = commentsArr.map(c => {
            const avatarHtml = c.avatar ? `<img src="${c.avatar}">` : escapeHTML((c.name || 'U').substring(0, 1).toUpperCase());
            const commentMediaHtml = buildCollageHTML(c.mediaList);
            let safeCommentText = c.text || '';
            let stickerHtml = c.sticker ? `<img class="post-sticker-img" src="${c.sticker}">` : '';

            return `
                <div class="comment-item">
                    <div class="comment-avatar">${avatarHtml}</div>
                    <div class="comment-body">
                        <div class="comment-header">
                            <span class="comment-name">${escapeHTML(c.name || 'Пользователь')}</span>
                            <span class="comment-time">${escapeHTML(c.time || '')}</span>
                        </div>
                        <div class="comment-text">${safeCommentText}</div>
                        ${stickerHtml}
                        ${commentMediaHtml}
                    </div>
                </div>
            `;
        }).join('');
    }

    // Comment Multi-file Attachments (Instant processing)
    commentMultiFileInput.addEventListener('change', async (e) => {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        for (let file of files) {
            if (file.type.startsWith('image/') && !channelPermissions.allowPhotos) continue;
            if (file.type.startsWith('video/') && !channelPermissions.allowVideos) continue;
            if ((file.type.startsWith('audio/') || file.name.match(/\.(mp3|m4a|flac|wav|ogg)$/i)) && !channelPermissions.allowAudio) continue;

            if (file.type.startsWith('image/')) {
                const comp = await compressImage(file, 800, 0.8);
                commentAttachedMediaList.push({ type: 'image', src: comp });
            } else if (file.type.startsWith('video/')) {
                const dataUrl = await new Promise(res => {
                    const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(file);
                });
                commentAttachedMediaList.push({ type: 'video', src: dataUrl });
            }
        }

        renderCommentAttachmentsPreview();
    });

    function renderCommentAttachmentsPreview() {
        if (commentAttachedMediaList.length === 0) {
            commentAttachmentsPreview.classList.add('hidden');
            commentAttachmentsPreview.innerHTML = '';
            return;
        }

        commentAttachmentsPreview.innerHTML = commentAttachedMediaList.map((item, idx) => `
            <div class="attachment-thumb-item">
                ${item.type === 'video' ? `<video src="${item.src}"></video>` : `<img src="${item.src}">`}
                <button type="button" class="remove-thumb-btn" onclick="removeCommentAttachmentItem(${idx})">✕</button>
            </div>
        `).join('');

        commentAttachmentsPreview.classList.remove('hidden');
    }

    window.removeCommentAttachmentItem = function(idx) {
        commentAttachedMediaList.splice(idx, 1);
        renderCommentAttachmentsPreview();
    };

    // Send Comment to RTDB
    tgSendCommentBtn.addEventListener('click', () => {
        const text = getCleanHTMLContent('tg-comment-input').trim();
        if ((!text && commentAttachedMediaList.length === 0) || !activePostForComments) return;

        const now = new Date();
        const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
        const commentId = Date.now().toString();

        const commentObj = {
            id: commentId,
            name: userProfile.name,
            avatar: userProfile.avatar,
            text: text,
            mediaList: [...commentAttachedMediaList],
            time: timeStr,
            timestamp: Date.now()
        };

        db.ref(`posts/${activePostForComments.id}/comments/${commentId}`).set(commentObj).catch(err => {
            alert('Ошибка отправки комментария: ' + err.message);
        });

        document.getElementById('tg-comment-input').innerHTML = '';
        commentAttachedMediaList = [];
        renderCommentAttachmentsPreview();
    });

    // Create Post Attachments with Zero Artificial Delays
    tgMultiFileInput.addEventListener('change', async (e) => {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        for (let file of files) {
            if (file.type.startsWith('image/') && !channelPermissions.allowPhotos) continue;
            if (file.type.startsWith('video/') && !channelPermissions.allowVideos) continue;
            if ((file.type.startsWith('audio/') || file.name.match(/\.(mp3|m4a|flac|wav|ogg)$/i)) && !channelPermissions.allowAudio) continue;

            if (file.type.startsWith('image/')) {
                const comp = await compressImage(file, 900, 0.8);
                attachedMediaList.push({ type: 'image', src: comp });
            } else if (file.type.startsWith('video/')) {
                const dataUrl = await new Promise(res => {
                    const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(file);
                });
                attachedMediaList.push({ type: 'video', src: dataUrl });
            } else if (file.type.startsWith('audio/') || file.name.match(/\.(mp3|m4a|flac|wav|ogg)$/i)) {
                const dataUrl = await new Promise(res => {
                    const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(file);
                });
                const tags = await readAudioTags(file);
                attachedMediaList.push({
                    type: 'audio',
                    src: dataUrl,
                    title: tags.title,
                    artist: tags.artist,
                    cover: tags.cover,
                    userProvidedCover: null
                });
            }
        }

        renderAttachmentsPreviewInModal();
    });

    function renderAttachmentsPreviewInModal() {
        if (attachedMediaList.length === 0) {
            modalAttachmentsPreview.classList.add('hidden');
            modalAttachmentsPreview.innerHTML = '';
            tgFileStatus.textContent = 'Прикрепить фото, видео, музыку, стикер...';
            return;
        }

        modalAttachmentsPreview.innerHTML = attachedMediaList.map((item, idx) => {
            if (item.type === 'image') {
                return `
                    <div class="attachment-thumb-item">
                        <img src="${item.src}">
                        <button type="button" class="remove-thumb-btn" onclick="removeAttachmentItem(${idx})">✕</button>
                    </div>
                `;
            } else if (item.type === 'video') {
                return `
                    <div class="attachment-thumb-item">
                        <video src="${item.src}"></video>
                        <button type="button" class="remove-thumb-btn" onclick="removeAttachmentItem(${idx})">✕</button>
                    </div>
                `;
            } else {
                const currentCover = item.userProvidedCover || item.cover;
                return `
                    <div class="attachment-thumb-item audio-thumb">
                        <div class="audio-thumb-cover">
                            ${currentCover ? `<img src="${currentCover}">` : `🎵`}
                        </div>
                        <div class="audio-thumb-info">
                            <div>${escapeHTML(item.title)}</div>
                            <div>${escapeHTML(item.artist)}</div>
                        </div>
                        <button type="button" class="remove-thumb-btn" onclick="removeAttachmentItem(${idx})">✕</button>
                    </div>
                `;
            }
        }).join('');

        modalAttachmentsPreview.classList.remove('hidden');
    }

    window.removeAttachmentItem = function(index) {
        attachedMediaList.splice(index, 1);
        renderAttachmentsPreviewInModal();
    };

    function clearModalAttachments() {
        attachedMediaList = [];
        selectedStickerForPost = null;
        tgMultiFileInput.value = '';
        renderAttachmentsPreviewInModal();
    }

    // Modal Sheet Controls
    openCreateModalBtn.addEventListener('click', () => {
        createModal.classList.add('open');
    });

    createModal.addEventListener('click', (e) => {
        if (e.target === createModal) createModal.classList.remove('open');
    });

    // Header Logout Action Button
    headerLogoutBtn.addEventListener('click', () => {
        auth.signOut().then(() => {
            fullscreenAuthScreen.classList.remove('hidden');
        });
    });

    // Auth Screen Tab Toggle (Full screen Login / Register)
    window.setAuthTab = function(mode) {
        authMode = mode;
        const errBox = document.getElementById('auth-error-msg');
        errBox.style.display = 'none';

        if (mode === 'login') {
            document.getElementById('auth-tab-login').classList.add('active');
            document.getElementById('auth-tab-register').classList.remove('active');
            document.getElementById('reg-name-group').style.display = 'none';
            document.getElementById('auth-submit-btn').textContent = 'Войти';
        } else {
            document.getElementById('auth-tab-register').classList.add('active');
            document.getElementById('auth-tab-login').classList.remove('active');
            document.getElementById('reg-name-group').style.display = 'flex';
            document.getElementById('auth-submit-btn').textContent = 'Зарегистрироваться';
        }
    };

    // Submit Authentication (Mandatory Email Auth)
    document.getElementById('auth-submit-btn').addEventListener('click', async () => {
        const email = document.getElementById('auth-email-input').value.trim();
        const pass = document.getElementById('auth-password-input').value.trim();
        const name = document.getElementById('auth-name-input').value.trim();
        const errBox = document.getElementById('auth-error-msg');
        errBox.style.display = 'none';

        if (!email || !pass) {
            errBox.textContent = 'Пожалуйста, укажите email и пароль';
            errBox.style.display = 'block';
            return;
        }

        try {
            if (authMode === 'register') {
                const res = await auth.createUserWithEmailAndPassword(email, pass);
                if (name) userProfile.name = name;
                await db.ref(`users/${res.user.uid}`).set(userProfile);
            } else {
                await auth.signInWithEmailAndPassword(email, pass);
            }
            fullscreenAuthScreen.classList.add('hidden');
        } catch (err) {
            errBox.textContent = 'Ошибка авторизации: ' + err.message;
            errBox.style.display = 'block';
        }
    });

    // Publish Post to Firebase RTDB (INSTANT REALTIME PUBLISHING FOR ALL USERS)
    publishBtn.addEventListener('click', () => {
        const text = getCleanHTMLContent('new-post-text').trim();
        const pollInput = document.getElementById('new-post-poll').value.trim();

        if (!text && attachedMediaList.length === 0 && !selectedStickerForPost) {
            alert('Введите текст сообщения, прикрепите файлы или выберите стикер!');
            return;
        }

        let pollObj = null;
        if (pollInput) {
            const optionsArr = pollInput.split(',').map(s => s.trim()).filter(Boolean);
            if (optionsArr.length >= 2) {
                pollObj = {
                    question: "Опрос:",
                    options: optionsArr.map(opt => ({ text: opt, votes: 0 })),
                    votes: {}
                };
            }
        }

        const mediaList = attachedMediaList.filter(m => m.type === 'image' || m.type === 'video');
        const audioList = attachedMediaList.filter(m => m.type === 'audio');

        const now = new Date();
        const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
        const newPostRef = db.ref('posts').push();

        const defaultReactions = {
            heart: { count: 0, emoji: "❤️", isCustom: false },
            cupid: { count: 0, emoji: "💘", isCustom: false }
        };

        const initialViewsMap = {};
        if (currentUser) initialViewsMap[currentUser.uid] = true;

        const newPostData = {
            author: userProfile.name || channelConfig.name,
            authorAvatar: userProfile.avatar || channelConfig.avatar,
            time: timeStr,
            timestamp: Date.now(),
            text: text,
            mediaList: mediaList,
            audioList: audioList,
            sticker: selectedStickerForPost,
            poll: pollObj,
            reactions: defaultReactions,
            viewsMap: initialViewsMap,
            views: 1
        };

        newPostRef.set(newPostData).then(() => {
            document.getElementById('new-post-text').innerHTML = '';
            document.getElementById('new-post-poll').value = '';
            clearModalAttachments();
            createModal.classList.remove('open');
        }).catch(err => {
            alert('Ошибка публикации в Firebase RTDB: ' + err.message);
        });
    });

    // Navigation Tabs
    navItems.forEach(item => {
        item.addEventListener('click', () => {
            navItems.forEach(nav => nav.classList.remove('active'));
            item.classList.add('active');
            currentTab = item.getAttribute('data-tab');
            renderFeed();
        });
    });

    searchToggleBtn.addEventListener('click', () => {
        searchBarWrapper.classList.toggle('hidden');
        if (!searchBarWrapper.classList.contains('hidden')) {
            searchInput.focus();
        } else {
            searchQuery = '';
            searchInput.value = '';
            renderFeed();
        }
    });

    searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderFeed();
    });
</script>

</body>
</html>
