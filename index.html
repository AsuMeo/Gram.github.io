<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Telegram Video Note Sender</title>
    <style>
        :root {
            --bg-dark: #050508;
            --bg-surface: #0c0d12;
            --bg-input: #14161f;
            --accent: #2481cc;          
            --accent-hover: #2f94e3;
            --text-main: #f0f2f5;
            --text-muted: #70798a;
            --error: #ff4d4d;
            --success: #2ecc71;
            --border-color: #1a1d29;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            height: 100dvh;
            padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            position: relative;
        }

        .header {
            width: 100%;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(12, 13, 18, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            z-index: 10;
        }

        .header h1 {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #fff 0%, #a0a5b5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .settings-btn {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .settings-btn:active {
            transform: scale(0.96);
        }

        /* Центральная зона с камерным кругом */
        .camera-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            position: relative;
        }

        .circle-viewport {
            width: min(300px, 75vw);
            height: min(300px, 75vw);
            border-radius: 50%;
            overflow: hidden;
            position: relative;
            background: var(--bg-surface);
            border: 4px solid var(--accent);
            box-shadow: 0 0 35px rgba(36, 129, 204, 0.25);
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .circle-viewport.recording {
            border-color: var(--error);
            box-shadow: 0 0 40px rgba(255, 77, 77, 0.4);
            animation: pulse-ring 1.5s infinite;
        }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0.5); }
            70% { box-shadow: 0 0 0 20px rgba(255, 77, 77, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0); }
        }

        #camera-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Зеркально для селфи */
        }

        #camera-preview.back-camera {
            transform: scaleX(1);
        }

        .timer-badge {
            margin-top: 20px;
            background: rgba(20, 22, 31, 0.9);
            border: 1px solid var(--border-color);
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: 700;
            font-mono: monospace;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 1px;
        }

        .recording-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--error);
            display: none;
        }

        .recording-dot.active {
            display: block;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        .status-msg {
            margin-top: 12px;
            font-size: 13.5px;
            color: var(--text-muted);
            text-align: center;
            min-height: 20px;
            padding: 0 20px;
        }

        .status-msg.error { color: var(--error); }
        .status-msg.success { color: var(--success); }

        /* Панель управления снизу */
        .controls-bar {
            width: 100%;
            padding: 30px 20px 40px 20px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            background: var(--bg-surface);
            border-top: 1px solid var(--border-color);
        }

        .action-icon-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .action-icon-btn:active {
            transform: scale(0.92);
        }

        .record-main-btn {
            width: 78px;
            height: 78px;
            border-radius: 50%;
            background: var(--accent);
            border: 4px solid var(--bg-surface);
            box-shadow: 0 0 0 3px var(--accent);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .record-main-btn:active {
            transform: scale(0.92);
        }

        .record-main-btn.recording {
            background: var(--error);
            box-shadow: 0 0 0 3px var(--error);
            border-radius: 24px;
        }

        /* Модалка настроек (Токен и Chat ID) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(8px);
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            width: 90%;
            max-width: 380px;
            border-radius: 24px;
            padding: 28px 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .modal h2 {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 8px;
            color: white;
        }

        .modal p {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .modal-input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: white;
            font-size: 14px;
            outline: none;
        }

        .modal-input:focus {
            border-color: var(--accent);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: var(--accent);
            color: white;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }

        .btn:active { transform: scale(0.98); }

        .security-badge {
            margin-top: 15px;
            font-size: 11px;
            color: var(--success);
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
            Кружочки TG
        </h1>
        <button class="settings-btn" onclick="openSettings()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            Настройки
        </button>
    </div>

    <div class="camera-container">
        <div class="circle-viewport" id="viewport-box">
            <video id="camera-preview" autoplay playsinline muted></video>
        </div>

        <div class="timer-badge">
            <div class="recording-dot" id="rec-dot"></div>
            <span id="timer-display">00:00</span>
        </div>

        <div class="status-msg" id="status-display">Нажмите кнопку снизу, чтобы начать запись</div>
    </div>

    <div class="controls-bar">
        <button class="action-icon-btn" onclick="toggleCameraFacing()" title="Сменить камеру">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0-4.42-3.58-8-8-8s-8 3.58-8 8c0 1.58.46 3.05 1.25 4.3L2 17l2.7-.25C6.12 18.06 8.89 19 12 19c4.42 0 8-3.58 8-8z"/><path d="M16 14l4 4-4 4"/></svg>
        </button>

        <button class="record-main-btn" id="record-btn" onclick="toggleRecording()">
            <svg id="record-icon" width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="8"/></svg>
        </button>

        <button class="action-icon-btn" onclick="cancelRecording()" title="Сбросить">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
    </div>

    <!-- Модалка настроек -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal">
            <h2>Настройки бота</h2>
            <p>Введите токен бота и Chat ID получателя. Настройки сохраняются в IndexedDB, видео-кеш НЕ сохраняется.</p>

            <div class="input-group">
                <label>BOT TOKEN</label>
                <input type="password" id="bot-token-input" class="modal-input" placeholder="123456789:AAH...">
            </div>

            <div class="input-group">
                <label>CHAT ID ПОЛУЧАТЕЛЯ</label>
                <input type="text" id="chat-id-input" class="modal-input" placeholder="например, 987654321 или -100...">
            </div>

            <button class="btn" onclick="saveSettings()">СОХРАНИТЬ</button>

            <div class="security-badge">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                Защита включена: 0 байт кеша на диске
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // INDEXEDDB ДЛЯ СОХРАНЕНИЯ ТОЛЬКО ТОКЕНА И CHAT_ID
        // ==========================================
        let dbInstance = null;

        function initIndexedDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open("BotVideoNoteDB", 1);
                request.onupgradeneeded = function(e) {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains("config")) {
                        db.createObjectStore("config");
                    }
                };
                request.onsuccess = function(e) {
                    dbInstance = e.target.result;
                    resolve(dbInstance);
                };
                request.onerror = function(e) {
                    console.error("IndexedDB error:", e);
                    reject(e);
                };
            });
        }

        function dbGet(key) {
            return new Promise((resolve) => {
                if (!dbInstance) return resolve(null);
                const tx = dbInstance.transaction(["config"], "readonly");
                const store = tx.objectStore("config");
                const req = store.get(key);
                req.onsuccess = () => resolve(req.result || null);
                req.onerror = () => resolve(null);
            });
        }

        function dbSet(key, val) {
            return new Promise((resolve) => {
                if (!dbInstance) return resolve();
                const tx = dbInstance.transaction(["config"], "readwrite");
                const store = tx.objectStore("config");
                const req = store.put(val, key);
                req.onsuccess = () => resolve();
                req.onerror = () => resolve();
            });
        }

        // ==========================================
        // ГАРАНТИРОВАННОЕ НУЛЕВОЕ ХРАНЕНИЕ МЕДИА (ZERO CACHE)
        // ==========================================
        let activeStream = null;
        let mediaRecorder = null;
        let videoChunks = [];
        let isRecording = false;
        let facingMode = 'user'; // 'user' | 'environment'
        let timerInterval = null;
        let secondsElapsed = 0;

        let botToken = "";
        let targetChatId = "";

        // Жесткая очистка RAM / Blob после каждой отправки или сброса
        function destroyAllMediaAndCache() {
            // 1. Очистка массива чанков
            videoChunks = [];

            // 2. Полная остановка записи если шла
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                try { mediaRecorder.stop(); } catch(e) {}
            }
            mediaRecorder = null;

            // 3. Отвязка видеоэлементов в DOM
            const videoEl = document.getElementById('camera-preview');
            if (videoEl && !activeStream) {
                videoEl.pause();
                videoEl.src = '';
                videoEl.removeAttribute('src');
                videoEl.load();
            }

            console.log("⚡ [БЕЗОПАСНОСТЬ] Вся память RAM, сырые фрагменты и видео-буферы уничтожены!");
        }

        // Дополнительные триггеры безопасности при сворачивании / переходе / выходе
        setInterval(destroyAllMediaAndCache, 3 * 60 * 1000);
        document.addEventListener('visibilitychange', () => { if (document.hidden) destroyAllMediaAndCache(); });
        window.addEventListener('beforeunload', destroyAllMediaAndCache);
        window.addEventListener('pagehide', destroyAllMediaAndCache);
        window.addEventListener('blur', destroyAllMediaAndCache);

        // ==========================================
        // ИНИЦИАЛИЗАЦИЯ И КАМЕРА
        // ==========================================
        window.onload = async function() {
            try {
                await initIndexedDB();
                botToken = await dbGet("bot_token") || "";
                targetChatId = await dbGet("target_chat_id") || "";

                if (!botToken || !targetChatId) {
                    openSettings();
                }

                await initCamera();
            } catch(e) {
                showStatus("Ошибка доступа к камере: " + e.message, "error");
            }
        };

        async function initCamera() {
            if (activeStream) {
                activeStream.getTracks().forEach(track => track.stop());
            }

            const videoEl = document.getElementById('camera-preview');
            const constraints = {
                video: {
                    facingMode: facingMode,
                    width: { ideal: 480 },
                    height: { ideal: 480 }
                },
                audio: true
            };

            try {
                activeStream = await navigator.mediaDevices.getUserMedia(constraints);
                videoEl.srcObject = activeStream;
                if (facingMode === 'environment') {
                    videoEl.classList.add('back-camera');
                } else {
                    videoEl.classList.remove('back-camera');
                }
            } catch (err) {
                showStatus("Ошибка включения камеры: " + err.message, "error");
            }
        }

        async function toggleCameraFacing() {
            if (isRecording) return;
            facingMode = (facingMode === 'user') ? 'environment' : 'user';
            await initCamera();
        }

        // ==========================================
        // ЗАПИСЬ И ОТПРАВКА КРУЖОЧКА
        // ==========================================
        async function toggleRecording() {
            if (!botToken || !targetChatId) {
                alert("Сначала укажите Bot Token и Chat ID в настройках!");
                openSettings();
                return;
            }

            if (!isRecording) {
                startRecording();
            } else {
                stopAndSendRecording();
            }
        }

        function startRecording() {
            if (!activeStream) return;

            videoChunks = [];
            let options = { mimeType: 'video/webm;codecs=vp9,opus' };
            
            if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                options = { mimeType: 'video/webm' };
                if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                    options = {}; // дефолтный формат браузера
                }
            }

            try {
                mediaRecorder = new MediaRecorder(activeStream, options);
            } catch(e) {
                showStatus("Не поддерживается данный формат записи: " + e.message, "error");
                return;
            }

            mediaRecorder.ondataavailable = e => {
                if (e.data && e.data.size > 0) {
                    videoChunks.push(e.data);
                }
            };

            mediaRecorder.start(100); // собираем сэмплы каждые 100мс
            isRecording = true;

            // Обновление UI
            document.getElementById('viewport-box').classList.add('recording');
            document.getElementById('record-btn').classList.add('recording');
            document.getElementById('record-icon').innerHTML = '<rect x="6" y="6" width="12" height="12" rx="2"/>';
            document.getElementById('rec-dot').classList.add('active');
            showStatus("Запись видеосообщения...", "");

            secondsElapsed = 0;
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                secondsElapsed++;
                updateTimerDisplay();
                if (secondsElapsed >= 60) { // Telegram видеосообщения макс 1 мин
                    stopAndSendRecording();
                }
            }, 1000);
        }

        function stopAndSendRecording() {
            if (!mediaRecorder || mediaRecorder.state === 'inactive') return;

            clearInterval(timerInterval);
            document.getElementById('rec-dot').classList.remove('active');
            document.getElementById('viewport-box').classList.remove('recording');
            document.getElementById('record-btn').classList.remove('recording');
            document.getElementById('record-icon').innerHTML = '<circle cx="12" cy="12" r="8"/>';

            showStatus("Отправка в Telegram...", "");

            mediaRecorder.onstop = async () => {
                isRecording = false;

                // Создаем временный Blob в RAM исключительно для передачи по сети
                const videoBlob = new Blob(videoChunks, { type: 'video/webm' });

                try {
                    const formData = new FormData();
                    formData.append('chat_id', targetChatId);
                    formData.append('video_note', videoBlob, 'note.webm');

                    const response = await fetch(`https://api.telegram.org/bot${botToken}/sendVideoNote`, {
                        method: 'POST',
                        body: formData
                    });

                    const data = await response.json();

                    if (data.ok) {
                        showStatus("✅ Кружочек успешно отправлен!", "success");
                    } else {
                        showStatus("❌ Ошибка отправки: " + (data.description || "Неизвестная ошибка"), "error");
                    }
                } catch (e) {
                    showStatus("❌ Ошибка соединения: " + e.message, "error");
                } finally {
                    // МОМЕНТАЛЬНОЕ УНИЧТОЖЕНИЕ КЕША ПОСЛЕ ЗАВЕРШЕНИЯ ЗАПРОСА
                    destroyAllMediaAndCache();
                    secondsElapsed = 0;
                    updateTimerDisplay();
                }
            };

            mediaRecorder.stop();
        }

        function cancelRecording() {
            if (isRecording) {
                clearInterval(timerInterval);
                if (mediaRecorder) mediaRecorder.stop();
                isRecording = false;
                document.getElementById('rec-dot').classList.remove('active');
                document.getElementById('viewport-box').classList.remove('recording');
                document.getElementById('record-btn').classList.remove('recording');
                document.getElementById('record-icon').innerHTML = '<circle cx="12" cy="12" r="8"/>';
            }
            destroyAllMediaAndCache();
            secondsElapsed = 0;
            updateTimerDisplay();
            showStatus("Запись отменена и кеш зачищен.", "");
        }

        function updateTimerDisplay() {
            const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
            const secs = String(secondsElapsed % 60).padStart(2, '0');
            document.getElementById('timer-display').innerText = `${mins}:${secs}`;
        }

        function showStatus(text, type) {
            const el = document.getElementById('status-display');
            el.innerText = text;
            el.className = "status-msg " + (type || "");
        }

        // ==========================================
        // НАСТРОЙКИ (IndexedDB)
        // ==========================================
        function openSettings() {
            document.getElementById('bot-token-input').value = botToken;
            document.getElementById('chat-id-input').value = targetChatId;
            document.getElementById('settings-modal').classList.add('active');
        }

        async function saveSettings() {
            const tokenVal = document.getElementById('bot-token-input').value.trim();
            const chatIdVal = document.getElementById('chat-id-input').value.trim();

            if (!tokenVal || !chatIdVal) {
                alert("Пожалуйста, заполните оба поля!");
                return;
            }

            botToken = tokenVal;
            targetChatId = chatIdVal;

            await dbSet("bot_token", botToken);
            await dbSet("target_chat_id", targetChatId);

            document.getElementById('settings-modal').classList.remove('active');
            showStatus("Настройки сохранены. Готов к записи!", "success");
        }
    </script>
</body>
</html>
