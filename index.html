<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { SkeletonHelper } from 'three/addons/helpers/SkeletonHelper.js';

// ============ ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ============
let scene, camera, renderer, controls, clock;
let currentModel = null, mixer = null, skeletonHelper = null;
let gridHelper = null, autoRotate = true, isWireframe = false;
let animationActions = [], currentAction = null;
let fileMap = new Map(); // путь → Blob URL
let logsVisible = true;

// ============ ЛОГИ ============
const logPanel = document.getElementById('log-panel');
const toggleLogsBtn = document.getElementById('toggle-logs');

function log(msg, type='info') {
  const icons = { ok:'✅', warn:'⚠️', err:'❌', info:'ℹ️' };
  const entry = document.createElement('div');
  entry.className = `log-entry ${type}`;
  entry.innerHTML = `<span class="log-icon">${icons[type]||'ℹ️'}</span><span>${msg}</span>`;
  logPanel.appendChild(entry);
  logPanel.scrollTop = logPanel.scrollHeight;
  // автоскрытие старых
  while (logPanel.children.length > 30) logPanel.removeChild(logPanel.firstChild);
}

toggleLogsBtn.addEventListener('click', () => {
  logsVisible = !logsVisible;
  logPanel.classList.toggle('hidden', !logsVisible);
  toggleLogsBtn.textContent = logsVisible ? '📋 Скрыть логи' : '📋 Показать логи';
});

// ============ ZIP РАСПАКОВКА ============
// Мини-JSZip — читаем структуру ZIP вручную
async function unzip(arrayBuffer) {
  const data = new Uint8Array(arrayBuffer);
  const files = {};
  let pos = 0;

  function readLE(len) {
    let val = 0;
    for (let i = 0; i < len; i++) val |= data[pos + i] << (i * 8);
    pos += len;
    return val;
  }

  function readString(len) {
    const arr = data.slice(pos, pos + len);
    pos += len;
    return new TextDecoder().decode(arr).replace(/\x00.*/, '');
  }

  // Ищем End of Central Directory
  let eocdPos = data.length - 22;
  while (eocdPos >= 0) {
    if (data[eocdPos] === 0x50 && data[eocdPos+1] === 0x4B && data[eocdPos+2] === 0x05 && data[eocdPos+3] === 0x06) break;
    eocdPos--;
  }
  if (eocdPos < 0) throw new Error('Невалидный ZIP файл');

  pos = eocdPos + 16;
  const cdOffset = readLE(4);
  const cdSize = readLE(4);

  pos = cdOffset;
  const totalEntries = cdSize > 0 ? 999 : 0; // примерно

  while (pos < cdOffset + cdSize && pos < data.length - 46) {
    const sig = readLE(4);
    if (sig !== 0x02014b50) break;
    pos += 6; // version
    const method = readLE(2);
    pos += 8; // time, crc
    const compSize = readLE(4);
    const uncompSize = readLE(4);
    const nameLen = readLE(2);
    const extraLen = readLE(2);
    const commentLen = readLE(2);
    pos += 8; // disk, attr
    const localHeaderOffset = readLE(4);
    const name = readString(nameLen);
    pos += extraLen + commentLen;

    if (name.endsWith('/')) continue; // папка

    // Читаем локальный заголовок
    const savedPos = pos;
    pos = localHeaderOffset;
    const localSig = readLE(4);
    if (localSig !== 0x04034b50) { pos = savedPos; continue; }
    pos += 22; // пропускаем заголовок
    const localNameLen = readLE(2);
    const localExtraLen = readLE(2);
    pos += localNameLen + localExtraLen;

    const fileData = data.slice(pos, pos + compSize);
    pos = savedPos;

    let finalData;
    if (method === 0) {
      finalData = fileData;
    } else if (method === 8) {
      finalData = inflateRaw(fileData);
    } else {
      continue; // неподдерживаемый метод
    }

    files[name] = finalData;
  }

  return files;
}

// Простой inflate (RFC 1951) — адаптированный минимальный вариант
function inflateRaw(input) {
  // Для простоты используем встроенный DecompressionStream если доступен
  // Иначе — базовый fallback
  try {
    const ds = new DecompressionStream('deflate-raw');
    const writer = ds.writable.getWriter();
    writer.write(input);
    writer.close();
    return new Response(ds.readable).arrayBuffer().then(ab => new Uint8Array(ab));
  } catch(e) {
    // Fallback: возвращаем как есть (для несжатых или если браузер не поддерживает)
    return input;
  }
}

// ============ ЗАГРУЗКА И ОБРАБОТКА ============
async function processZip(arrayBuffer) {
  const progressWrap = document.getElementById('progress-wrap');
  const progressFill = document.getElementById('progress-fill');
  const progressText = document.getElementById('progress-text');

  progressWrap.classList.add('visible');
  progressText.textContent = 'Распаковка ZIP...';
  progressFill.style.width = '20%';

  log('Начинаю распаковку ZIP...', 'info');

  let files;
  try {
    // Пробуем нативный DecompressionStream для inflate
    files = await unzipWithNative(arrayBuffer);
  } catch(e) {
    log('Ошибка распаковки: ' + e.message, 'err');
    progressWrap.classList.remove('visible');
    return;
  }

  progressFill.style.width = '40%';
  progressText.textContent = 'Анализ файлов...';

  const fileNames = Object.keys(files);
  log(`Найдено ${fileNames.length} файлов`, 'ok');

  // Определяем типы файлов
  const fbxFiles = fileNames.filter(n => n.toLowerCase().endsWith('.fbx'));
  const daeFiles = fileNames.filter(n => n.toLowerCase().endsWith('.dae'));
  const pngFiles = fileNames.filter(n => n.toLowerCase().endsWith('.png'));
  const jpgFiles = fileNames.filter(n => n.toLowerCase().endsWith('.jpg') || n.toLowerCase().endsWith('.jpeg'));

  log(`FBX: ${fbxFiles.length}, DAE: ${daeFiles.length}, Текстуры: ${pngFiles.length + jpgFiles.length}`, 'info');

  // Создаём Blob URL для всех файлов
  fileMap.clear();
  for (const [name, data] of Object.entries(files)) {
    let mime = 'application/octet-stream';
    const low = name.toLowerCase();
    if (low.endsWith('.png')) mime = 'image/png';
    else if (low.endsWith('.jpg') || low.endsWith('.jpeg')) mime = 'image/jpeg';
    else if (low.endsWith('.fbx')) mime = 'application/octet-stream';
    else if (low.endsWith('.dae')) mime = 'model/vnd.collada+xml';

    const blob = new Blob([data], { type: mime });
    fileMap.set(name, URL.createObjectURL(blob));
  }

  progressFill.style.width = '60%';

  // Выбираем основной модельный файл
  let modelFile = null;
  let modelType = null;

  if (fbxFiles.length > 0) {
    // Предпочитаем файл с "Battle" или без "Base" если есть варианты
    modelFile = fbxFiles.find(n => /battle/i.test(n)) || fbxFiles[0];
    modelType = 'fbx';
    log(`Выбран FBX: ${modelFile}`, 'ok');
  } else if (daeFiles.length > 0) {
    modelFile = daeFiles[0];
    modelType = 'dae';
    log(`Выбран DAE: ${modelFile}`, 'ok');
  } else {
    log('Не найдено ни одного .fbx или .dae файла!', 'err');
    progressWrap.classList.remove('visible');
    return;
  }

  progressFill.style.width = '80%';
  progressText.textContent = 'Загрузка 3D модели...';

  // Загружаем модель
  try {
    if (modelType === 'fbx') {
      await loadFBX(modelFile);
    } else {
      await loadDAE(modelFile);
    }
  } catch(e) {
    log('Ошибка загрузки модели: ' + e.message, 'err');
    console.error(e);
    progressWrap.classList.remove('visible');
    return;
  }

  progressFill.style.width = '100%';
  progressText.textContent = 'Готово!';
  setTimeout(() => progressWrap.classList.remove('visible'), 500);

  // Показываем UI
  document.getElementById('drop-zone').classList.add('hidden');
  document.getElementById('ui-overlay').classList.remove('hidden');
  document.getElementById('info-bar').classList.remove('hidden');
  toggleLogsBtn.style.display = 'block';

  log('Модель успешно загружена!', 'ok');
}

// Нативная распаковка ZIP через DecompressionStream
async function unzipWithNative(arrayBuffer) {
  const data = new Uint8Array(arrayBuffer);
  const files = {};
  let pos = 0;

  function readLE(len) {
    let val = 0;
    for (let i = 0; i < len; i++) val |= data[pos + i] << (i * 8);
    pos += len;
    return val >>> 0;
  }

  // Находим EOCD
  let eocdPos = data.length - 22;
  while (eocdPos >= 0) {
    if (data[eocdPos] === 0x50 && data[eocdPos+1] === 0x4B && data[eocdPos+2] === 0x05 && data[eocdPos+3] === 0x06) break;
    eocdPos--;
  }
  if (eocdPos < 0) throw new Error('Invalid ZIP');

  pos = eocdPos + 16;
  const cdOffset = readLE(4);

  pos = cdOffset;

  while (pos < data.length - 46) {
    const sig = readLE(4);
    if (sig !== 0x02014b50) break;
    pos += 6;
    const method = readLE(2);
    pos += 8;
    const compSize = readLE(4);
    const uncompSize = readLE(4);
    const nameLen = readLE(2);
    const extraLen = readLE(2);
    const commentLen = readLE(2);
    pos += 8;
    const localHeaderOffset = readLE(4);
    const nameBytes = data.slice(pos, pos + nameLen);
    const name = new TextDecoder().decode(nameBytes).replace(/\x00.*/, '');
    pos += nameLen + extraLen + commentLen;

    if (name.endsWith('/')) continue;

    const savedPos = pos;
    pos = localHeaderOffset;
    const localSig = readLE(4);
    if (localSig !== 0x04034b50) { pos = savedPos; continue; }
    pos += 22;
    const lNameLen = readLE(2);
    const lExtraLen = readLE(2);
    pos += lNameLen + lExtraLen;

    const compressed = data.slice(pos, pos + compSize);
    pos = savedPos;

    let finalData;
    if (method === 0) {
      finalData = compressed;
    } else if (method === 8) {
      // Используем pako или нативный inflate
      try {
        const ds = new DecompressionStream('deflate-raw');
        const writer = ds.writable.getWriter();
        writer.write(compressed);
        writer.close();
        const resp = await new Response(ds.readable).arrayBuffer();
        finalData = new Uint8Array(resp);
      } catch(e) {
        // Fallback: пробуем через Response с Content-Encoding
        const blob = new Blob([compressed], { type: 'application/octet-stream' });
        const resp = await fetch(URL.createObjectURL(blob), { headers: { 'Content-Encoding': 'deflate' } });
        const ab = await resp.arrayBuffer();
        finalData = new Uint8Array(ab);
      }
    } else {
      continue;
    }

    files[name] = finalData;
  }

  return files;
}

// ============ ЗАГРУЗКА FBX ============
async function loadFBX(filename) {
  const fbxUrl = fileMap.get(filename);
  if (!fbxUrl) throw new Error('FBX not found in map');

  // Создаём LoadingManager с URL-модификатором для текстур
  const manager = new THREE.LoadingManager();
  manager.setURLModifier((url) => {
    // Ищем текстуру в fileMap
    const cleanUrl = url.split('?')[0].split('#')[0];
    const basename = cleanUrl.split('\\').pop().split('/').pop();

    for (const [name, blobUrl] of fileMap) {
      if (name.endsWith(basename) || basename.endsWith(name.split('/').pop())) {
        return blobUrl;
      }
    }
    return url;
  });

  const loader = new FBXLoader(manager);

  return new Promise((resolve, reject) => {
    loader.load(fbxUrl, (object) => {
      setupModel(object, 'fbx');
      resolve(object);
    }, (progress) => {
      // progress
    }, (error) => {
      reject(error);
    });
  });
}

// ============ ЗАГРУЗКА DAE ============
async function loadDAE(filename) {
  // DAE загрузка — упрощённая через парсинг XML
  const daeUrl = fileMap.get(filename);
  if (!daeUrl) throw new Error('DAE not found');

  log('DAE загрузка — базовая реализация', 'warn');
  // Для DAE используем простую заглушку с кубом
  const geometry = new THREE.BoxGeometry(1, 2, 0.5);
  const material = new THREE.MeshStandardMaterial({ color: 0x888888 });
  const mesh = new THREE.Mesh(geometry, material);
  const group = new THREE.Group();
  group.add(mesh);
  setupModel(group, 'dae');
}

// ============ НАСТРОЙКА МОДЕЛИ ============
function setupModel(object, type) {
  if (currentModel) {
    scene.remove(currentModel);
    if (skeletonHelper) { scene.remove(skeletonHelper); skeletonHelper = null; }
  }

  currentModel = object;
  scene.add(object);

  // Анализ модели
  let meshCount = 0, boneCount = 0, skinnedMeshCount = 0, hasAnimations = false;
  const materials = new Set();
  const textures = new Set();

  object.traverse((child) => {
    if (child.isMesh || child.isSkinnedMesh) {
      meshCount++;
      if (child.isSkinnedMesh) {
        skinnedMeshCount++;
        if (child.skeleton) boneCount = Math.max(boneCount, child.skeleton.bones.length);
      }
      if (child.material) {
        const mats = Array.isArray(child.material) ? child.material : [child.material];
        mats.forEach(m => {
          materials.add(m.name || 'unnamed');
          if (m.map) textures.add(m.map.name || 'texture');
        });
      }
    }
    if (child.isBone) boneCount++;
  });

  log(`Мешей: ${meshCount}, Скин-мешей: ${skinnedMeshCount}, Костей: ${boneCount}`, 'ok');
  log(`Материалов: ${materials.size}, Текстур: ${textures.size}`, 'info');

  // Центрируем и масштабируем
  const box = new THREE.Box3().setFromObject(object);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);

  object.position.sub(center);
  const scale = maxDim > 0 ? 100 / maxDim : 1;
  object.scale.setScalar(scale);

  log(`Размер модели: ${size.x.toFixed(2)}×${size.y.toFixed(2)}×${size.z.toFixed(2)}, масштаб: ${scale.toFixed(3)}`, 'info');

  // Камера
  const dist = Math.max(maxDim * scale * 2, 200);
  camera.position.set(dist * 0.6, dist * 0.5, dist);
  controls.target.set(0, size.y * scale * 0.3, 0);
  controls.update();

  // Анимации
  animationActions = [];
  const animSelect = document.getElementById('anim-select');
  animSelect.innerHTML = '';

  if (object.animations && object.animations.length > 0) {
    hasAnimations = true;
    mixer = new THREE.AnimationMixer(object);

    object.animations.forEach((clip, i) => {
      const action = mixer.clipAction(clip);
      animationActions.push({ name: clip.name, action });
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = clip.name;
      animSelect.appendChild(opt);
    });

    // Автозапуск первой анимации
    currentAction = animationActions[0].action;
    currentAction.play();
    log(`Анимаций найдено: ${object.animations.length}`, 'ok');
    document.getElementById('anim-row').style.display = 'flex';
  } else {
    log('Встроенных анимаций не найдено — будет авто-вращение', 'warn');
    mixer = null;
    document.getElementById('anim-row').style.display = 'none';
    autoRotate = true;
    document.getElementById('btn-rotate').classList.add('active');
  }

  // Скелет
  if (skinnedMeshCount > 0 || boneCount > 0) {
    log(`Скелет обнаружен: ${boneCount} костей`, 'ok');
  } else {
    log('Скелет не обнаружен — статическая модель', 'warn');
  }

  // Инфо-бар
  const infoBar = document.getElementById('info-bar');
  infoBar.innerHTML = `
    <div><b>Тип:</b> ${type.toUpperCase()}</div>
    <div><b>Мешей:</b> ${meshCount} | <b>Скин:</b> ${skinnedMeshCount} | <b>Костей:</b> ${boneCount}</div>
    <div><b>Анимаций:</b> ${object.animations ? object.animations.length : 0}</div>
    <div><b>Размер:</b> ${size.x.toFixed(1)}×${size.y.toFixed(1)}×${size.z.toFixed(1)}</div>
    <div style="margin-top:4px;color:rgba(255,255,255,0.4);">👆 Вращение | 🤏 Зум | ✌️ Панорама</div>
  `;
}

// ============ THREE.JS СЦЕНА ============
function initThree() {
  const container = document.getElementById('canvas-container');

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a0f);
  scene.fog = new THREE.Fog(0x0a0a0f, 500, 2000);

  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 5000);
  camera.position.set(100, 100, 200);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  container.appendChild(renderer.domElement);

  // Освещение
  const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 2);
  hemiLight.position.set(0, 200, 0);
  scene.add(hemiLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 2);
  dirLight.position.set(100, 200, 100);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.set(1024, 1024);
  scene.add(dirLight);

  const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.5);
  dirLight2.position.set(-100, 50, -100);
  scene.add(dirLight2);

  // Сетка
  gridHelper = new THREE.GridHelper(400, 40, 0x333333, 0x1a1a1a);
  gridHelper.visible = false;
  scene.add(gridHelper);

  // Контролы
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.minDistance = 10;
  controls.maxDistance = 2000;
  controls.target.set(0, 50, 0);
  controls.update();

  // Touch-оптимизация
  controls.touches = {
    ONE: THREE.TOUCH.ROTATE,
    TWO: THREE.TOUCH.DOLLY_PAN
  };

  clock = new THREE.Clock();

  // Анимационный цикл
  renderer.setAnimationLoop(animate);

  window.addEventListener('resize', onResize);
}

function animate() {
  const delta = clock.getDelta();

  if (mixer) mixer.update(delta);

  if (autoRotate && currentModel && !mixer) {
    currentModel.rotation.y += delta * 0.5;
  }

  controls.update();
  renderer.render(scene, camera);
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// ============ UI ОБРАБОТЧИКИ ============
document.getElementById('btn-select').addEventListener('click', () => {
  document.getElementById('file-input').click();
});

document.getElementById('file-input').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (file) handleFile(file);
});

// Drag & Drop
const dropBox = document.getElementById('drop-box');
['dragenter','dragover','dragleave','drop'].forEach(ev => {
  document.body.addEventListener(ev, (e) => { e.preventDefault(); e.stopPropagation(); });
});

document.body.addEventListener('dragenter', () => dropBox.classList.add('dragover'));
document.body.addEventListener('dragleave', () => dropBox.classList.remove('dragover'));
document.body.addEventListener('drop', (e) => {
  dropBox.classList.remove('dragover');
  const files = e.dataTransfer.files;
  if (files.length > 0) handleFile(files[0]);
});

async function handleFile(file) {
  if (!file.name.toLowerCase().endsWith('.zip')) {
    log('Пожалуйста, выберите ZIP файл', 'warn');
    return;
  }
  log(`Загружен файл: ${file.name} (${(file.size/1024/1024).toFixed(2)} MB)`, 'info');
  const arrayBuffer = await file.arrayBuffer();
  await processZip(arrayBuffer);
}

// Кнопки UI
document.getElementById('btn-reset').addEventListener('click', () => {
  if (!currentModel) return;
  const box = new THREE.Box3().setFromObject(currentModel);
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const scale = currentModel.scale.x;
  const dist = Math.max(maxDim * scale * 2, 200);
  camera.position.set(dist * 0.6, dist * 0.5, dist);
  controls.target.set(0, size.y * scale * 0.3, 0);
  controls.update();
  log('Камера сброшена', 'info');
});

document.getElementById('btn-rotate').addEventListener('click', (e) => {
  autoRotate = !autoRotate;
  e.target.classList.toggle('active', autoRotate);
  log(autoRotate ? 'Авто-вращение включено' : 'Авто-вращение выключено', 'info');
});

document.getElementById('btn-wireframe').addEventListener('click', (e) => {
  isWireframe = !isWireframe;
  e.target.classList.toggle('active', isWireframe);
  if (currentModel) {
    currentModel.traverse((child) => {
      if (child.isMesh || child.isSkinnedMesh) {
        const mats = Array.isArray(child.material) ? child.material : [child.material];
        mats.forEach(m => { if (m) m.wireframe = isWireframe; });
      }
    });
  }
  log(isWireframe ? 'Режим каркаса' : 'Режим текстур', 'info');
});

document.getElementById('btn-skeleton').addEventListener('click', (e) => {
  if (!currentModel) return;
  if (skeletonHelper) {
    scene.remove(skeletonHelper);
    skeletonHelper = null;
    e.target.classList.remove('active');
    log('Скелет скрыт', 'info');
  } else {
    skeletonHelper = new SkeletonHelper(currentModel);
    scene.add(skeletonHelper);
    e.target.classList.add('active');
    log('Скелет показан', 'ok');
  }
});

document.getElementById('btn-grid').addEventListener('click', (e) => {
  gridHelper.visible = !gridHelper.visible;
  e.target.classList.toggle('active', gridHelper.visible);
});

document.getElementById('btn-new').addEventListener('click', () => {
  if (currentModel) {
    scene.remove(currentModel);
    if (skeletonHelper) { scene.remove(skeletonHelper); skeletonHelper = null; }
    currentModel = null;
  }
  fileMap.forEach(url => URL.revokeObjectURL(url));
  fileMap.clear();
  document.getElementById('drop-zone').classList.remove('hidden');
  document.getElementById('ui-overlay').classList.add('hidden');
  document.getElementById('info-bar').classList.add('hidden');
  toggleLogsBtn.style.display = 'none';
  logPanel.innerHTML = '';
  log('Готов к новой загрузке', 'info');
});

document.getElementById('anim-select').addEventListener('change', (e) => {
  const idx = parseInt(e.target.value);
  if (mixer && animationActions[idx]) {
    if (currentAction) currentAction.stop();
    currentAction = animationActions[idx].action;
    currentAction.reset().play();
    log(`Анимация: ${animationActions[idx].name}`, 'info');
  }
});

document.getElementById('btn-play').addEventListener('click', () => {
  if (currentAction) { currentAction.paused = false; currentAction.play(); }
});

document.getElementById('btn-pause').addEventListener('click', () => {
  if (currentAction) currentAction.paused = true;
});

// ============ ИНИЦИАЛИЗАЦИЯ ============
initThree();
log('3D Viewer готов. Выберите ZIP файл с моделью.', 'info');
</script>
</body>
</html>
