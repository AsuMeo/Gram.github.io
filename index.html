<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TikTok Camera Pro — Маски, Ретушь и Фильтры</title>
    <!-- Tailwind CSS для ультра-стильного интерфейса -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Иконки FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        /* Зеркалирование видео для камеры */
        .mirrored {
            transform: scaleX(-1);
        }
        /* Стилизация полос прокрутки */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }
        /* Анимация пульсации для записи */
        @keyframes pulse-red {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .recording-pulse {
            animation: pulse-red 1.5s infinite;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between relative select-none">

    <!-- ОСНОВНОЙ ВИДЕО КОНТЕЙНЕР -->
    <div class="absolute inset-0 w-full h-full bg-black overflow-hidden flex items-center justify-center z-0">
        <!-- Живое видео с вебкамеры -->
        <video id="webcam" autoplay playsinline muted class="absolute w-full h-full object-cover mirrored"></video>
        <!-- Canvas для фильтров ретуши (WebGL) -->
        <canvas id="filterCanvas" class="absolute w-full h-full object-cover mirrored pointer-events-none"></canvas>
        <!-- Canvas для TikTok масок -->
        <canvas id="maskCanvas" class="absolute w-full h-full object-cover mirrored pointer-events-none"></canvas>
    </div>

    <!-- ВЕРХНЯЯ ПАНЕЛЬ ИНСТРУМЕНТОВ -->
    <div class="relative z-20 flex justify-between items-center p-4 bg-gradient-to-b from-black/80 to-transparent">
        <!-- Левая группа: Музыка и Звуки -->
        <button id="btnSound" class="flex items-center space-x-2 bg-black/40 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/10 active:scale-95 transition">
            <i class="fa-solid fa-music text-pink-500 animate-bounce"></i>
            <span id="soundName" class="text-xs font-medium truncate max-w-[120px]">Оригинальный звук</span>
        </button>

        <!-- Правая группа: Переключатели и настройки -->
        <div class="flex items-center space-x-3">
            <button id="btnFlip" class="w-10 h-10 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center border border-white/10 active:scale-95 transition">
                <i class="fa-solid fa-camera-rotate text-white text-sm"></i>
            </button>
            <button id="btnFlash" class="w-10 h-10 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center border border-white/10 active:scale-95 transition">
                <i class="fa-solid fa-bolt text-yellow-400 text-sm"></i>
            </button>
            <button id="btnTimer" class="w-10 h-10 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center border border-white/10 active:scale-95 transition">
                <i class="fa-solid fa-stopwatch text-white text-sm"></i>
            </button>
            <button id="btnSettings" class="w-10 h-10 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center border border-white/10 active:scale-95 transition">
                <i class="fa-solid fa-gear text-white text-sm"></i>
            </button>
        </div>
    </div>

    <!-- ПРАВАЯ ВЕРТИКАЛЬНАЯ ПАНЕЛЬ (TikTok Style) -->
    <div class="absolute right-4 top-24 z-20 flex flex-col items-center space-y-5">
        <!-- Кнопка Масок -->
        <button id="toggleMasksPanel" class="flex flex-col items-center group">
            <div class="w-12 h-12 rounded-full bg-black/50 backdrop-blur-md border border-white/20 flex items-center justify-center group-hover:border-pink-500 transition shadow-lg">
                <i class="fa-solid fa-face-smile-beam text-pink-400 text-lg"></i>
            </div>
            <span class="text-[10px] mt-1 font-semibold text-shadow">Маски</span>
        </button>

        <!-- Кнопка Ретуши (Улучшение лица / Убрать прыщи) -->
        <button id="toggleBeautyPanel" class="flex flex-col items-center group">
            <div class="w-12 h-12 rounded-full bg-black/50 backdrop-blur-md border border-white/20 flex items-center justify-center group-hover:border-cyan-400 transition shadow-lg">
                <i class="fa-solid fa-wand-magic-sparkles text-cyan-400 text-lg"></i>
            </div>
            <span class="text-[10px] mt-1 font-semibold text-shadow">Ретушь</span>
        </button>

        <!-- Кнопка Цветовых Фильтров -->
        <button id="toggleFiltersPanel" class="flex flex-col items-center group">
            <div class="w-12 h-12 rounded-full bg-black/50 backdrop-blur-md border border-white/20 flex items-center justify-center group-hover:border-purple-400 transition shadow-lg">
                <i class="fa-solid fa-palette text-purple-400 text-lg"></i>
            </div>
            <span class="text-[10px] mt-1 font-semibold text-shadow">Фильтры</span>
        </button>

        <!-- Кнопка Таймера / Скорости -->
        <button id="btnSpeed" class="flex flex-col items-center group">
            <div class="w-12 h-12 rounded-full bg-black/50 backdrop-blur-md border border-white/20 flex items-center justify-center group-hover:border-yellow-400 transition shadow-lg">
                <span class="text-xs font-bold text-yellow-400">1x</span>
            </div>
            <span class="text-[10px] mt-1 font-semibold text-shadow">Скорость</span>
        </button>
    </div>

    <!-- ВЫДВИЖНЫЕ ПАНЕЛИ НАСТРОЕК (МАСКИ, РЕТУШЬ, ФИЛЬТРЫ) -->
    
    <!-- 1. Панель масок TikTok -->
    <div id="masksPanel" class="absolute bottom-32 left-0 right-0 z-30 bg-black/80 backdrop-blur-xl border-t border-white/10 p-4 transition-transform duration-300 translate-y-full rounded-t-3xl">
        <div class="flex justify-between items-center mb-3">
            <h3 class="text-sm font-bold tracking-wider text-pink-400 uppercase"><i class="fa-solid fa-face-smile mr-2"></i>ТикТок Маски</h3>
            <button class="closePanel text-white/60 hover:text-white px-2 py-1"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>
        <div class="flex space-x-3 overflow-x-auto pb-2 scrollbar-none">
            <button onclick="setMask('none')" class="mask-btn flex-shrink-0 flex flex-col items-center space-y-1 group">
                <div class="w-16 h-16 rounded-2xl bg-gray-800 border-2 border-pink-500 flex items-center justify-center overflow-hidden">
                    <i class="fa-solid fa-ban text-gray-400 text-xl"></i>
                </div>
                <span class="text-xs text-white">Без маски</span>
            </button>
            <button onclick="setMask('dog')" class="mask-btn flex-shrink-0 flex flex-col items-center space-y-1 group">
                <div class="w-16 h-16 rounded-2xl bg-gray-800 border-2 border-transparent group-hover:border-pink-500 flex items-center justify-center overflow-hidden relative">
                    <div class="absolute inset-0 bg-amber-700/40 flex items-center justify-center"><i class="fa-solid fa-dog text-2xl text-amber-300"></i></div>
                </div>
                <span class="text-xs text-white">🐶 Милый Песик</span>
            </button>
            <button onclick="setMask('cat')" class="mask-btn flex-shrink-0 flex flex-col items-center space-y-1 group">
                <div class="w-16 h-16 rounded-2xl bg-gray-800 border-2 border-transparent group-hover:border-pink-500 flex items-center justify-center overflow-hidden relative">
                    <div class="absolute inset-0 bg-purple-700/40 flex items-center justify-center"><i class="fa-solid fa-cat text-2xl text-purple-300"></i></div>
                </div>
                <span class="text-xs text-white">🐱 Кошечка</span>
            </button>
            <button onclick="setMask('glasses')" class="mask-btn flex-shrink-0 flex flex-col items-center space-y-1 group">
                <div class="w-16 h-16 rounded-2xl bg-gray-800 border-2 border-transparent group-hover:border-pink-500 flex items-center justify-center overflow-hidden relative">
                    <div class="absolute inset-0 bg-blue-700/40 flex items-center justify-center"><i class="fa-solid fa-glasses text-2xl text-cyan-300"></i></div>
                </div>
                <span class="text-xs text-white">🕶️ Кибер Очки</span>
            </button>
            <button onclick="setMask('crown')" class="mask-btn flex-shrink-0 flex flex-col items-center space-y-1 group">
                <div class="w-16 h-16 rounded-2xl bg-gray-800 border-2 border-transparent group-hover:border-pink-500 flex items-center justify-center overflow-hidden relative">
                    <div class="absolute inset-0 bg-yellow-700/40 flex items-center justify-center"><i class="fa-solid fa-crown text-2xl text-yellow-300"></i></div>
                </div>
                <span class="text-xs text-white">👑 Корона Звезды</span>
            </button>
            <button onclick="setMask('neon')" class="mask-btn flex-shrink-0 flex flex-col items-center space-y-1 group">
                <div class="w-16 h-16 rounded-2xl bg-gray-800 border-2 border-transparent group-hover:border-pink-500 flex items-center justify-center overflow-hidden relative">
                    <div class="absolute inset-0 bg-pink-700/40 flex items-center justify-center"><i class="fa-solid fa-bolt text-2xl text-pink-300"></i></div>
                </div>
                <span class="text-xs text-white">⚡ Неон Ореол</span>
            </button>
        </div>
    </div>

    <!-- 2. Панель ретуши (Убрать прыщи, Гламур, Улучшение кожи) -->
    <div id="beautyPanel" class="absolute bottom-32 left-0 right-0 z-30 bg-black/80 backdrop-blur-xl border-t border-white/10 p-4 transition-transform duration-300 translate-y-full rounded-t-3xl">
        <div class="flex justify-between items-center mb-3">
            <h3 class="text-sm font-bold tracking-wider text-cyan-400 uppercase"><i class="fa-solid fa-wand-magic-sparkles mr-2"></i>ИИ Ретушь и Лицо</h3>
            <button class="closePanel text-white/60 hover:text-white px-2 py-1"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>
        <div class="space-y-3 max-h-48 overflow-y-auto pr-1">
            <!-- Сглаживание кожи / Убрать прыщи -->
            <div>
                <div class="flex justify-between text-xs mb-1">
                    <span class="text-gray-300">🌿 Удаление прыщей & Сглаживание кожи</span>
                    <span id="valSkin" class="text-cyan-400 font-bold">50%</span>
                </div>
                <input type="range" id="rangeSkin" min="0" max="100" value="50" class="w-full accent-cyan-400 bg-gray-700 h-1.5 rounded-lg appearance-none cursor-pointer">
            </div>
            <!-- Отбеливание зубов / Осветление -->
            <div>
                <div class="flex justify-between text-xs mb-1">
                    <span class="text-gray-300">✨ Сияние и Осветление лица</span>
                    <span id="valBright" class="text-cyan-400 font-bold">30%</span>
                </div>
                <input type="range" id="rangeBright" min="0" max="100" value="30" class="w-full accent-cyan-400 bg-gray-700 h-1.5 rounded-lg appearance-none cursor-pointer">
            </div>
            <!-- Сужение лица (Эффект худого лица) -->
            <div>
                <div class="flex justify-between text-xs mb-1">
                    <span class="text-gray-300">💎 Стройное лицо (V-Shape)</span>
                    <span id="valSlim" class="text-cyan-400 font-bold">20%</span>
                </div>
                <input type="range" id="rangeSlim" min="0" max="100" value="20" class="w-full accent-cyan-400 bg-gray-700 h-1.5 rounded-lg appearance-none cursor-pointer">
            </div>
            <!-- Увеличение глаз -->
            <div>
                <div class="flex justify-between text-xs mb-1">
                    <span class="text-gray-300">👀 Выразительные глаза</span>
                    <span id="valEyes" class="text-cyan-400 font-bold">25%</span>
                </div>
                <input type="range" id="rangeEyes" min="0" max="100" value="25" class="w-full accent-cyan-400 bg-gray-700 h-1.5 rounded-lg appearance-none cursor-pointer">
            </div>
        </div>
    </div>

    <!-- 3. Панель цветовых фильтров -->
    <div id="filtersPanel" class="absolute bottom-32 left-0 right-0 z-30 bg-black/80 backdrop-blur-xl border-t border-white/10 p-4 transition-transform duration-300 translate-y-full rounded-t-3xl">
        <div class="flex justify-between items-center mb-3">
            <h3 class="text-sm font-bold tracking-wider text-purple-400 uppercase"><i class="fa-solid fa-palette mr-2"></i>Цветовые Фильтры</h3>
            <button class="closePanel text-white/60 hover:text-white px-2 py-1"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>
        <div class="flex space-x-3 overflow-x-auto pb-2 scrollbar-none">
            <button onclick="setFilter('none')" class="filter-btn flex-shrink-0 flex flex-col items-center space-y-1">
                <div class="w-16 h-16 rounded-xl bg-gray-700 border-2 border-purple-500 flex items-center justify-center text-xs font-bold">Норм</div>
                <span class="text-xs text-white">Оригинал</span>
            </button>
            <button onclick="setFilter('tiktok')" class="filter-btn flex-shrink-0 flex flex-col items-center space-y-1">
                <div class="w-16 h-16 rounded-xl bg-gradient-to-tr from-pink-500 to-cyan-400 flex items-center justify-center text-xs font-bold">TikTok</div>
                <span class="text-xs text-white">ТикТок Вайб</span>
            </button>
            <button onclick="setFilter('vintage')" class="filter-btn flex-shrink-0 flex flex-col items-center space-y-1">
                <div class="w-16 h-16 rounded-xl bg-amber-700 flex items-center justify-center text-xs font-bold text-amber-200">Retro</div>
                <span class="text-xs text-white">Винтаж 90х</span>
            </button>
            <button onclick="setFilter('cyberpunk')" class="filter-btn flex-shrink-0 flex flex-col items-center space-y-1">
                <div class="w-16 h-16 rounded-xl bg-indigo-900 border border-pink-500 flex items-center justify-center text-xs font-bold text-pink-400">Cyber</div>
                <span class="text-xs text-white">Киберпанк</span>
            </button>
            <button onclick="setFilter('bw')" class="filter-btn flex-shrink-0 flex flex-col items-center space-y-1">
                <div class="w-16 h-16 rounded-xl bg-gray-900 border border-white flex items-center justify-center text-xs font-bold text-white">B&W</div>
                <span class="text-xs text-white">Нуар Ч/Б</span>
            </button>
            <button onclick="setFilter('warm')" class="filter-btn flex-shrink-0 flex flex-col items-center space-y-1">
                <div class="w-16 h-16 rounded-xl bg-orange-500 flex items-center justify-center text-xs font-bold text-yellow-100">Warm</div>
                <span class="text-xs text-white">Закат</span>
            </button>
        </div>
    </div>

    <!-- НИЖНЯЯ ПАНЕЛЬ УПРАВЛЕНИЯ (Съемка) -->
    <div class="relative z-20 p-6 pb-8 bg-gradient-to-t from-black/90 via-black/50 to-transparent flex flex-col items-center justify-end">
        
        <!-- Выбор режимов съемки (TikTok Навигация внизу) -->
        <div class="flex items-center space-x-6 mb-6 text-sm font-semibold tracking-wide text-white/70">
            <button class="mode-tab hover:text-white transition">Дуэт</button>
            <button class="mode-tab text-pink-500 border-b-2 border-pink-500 pb-1">60с Клип</button>
            <button class="mode-tab hover:text-white transition">15с Фото</button>
            <button class="mode-tab hover:text-white transition">Шаблоны</button>
        </div>

        <!-- Кнопки спуска / Записи -->
        <div class="flex items-center justify-between w-full max-w-xs px-4">
            <!-- Загрузка эффекта / галерея -->
            <button id="btnGallery" class="w-12 h-12 rounded-xl bg-white/10 backdrop-blur-md border border-white/20 flex items-center justify-center overflow-hidden active:scale-95 transition">
                <i class="fa-solid fa-image text-white text-lg"></i>
            </button>

            <!-- ГЛАВНАЯ КНОПКА ЗАПИСИ (TikTok Style) -->
            <button id="recordBtn" class="relative w-20 h-20 rounded-full flex items-center justify-center p-1 focus:outline-none transition-transform active:scale-95">
                <!-- Внешнее кольцо -->
                <div class="absolute inset-0 rounded-full border-4 border-white flex items-center justify-center"></div>
                <!-- Внутренняя кнопка -->
                <div id="recordInner" class="w-16 h-16 rounded-full bg-red-500 transition-all duration-300 shadow-lg"></div>
            </button>

            <!-- Переворот камеры / Эффекты -->
            <button id="btnEffectsModal" class="w-12 h-12 rounded-xl bg-white/10 backdrop-blur-md border border-white/20 flex items-center justify-center active:scale-95 transition">
                <i class="fa-solid fa-wand-magic text-pink-400 text-lg"></i>
            </button>
        </div>
    </div>

    <!-- ТАЙМЕР ОБРАТНОГО ОТСЧЕТА -->
    <div id="countdownOverlay" class="absolute inset-0 bg-black/70 backdrop-blur-md z-50 flex items-center justify-center hidden">
        <span id="countdownNumber" class="text-8xl font-black text-pink-500 animate-pulse">3</span>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ПРЕДПРОСМОТРА ВИДЕО/ФОТО -->
    <div id="previewModal" class="absolute inset-0 bg-black z-50 flex flex-col justify-between p-6 hidden">
        <div class="flex justify-between items-center z-10">
            <button id="closePreview" class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center text-white text-lg">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <span class="text-sm font-bold text-white tracking-widest uppercase">Предпросмотр</span>
            <div class="w-10"></div>
        </div>

        <!-- Контейнер медиа -->
        <div class="flex-1 flex items-center justify-center my-4 overflow-hidden rounded-2xl relative">
            <video id="previewVideo" autoplay playsinline loop class="max-h-full max-w-full object-contain rounded-2xl hidden"></video>
            <img id="previewImage" class="max-h-full max-w-full object-contain rounded-2xl hidden" alt="Captured Photo">
        </div>

        <!-- Кнопки сохранения / публикации -->
        <div class="flex space-x-4 z-10">
            <button id="btnDownload" class="flex-1 py-3.5 bg-white/20 hover:bg-white/30 backdrop-blur-md rounded-xl font-bold flex items-center justify-center space-x-2 transition">
                <i class="fa-solid fa-download"></i>
                <span>Сохранить</span>
            </button>
            <button id="btnShareTikTok" class="flex-1 py-3.5 bg-gradient-to-r from-pink-500 to-cyan-400 hover:opacity-90 rounded-xl font-bold flex items-center justify-center space-x-2 shadow-lg transition">
                <i class="fa-brands fa-tiktok"></i>
                <span>Опубликовать</span>
            </button>
        </div>
    </div>

    <!-- СКРИПТ ЛОГИКИ И ОБРАБОТКИ ВИДЕО -->
    <script>
        const video = document.getElementById('webcam');
        const filterCanvas = document.getElementById('filterCanvas');
        const maskCanvas = document.getElementById('maskCanvas');
        const fCtx = filterCanvas.getContext('2d');
        const mCtx = maskCanvas.getContext('2d');

        let currentStream = null;
        let useFrontCamera = true;
        let currentMask = 'none';
        let currentFilter = 'none';
        let isRecording = false;
        let mediaRecorder = null;
        let recordedChunks = [];
        let animationFrameId = null;

        // Параметры ретуши (улучшение кожи, прыщи, сияние)
        let beautySettings = {
            skin: 50,
            bright: 30,
            slim: 20,
            eyes: 25
        };

        // Инициализация камеры при загрузке
        async function initCamera() {
            try {
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                }
                const constraints = {
                    video: {
                        facingMode: useFrontCamera ? 'user' : 'environment',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: true
                };
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
                await video.play();

                // Установка размеров холстов под видео
                filterCanvas.width = video.videoWidth || 1280;
                filterCanvas.height = video.videoHeight || 720;
                maskCanvas.width = video.videoWidth || 1280;
                maskCanvas.height = video.videoHeight || 720;

                startProcessingLoop();
            } catch (err) {
                console.error("Ошибка доступа к камере:", err);
                alert("Не удалось получить доступ к камере. Убедитесь, что разрешили использование камеры в браузере.");
            }
        }

        // Основной цикл обработки кадров в реальном времени (WebGL / Canvas фильтры + Маски)
        function startProcessingLoop() {
            cancelAnimationFrame(animationFrameId);

            function processFrame() {
                if (video.paused || video.ended) return;

                const w = filterCanvas.width;
                const h = filterCanvas.height;

                // 1. Рендеринг цветовых фильтров и ретуши кожи
                fCtx.clearRect(0, 0, w, h);
                fCtx.save();

                // Применяем цветовые фильтры на канвас
                if (currentFilter === 'tiktok') {
                    fCtx.filter = 'contrast(120%) saturate(140%) brightness(110%)';
                } else if (currentFilter === 'vintage') {
                    fCtx.filter = 'sepia(60%) contrast(110%) brightness(95%)';
                } else if (currentFilter === 'cyberpunk') {
                    fCtx.filter = 'hue-rotate(310deg) saturate(180%) contrast(130%)';
                } else if (currentFilter === 'bw') {
                    fCtx.filter = 'grayscale(100%) contrast(130%)';
                } else if (currentFilter === 'warm') {
                    fCtx.filter = 'sepia(30%) saturate(150%) brightness(105%)';
                } else {
                    fCtx.filter = 'none';
                }

                // Эффект сглаживания кожи (убрать прыщи / размытие несовершенств кожи)
                // Имитируем бьюти-фильтр через комбинацию фильтров размытия и наложения
                if (beautySettings.skin > 0) {
                    const blurVal = (beautySettings.skin / 100) * 4;
                    const brightnessVal = 100 + (beautySettings.bright / 100) * 15;
                    fCtx.filter += ` blur(${blurVal}px) brightness(${brightnessVal}%)`;
                }

                fCtx.drawImage(video, 0, 0, w, h);
                fCtx.restore();

                // 2. Рендеринг TikTok масок поверх лица
                mCtx.clearRect(0, 0, w, h);
                if (currentMask !== 'none') {
                    drawTikTokMask(mCtx, w, h, currentMask);
                }

                animationFrameId = requestAnimationFrame(processFrame);
            }

            processFrame();
        }

        // Отрисовка интерактивных масок TikTok на холсте
        function drawTikTokMask(ctx, w, h, maskType) {
            ctx.save();
            // Примерные координаты центра экрана (где обычно находится лицо при селфи)
            const cx = w / 2;
            const cy = h / 2 - 50;

            if (maskType === 'dog') {
                // Ушки собаки
                ctx.fillStyle = '#b45309';
                ctx.beginPath();
                ctx.arc(cx - 120, cy - 180, 50, 0, Math.PI * 2);
                ctx.arc(cx + 120, cy - 180, 50, 0, Math.PI * 2);
                ctx.fill();
                // Носик и пятна
                ctx.fillStyle = '#451a03';
                ctx.beginPath();
                ctx.ellipse(cx, cy + 40, 35, 25, 0, 0, Math.PI * 2);
                ctx.fill();
            } else if (maskType === 'cat') {
                // Кошачьи ушки (тригонометрические треугольники)
                ctx.fillStyle = '#a855f7';
                ctx.beginPath();
                ctx.moveTo(cx - 150, cy - 150);
                ctx.lineTo(cx - 80, cy - 250);
                ctx.lineTo(cx - 40, cy - 140);
                ctx.closePath();
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(cx + 150, cy - 150);
                ctx.lineTo(cx + 80, cy - 250);
                ctx.lineTo(cx + 40, cy - 140);
                ctx.closePath();
                ctx.fill();
            } else if (maskType === 'glasses') {
                // Стильные кибер-очки
                ctx.strokeStyle = '#06b6d4';
                ctx.lineWidth = 8;
                ctx.strokeRect(cx - 140, cy - 50, 120, 70);
                ctx.strokeRect(cx + 20, cy - 50, 120, 70);
                ctx.beginPath();
                ctx.moveTo(cx - 20, cy - 20);
                ctx.lineTo(cx + 20, cy - 20);
                ctx.stroke();
            } else if (maskType === 'crown') {
                // Корона золотая
                ctx.fillStyle = '#facc15';
                ctx.beginPath();
                ctx.moveTo(cx - 90, cy - 160);
                ctx.lineTo(cx - 120, cy - 260);
                ctx.lineTo(cx - 40, cy - 200);
                ctx.lineTo(cx, cy - 280);
                ctx.lineTo(cx + 40, cy - 200);
                ctx.lineTo(cx + 120, cy - 260);
                ctx.lineTo(cx + 90, cy - 160);
                ctx.closePath();
                ctx.fill();
            } else if (maskType === 'neon') {
                // Неоновый нимб
                ctx.strokeStyle = '#ec4899';
                ctx.lineWidth = 6;
                ctx.shadowColor = '#ec4899';
                ctx.shadowBlur = 25;
                ctx.beginPath();
                ctx.ellipse(cx, cy - 220, 130, 40, 0, 0, Math.PI * 2);
                ctx.stroke();
            }
            ctx.restore();
        }

        // Управление панелями (Выдвижные шторки TikTok)
        const masksPanel = document.getElementById('masksPanel');
        const beautyPanel = document.getElementById('beautyPanel');
        const filtersPanel = document.getElementById('filtersPanel');

        function hideAllPanels() {
            masksPanel.classList.add('translate-y-full');
            beautyPanel.classList.add('translate-y-full');
            filtersPanel.classList.add('translate-y-full');
        }

        document.getElementById('toggleMasksPanel').addEventListener('click', () => {
            const isOpen = !masksPanel.classList.contains('translate-y-full');
            hideAllPanels();
            if (!isOpen) masksPanel.classList.remove('translate-y-full');
        });

        document.getElementById('toggleBeautyPanel').addEventListener('click', () => {
            const isOpen = !beautyPanel.classList.contains('translate-y-full');
            hideAllPanels();
            if (!isOpen) beautyPanel.classList.remove('translate-y-full');
        });

        document.getElementById('toggleFiltersPanel').addEventListener('click', () => {
            const isOpen = !filtersPanel.classList.contains('translate-y-full');
            hideAllPanels();
            if (!isOpen) filtersPanel.classList.remove('translate-y-full');
        });

        document.querySelectorAll('.closePanel').forEach(btn => {
            btn.addEventListener('click', hideAllPanels);
        });

        // Установка масок и фильтров из меню
        window.setMask = function(mask) {
            currentMask = mask;
            hideAllPanels();
        };

        window.setFilter = function(filter) {
            currentFilter = filter;
            hideAllPanels();
        };

        // Обработка ползунков ретуши (улучшение кожи, прыщи, сияние)
        document.getElementById('rangeSkin').addEventListener('input', (e) => {
            beautySettings.skin = e.target.value;
            document.getElementById('valSkin').innerText = e.target.value + '%';
        });
        document.getElementById('rangeBright').addEventListener('input', (e) => {
            beautySettings.bright = e.target.value;
            document.getElementById('valBright').innerText = e.target.value + '%';
        });
        document.getElementById('rangeSlim').addEventListener('input', (e) => {
            beautySettings.slim = e.target.value;
            document.getElementById('valSlim').innerText = e.target.value + '%';
        });
        document.getElementById('rangeEyes').addEventListener('input', (e) => {
            beautySettings.eyes = e.target.value;
            document.getElementById('valEyes').innerText = e.target.value + '%';
        });

        // Переворот камеры (Фронтальная / Тыловая)
        document.getElementById('btnFlip').addEventListener('click', () => {
            useFrontCamera = !useFrontCamera;
            initCamera();
            // Переключение зеркалирования для тыловой камеры
            if (useFrontCamera) {
                video.classList.add('mirrored');
                filterCanvas.classList.add('mirrored');
                maskCanvas.classList.add('mirrored');
            } else {
                video.classList.remove('mirrored');
                filterCanvas.classList.remove('mirrored');
                maskCanvas.classList.remove('mirrored');
            }
        });

        // Запись видео (TikTok запись клипа)
        const recordBtn = document.getElementById('recordBtn');
        const recordInner = document.getElementById('recordInner');
        const previewModal = document.getElementById('previewModal');
        const previewVideo = document.getElementById('previewVideo');
        const previewImage = document.getElementById('previewImage');

        recordBtn.addEventListener('click', () => {
            if (!isRecording) {
                startRecording();
            } else {
                stopRecording();
            }
        });

        function startRecording() {
            recordedChunks = [];
            // Объединяем поток видео с фильтрами и масками в общий комбинированный Canvas Stream
            const combinedCanvas = document.createElement('canvas');
            combinedCanvas.width = filterCanvas.width;
            combinedCanvas.height = filterCanvas.height;
            const ctx = combinedCanvas.getContext('2d');

            function drawCombined() {
                if (!isRecording) return;
                ctx.drawImage(filterCanvas, 0, 0);
                ctx.drawImage(maskCanvas, 0, 0);
                requestAnimationFrame(drawCombined);
            }
            drawCombined();

            const canvasStream = combinedCanvas.captureStream(30);
            
            // Добавляем аудиодорожку, если она есть
            if (currentStream && currentStream.getAudioTracks().length > 0) {
                canvasStream.addTrack(currentStream.getAudioTracks()[0]);
            }

            try {
                mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm; codecs=vp9' });
            } catch (e) {
                try {
                    mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm' });
                } catch (err) {
                    mediaRecorder = new MediaRecorder(canvasStream);
                }
            }

            mediaRecorder.ondataavailable = (event) => {
                if (event.data && event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const videoURL = URL.createObjectURL(blob);
                previewVideo.src = videoURL;
                previewVideo.classList.remove('hidden');
                previewImage.classList.add('hidden');
                previewModal.classList.remove('hidden');
            };

            mediaRecorder.start();
            isRecording = true;
            recordInner.classList.remove('bg-red-500', 'w-16', 'h-16', 'rounded-full');
            recordInner.classList.add('bg-red-600', 'w-8', 'h-8', 'rounded-md', 'recording-pulse');
        }

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                recordInner.classList.remove('bg-red-600', 'w-8', 'h-8', 'rounded-md', 'recording-pulse');
                recordInner.classList.add('bg-red-500', 'w-16', 'h-16', 'rounded-full');
            }
        }

        // Закрытие предпросмотра
        document.getElementById('closePreview').addEventListener('click', () => {
            previewModal.classList.add('hidden');
            previewVideo.pause();
            previewVideo.src = '';
        });

        // Скачивание готового видео
        document.getElementById('btnDownload').addEventListener('click', () => {
            const url = previewVideo.src;
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = `tiktok-video-${Date.now()}.webm`;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                document.body.removeChild(a);
            }, 100);
        });

        // Кнопка «Опубликовать» (симуляция TikTok публикации)
        document.getElementById('btnShareTikTok').addEventListener('click', () => {
            alert("🚀 Успешно опубликовано в вашу ленту TikTok!");
            previewModal.classList.add('hidden');
        });

        // Запуск камеры при загрузке страницы
        window.addEventListener('load', initCamera);
    </script>
</body>
</html>
