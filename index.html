<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>KURO ANIME — Production Engine</title>

  <!-- HLS.js for Streaming -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    /* ==========================================================================
       OBSIDIAN OLED MINIMALIST DESIGN SYSTEM
       - NO gradients, NO blur
       - Pure OLED Black (#000000)
       - Crisp SVG Icons & Monochromatic High-Density System Typography
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }

    :root {
      --bg: #000000;
      --surface: #0a0a0e;
      --card: #121218;
      --card-hover: #1c1c26;
      --border: rgba(255, 255, 255, 0.1);
      --border-bright: rgba(255, 255, 255, 0.25);
      
      --text: #ffffff;
      --text-dim: #a1a1aa;
      --text-muted: #52525b;
      
      --accent-green: #00e676; /* Green for lock active */
      --accent-blue: #38bdf8;
      
      --radius-xs: 4px;
      --radius-sm: 8px;
      --radius-md: 12px;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding-bottom: 50px;
    }

    .svg-icon {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      display: inline-block;
      vertical-align: middle;
    }

    /* ==========================================================================
       TOP NAVIGATION BAR + REALTIME SEARCH
       ========================================================================== */
    .top-bar {
      height: 52px;
      background-color: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 800;
      font-size: 0.85rem;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
    }

    .brand-dot {
      width: 6px;
      height: 6px;
      background-color: #fff;
      border-radius: 50%;
    }

    .search-box {
      flex: 1;
      max-width: 320px;
      position: relative;
    }

    .search-input {
      width: 100%;
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 7px 10px 7px 30px;
      color: #fff;
      font-size: 0.78rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--border-bright);
    }

    .search-icon {
      position: absolute;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      color: var(--text-dim);
      pointer-events: none;
    }

    .add-btn {
      background-color: #ffffff;
      color: #000000;
      border: none;
      padding: 7px 12px;
      border-radius: var(--radius-xs);
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .add-btn:active {
      background-color: #d4d4d8;
    }

    /* ==========================================================================
       CONTAINER & VIDEO PLAYER WITH FULL TOUCH-LOCK
       ========================================================================== */
    .app-main {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      flex: 1;
    }

    .player-wrap {
      position: relative;
      width: 100%;
      background-color: #000000;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
    }

    .player-wrap:fullscreen,
    .player-wrap:-webkit-full-screen {
      width: 100vw !important;
      height: 100vh !important;
      aspect-ratio: auto !important;
    }

    .video-node {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background-color: #000;
    }

    .player-spin {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 32px;
      height: 32px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: none;
      z-index: 5;
      pointer-events: none;
    }

    @keyframes spin {
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* INVISIBLE TOUCH LOCK SHIELD OVERLAY (NO BANNERS, NO TEXT) */
    .lock-shield {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: transparent;
      z-index: 90;
      display: none;
      pointer-events: auto;
    }

    /* Lock Button Pin (Z-Index 100) */
    .lock-pin {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 100;
    }

    .lock-btn {
      background-color: rgba(10, 10, 14, 0.8);
      border: 1px solid var(--border);
      color: #ffffff;
      padding: 6px;
      border-radius: var(--radius-xs);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* GREEN WHEN LOCKED, WHITE WHEN UNLOCKED */
    .lock-btn.is-locked {
      background-color: var(--accent-green);
      color: #000000;
      border-color: var(--accent-green);
    }

    /* Controls Overlay */
    .player-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.72);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      opacity: 1;
      transition: opacity 0.15s ease;
      z-index: 10;
    }

    .player-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .p-top {
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .source-tag {
      font-size: 0.6rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 3px;
      background-color: var(--card);
      color: var(--text-dim);
      border: 1px solid var(--border);
      text-transform: uppercase;
      margin-right: 8px;
    }

    .p-title {
      font-size: 0.78rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 60%;
    }

    .p-center {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex: 1;
    }

    .center-play-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: #ffffff;
      border: none;
      color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 2;
    }

    .center-play-btn:active {
      transform: scale(0.92);
      background-color: #d4d4d8;
    }

    .center-play-btn .svg-icon {
      width: 20px;
      height: 20px;
      stroke: none;
      fill: #000;
    }

    .tap-zone {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 38%;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0);
      font-weight: 600;
      font-size: 0.75rem;
      transition: background-color 0.1s, color 0.1s;
    }
    .tap-l { left: 0; }
    .tap-r { right: 0; }
    .tap-zone.active {
      background-color: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .p-bottom {
      padding: 8px 14px 10px 14px;
      background-color: var(--surface);
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-top: 1px solid var(--border);
    }

    .timeline-bar {
      width: 100%;
      height: 16px;
      display: flex;
      align-items: center;
      cursor: pointer;
      position: relative;
    }

    .timeline-bg {
      width: 100%;
      height: 2px;
      background-color: rgba(255, 255, 255, 0.2);
      border-radius: 1px;
      position: relative;
      overflow: hidden;
    }

    .timeline-fill {
      height: 100%;
      width: 0%;
      background-color: #ffffff;
      position: absolute;
      left: 0;
      top: 0;
    }

    .timeline-thumb {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #fff;
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      left: 0%;
      pointer-events: none;
    }

    .p-ctrl-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .p-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .time-txt {
      font-size: 0.7rem;
      color: var(--text-dim);
      font-family: monospace;
    }

    .p-btn {
      background: transparent;
      border: none;
      color: var(--text);
      padding: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .p-btn:active { opacity: 0.6; }

    .badge-speed {
      font-size: 0.65rem;
      font-weight: 600;
      background-color: var(--card);
      padding: 2px 5px;
      border-radius: var(--radius-xs);
      color: var(--text);
      border: 1px solid var(--border);
    }

    /* ==========================================================================
       CATALOG & ANIME DETAILS CARDS
       ========================================================================== */
    .section-bar {
      padding: 14px 16px 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.2px;
    }

    .section-count {
      font-size: 0.72rem;
      color: var(--text-dim);
      font-weight: 600;
    }

    .anime-cards-grid {
      padding: 0 16px 20px 16px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
    }

    .anime-poster-card {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    .anime-poster-card:active {
      border-color: var(--border-bright);
      background-color: var(--card);
    }

    .poster-box {
      width: 100%;
      height: 170px;
      background-color: var(--card);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .poster-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .poster-fallback {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-dim);
      text-align: center;
      padding: 10px;
    }

    .ep-count-tag {
      position: absolute;
      top: 6px;
      right: 6px;
      font-size: 0.6rem;
      font-weight: 800;
      padding: 2px 6px;
      background-color: rgba(0, 0, 0, 0.85);
      color: #ffffff;
      border: 1px solid var(--border);
      border-radius: 3px;
    }

    .card-meta-padding {
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .card-title-txt {
      font-size: 0.78rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-sub-txt {
      font-size: 0.65rem;
      color: var(--text-dim);
      margin-top: 2px;
    }

    /* DETAILS VIEW */
    .anime-detail-view {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .back-nav-btn {
      align-self: flex-start;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 6px 10px;
      border-radius: var(--radius-xs);
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .back-nav-btn:active {
      color: #fff;
      border-color: var(--border-bright);
    }

    .anime-detail-header {
      display: flex;
      gap: 14px;
    }

    .detail-cover-box {
      width: 100px;
      height: 140px;
      background-color: var(--card);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .detail-cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .detail-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .detail-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.2;
    }

    .season-tabs-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .season-tab {
      background-color: var(--card);
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 6px 12px;
      border-radius: var(--radius-xs);
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .season-tab.active {
      background-color: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }

    .episodes-preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }

    .ep-preview-card {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    .ep-preview-card:active {
      border-color: var(--border-bright);
      background-color: var(--card-hover);
    }

    .ep-preview-card.now-playing {
      border-color: #ffffff;
      background-color: var(--card);
    }

    .ep-thumb-box {
      width: 100%;
      height: 85px;
      background-color: var(--card);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--border);
    }

    .ep-thumb-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .ep-play-overlay {
      position: absolute;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.9);
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ep-play-overlay .svg-icon {
      width: 12px;
      height: 12px;
      fill: #000;
      stroke: none;
    }

    .ep-number-tag {
      position: absolute;
      top: 4px;
      left: 4px;
      font-size: 0.58rem;
      font-weight: 800;
      padding: 2px 4px;
      background-color: rgba(0, 0, 0, 0.85);
      color: #ffffff;
      border-radius: 3px;
      border: 1px solid var(--border);
    }

    .ep-card-body {
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .ep-card-title {
      font-size: 0.72rem;
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* EMPTY CATALOG STATE */
    .empty-box {
      padding: 40px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      background-color: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius-md);
      margin: 20px 16px;
    }

    /* ==========================================================================
       MODALS
       ========================================================================== */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.88);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }

    .modal-backdrop.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background-color: var(--surface);
      border: 1px solid var(--border-bright);
      border-radius: var(--radius-md);
      width: 100%;
      max-width: 400px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 88vh;
      overflow-y: auto;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .modal-title {
      font-size: 0.9rem;
      font-weight: 800;
      color: #fff;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 1.1rem;
    }

    .modal-tabs {
      display: flex;
      background-color: var(--card);
      border-radius: var(--radius-xs);
      padding: 2px;
      border: 1px solid var(--border);
    }

    .modal-tab-btn {
      flex: 1;
      padding: 6px;
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 0.72rem;
      font-weight: 700;
      border-radius: 3px;
      cursor: pointer;
    }

    .modal-tab-btn.active {
      background-color: #ffffff;
      color: #000000;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-label {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .form-input {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xs);
      padding: 9px 10px;
      color: #fff;
      font-size: 0.8rem;
      outline: none;
    }

    .form-input:focus {
      border-color: #ffffff;
    }

    .file-select-btn {
      background-color: var(--card);
      border: 1px dashed var(--border-bright);
      color: var(--text);
      padding: 10px;
      border-radius: var(--radius-xs);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }

    .file-select-btn:active {
      background-color: var(--card-hover);
    }

    .submit-btn {
      background-color: #ffffff;
      color: #000000;
      border: none;
      padding: 10px;
      border-radius: var(--radius-xs);
      font-weight: 800;
      font-size: 0.8rem;
      cursor: pointer;
      margin-top: 4px;
    }

    .submit-btn:active {
      background-color: #d4d4d8;
    }

    .speed-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .speed-opt {
      background-color: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: var(--radius-xs);
      font-size: 0.78rem;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
    }

    .speed-opt.active {
      border-color: #fff;
    }

    #video-file-input, #sub-file-input, #cover-file-input, #ep-thumb-file-input { display: none; }
  </style>
</head>
<body>

  <!-- TOP APP BAR -->
  <header class="top-bar">
    <div class="brand-logo" onclick="showCatalogView()">
      <div class="brand-dot"></div>
      KURO ANIME
    </div>

    <div class="search-box">
      <svg class="svg-icon search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" class="search-input" id="searchInput" placeholder="Поиск аниме или серии..." oninput="handleSearchInput()">
    </div>

    <button class="add-btn" onclick="openPublishModal()">
      <svg class="svg-icon" viewBox="0 0 24 24" style="width:14px;height:14px;stroke:#000;stroke-width:3;"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      Добавить
    </button>
  </header>

  <main class="app-main">

    <!-- VIDEO PLAYER WITH INVISIBLE TOUCH LOCK -->
    <div class="player-wrap" id="playerWrap">
      <video class="video-node" id="videoNode" playsinline webkit-playsinline></video>

      <!-- Spinner Loader -->
      <div class="player-spin" id="playerSpin"></div>

      <!-- INVISIBLE TOUCH SHIELD OVERLAY (NO TEXT OVERLAY) -->
      <div class="lock-shield" id="lockShield"></div>

      <!-- Lock Pin Button (Turns GREEN when locked) -->
      <div class="lock-pin">
        <button class="lock-btn" id="lockBtn" title="Заблокировать сенсор">
          <svg class="svg-icon" id="lockIcon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        </button>
      </div>

      <!-- Controls Overlay -->

  <!-- JAVASCRIPT ENGINE -->
  <script>
    // ==========================================================================
    // 1. FIREBASE REALTIME DATABASE INITIALIZATION
    // ==========================================================================
    const firebaseConfig = {
      apiKey: "AIzaSyBm0mIvHVznIeF2PoFk6dtdaiT5r877wyA",
      authDomain: "meow-874ce.firebaseapp.com",
      databaseURL: "https://meow-874ce-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "meow-874ce",
      storageBucket: "meow-874ce.firebasestorage.app",
      messagingSenderId: "471541334599",
      appId: "1:471541334599:web:567af3e7dbe70a37572762"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    // NODES
    const animeLibRef = db.ref('anime_library');
    const videosRef = db.ref('videos'); // TikTok / Older uploaded videos node
    const coversRef = db.ref('anime_covers');

    let rawAnimeLibData = {};
    let rawVideosData = {};
    let allAnimeItems = [];
    let allCoversData = {};

    let selectedCategory = null;
    let selectedSeason = 1;
    let activeEpisodeId = null;

    let coverBase64 = null;
    let epThumbBase64 = null;

    // Listen Covers Node
    coversRef.on('value', (snap) => {
      allCoversData = snap.val() || {};
      combineAndRenderAll();
    });

    // Listen 'anime_library' Node
    animeLibRef.on('value', (snap) => {
      rawAnimeLibData = snap.val() || {};
      combineAndRenderAll();
    });

    // Listen 'videos' Node (Previously uploaded videos in TikTok mode)
    videosRef.on('value', (snap) => {
      rawVideosData = snap.val() || {};
      combineAndRenderAll();
    });

    // MERGE ALL DATA SOURCES (No previously uploaded videos lost!)
    function combineAndRenderAll() {
      const items = [];

      // 1. Parse 'anime_library'
      Object.keys(rawAnimeLibData).forEach(k => {
        const item = rawAnimeLibData[k];
        items.push({
          id: k,
          category: item.category || 'Без категории',
          name: item.name || item.title || 'Серия',
          season: parseInt(item.season) || 1,
          episode: parseInt(item.episode) || 1,
          url: item.url || '',
          thumbnail: item.thumbnail || null
        });
      });

      // 2. Parse 'videos' (Older uploads)
      Object.keys(rawVideosData).forEach(k => {
        const item = rawVideosData[k];
        // Avoid duplicate IDs
        if (!items.some(existing => existing.id === k)) {
          items.push({
            id: k,
            category: item.category || item.title || 'Мои загрузки',
            name: item.name || item.title || 'Серия',
            season: parseInt(item.season) || 1,
            episode: parseInt(item.episode) || 1,
            url: item.url || '',
            thumbnail: item.thumbnail || null
          });
        }
      });

      allAnimeItems = items;
      renderCatalogView();
      if (selectedCategory) renderDetailsView(selectedCategory);
    }

    // ==========================================================================
    // 2. NAVIGATION & CATALOG RENDERING WITH REALTIME SEARCH
    // ==========================================================================
    function showCatalogView() {
      selectedCategory = null;
      document.getElementById('catalogView').style.display = 'block';
      document.getElementById('detailsView').style.display = 'none';
      renderCatalogView();
    }

    function handleSearchInput() {
      if (!selectedCategory) {
        renderCatalogView();
      } else {
        renderDetailsView(selectedCategory);
      }
    }

    function renderCatalogView() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const grid = document.getElementById('animeCardsGrid');
      const countText = document.getElementById('animeCountText');

      if (allAnimeItems.length === 0) {
        grid.innerHTML = '';
        countText.textContent = '0 тайтлов';
        grid.parentElement.innerHTML = `
          <div class="empty-box">
            <div style="font-size:0.9rem; font-weight:700; color:#fff;">База аниме пуста</div>
            <div style="font-size:0.75rem; color:var(--text-dim); max-width:300px;">Нажмите «Добавить» и опубликуйте первую серию или обложку!</div>
            <button class="add-btn" onclick="openPublishModal()" style="margin-top:8px;">+ Добавить аниме</button>
          </div>
        `;
        return;
      }

      // Group Anime Items by Category (Title)
      const categoriesMap = {};
      allAnimeItems.forEach(item => {
        const cat = item.category ? item.category.trim() : 'Мои загрузки';
        if (!categoriesMap[cat]) categoriesMap[cat] = [];
        categoriesMap[cat].push(item);
      });

      let categoryNames = Object.keys(categoriesMap);

      // Filter by Search Query
      if (query) {
        categoryNames = categoryNames.filter(name => name.toLowerCase().includes(query));
      }

      countText.textContent = `${categoryNames.length} тайтлов`;

      if (categoryNames.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding:30px; font-size:0.8rem; color:var(--text-dim);">Ничего не найдено по вашему запросу</div>';
        return;
      }

      grid.innerHTML = categoryNames.map(categoryName => {
        const eps = categoriesMap[categoryName];
        const coverObj = allCoversData[sanitizeKey(categoryName)] || {};
        const coverImage = coverObj.coverUrl || (eps[0] && eps[0].thumbnail) || null;

        return `
          <div class="anime-poster-card" onclick="openAnimeDetails('${escapeAttr(categoryName)}')">
            <div class="poster-box">
              ${coverImage ? `<img class="poster-img" src="${coverImage}" loading="lazy" alt="${escapeHtml(categoryName)}">` : `<div class="poster-fallback">${escapeHtml(categoryName)}</div>`}
              <span class="ep-count-tag">${eps.length} сер.</span>
            </div>
            <div class="card-meta-padding">
              <div class="card-title-txt">${escapeHtml(categoryName)}</div>
              <div class="card-sub-txt">Обновлено в RTDB</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function openAnimeDetails(categoryName) {
      selectedCategory = categoryName;
      selectedSeason = 1;
      document.getElementById('catalogView').style.display = 'none';
      document.getElementById('detailsView').style.display = 'block';
      renderDetailsView(categoryName);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderDetailsView(categoryName) {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const categoryEps = allAnimeItems.filter(item => (item.category || '').trim() === categoryName);
      
      const coverObj = allCoversData[sanitizeKey(categoryName)] || {};
      const coverImage = coverObj.coverUrl || (categoryEps[0] && categoryEps[0].thumbnail) || null;

      // DOM Info
      document.getElementById('detailTitle').textContent = categoryName;
      const detailCoverBox = document.getElementById('detailCoverBox');
      if (coverImage) {
        detailCoverBox.innerHTML = `<img class="detail-cover-img" src="${coverImage}" alt="Cover">`;
      } else {
        detailCoverBox.innerHTML = `<div style="font-size:0.7rem; color:var(--text-dim); text-align:center; padding:8px;">${escapeHtml(categoryName)}</div>`;
      }

      // Group by seasons
      const seasonsSet = new Set(categoryEps.map(e => parseInt(e.season) || 1));
      const seasonsArr = Array.from(seasonsSet).sort((a,b) => a - b);
      if (seasonsArr.length > 0 && !seasonsArr.includes(selectedSeason)) {
        selectedSeason = seasonsArr[0];
      }

      document.getElementById('detailMeta').textContent = `${seasonsArr.length || 1} сем. • ${categoryEps.length} серий`;

      // Render Season Tabs
      const seasonTabsRow = document.getElementById('seasonTabsRow');
      seasonTabsRow.innerHTML = seasonsArr.map(s => `
        <button class="season-tab ${selectedSeason === s ? 'active' : ''}" onclick="selectSeason(${s})">Сезон ${s}</button>
      `).join('');

      // Filter Episodes by Season & Search Query
      let currentSeasonEps = categoryEps.filter(e => (parseInt(e.season) || 1) === selectedSeason);
      currentSeasonEps.sort((a,b) => (parseInt(a.episode) || 1) - (parseInt(b.episode) || 1));

      if (query) {
        currentSeasonEps = currentSeasonEps.filter(e => 
          (e.name || '').toLowerCase().includes(query) ||
          String(e.episode).includes(query)
        );
      }

      const grid = document.getElementById('episodesPreviewGrid');
      if (currentSeasonEps.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1/-1; padding:20px; text-align:center; font-size:0.75rem; color:var(--text-dim);">Нет серий в этом сезоне</div>';
        return;
      }

      grid.innerHTML = currentSeasonEps.map(ep => `
        <div class="ep-preview-card ${activeEpisodeId === ep.id ? 'now-playing' : ''}" onclick="startEpisode('${ep.id}', '${escapeAttr(ep.url)}', '${escapeAttr(categoryName)}', '${escapeAttr(ep.name)}', ${ep.season}, ${ep.episode})">
          <div class="ep-thumb-box">
            ${ep.thumbnail ? `<img class="ep-thumb-img" src="${ep.thumbnail}" loading="lazy" alt="Preview">` : `<div style="font-size:0.65rem; color:var(--text-dim); text-align:center; padding:4px;">Превью серии</div>`}
            <span class="ep-number-tag">Эпизод ${ep.episode}</span>
            <div class="ep-play-overlay">
              <svg class="svg-icon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            </div>
          </div>
          <div class="ep-card-body">
            <div class="ep-card-title">${escapeHtml(ep.name || ('Серия ' + ep.episode))}</div>
          </div>
        </div>
      `).join('');
    }

    function selectSeason(seasonNum) {
      selectedSeason = seasonNum;
      if (selectedCategory) renderDetailsView(selectedCategory);
    }

    // ==========================================================================
    // 3. HARDENED VIDEO PLAYER WITH TOUCH LOCK
    // ==========================================================================
    const video = document.getElementById('videoNode');
    const playerWrap = document.getElementById('playerWrap');
    const playerOverlay = document.getElementById('playerOverlay');
    const playerSpin = document.getElementById('playerSpin');
    const lockShield = document.getElementById('lockShield');
    const lockBtn = document.getElementById('lockBtn');
    const lockIcon = document.getElementById('lockIcon');
    
    const pTitle = document.getElementById('pTitle');
    const sourceTag = document.getElementById('sourceTag');

    const videoFileInput = document.getElementById('video-file-input');
    const subFileInput = document.getElementById('sub-file-input');

    const centerPlayBtn = document.getElementById('centerPlayBtn');
    const bottomPlayBtn = document.getElementById('bottomPlayBtn');
    const centerPlayIcon = centerPlayBtn.querySelector('svg');
    const bottomPlayIcon = bottomPlayBtn.querySelector('svg');

    const timelineBar = document.getElementById('timelineBar');
    const timelineFill = document.getElementById('timelineFill');
    const timelineThumb = document.getElementById('timelineThumb');
    const currTimeEl = document.getElementById('currTime');
    const durTimeEl = document.getElementById('durTime');
    const speedBadge = document.getElementById('speedBadge');
    const speedModal = document.getElementById('speedModal');

    let hls = null;
    let hideTimeout = null;
    let isLocked = false;
    let touchCount = 0;

    const iconPlay = '<polygon points="5 3 19 12 5 21 5 3"></polygon>';
    const iconPause = '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>';
    const lockClosed = '<rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path>';
    const lockOpen = '<rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path>';

    // LOCK SHIELD ABSOERBS ALL TOUCH/CLICK EVENTS WITH NO TEXT OVERLAYS
    lockShield.addEventListener('click', (e) => { e.stopPropagation(); e.preventDefault(); });
    lockShield.addEventListener('touchstart', (e) => { e.stopPropagation(); e.preventDefault(); }, {passive: false});
    lockShield.addEventListener('touchend', (e) => { e.stopPropagation(); e.preventDefault(); }, {passive: false});

    lockBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      e.preventDefault();
      isLocked = !isLocked;
      if (isLocked) {
        lockShield.style.display = 'block';
        lockIcon.innerHTML = lockClosed;
        playerOverlay.classList.add('hidden');
        lockBtn.classList.add('is-locked'); // Turns GREEN when locked
      } else {
        lockShield.style.display = 'none';
        lockIcon.innerHTML = lockOpen;
        playerOverlay.classList.remove('hidden');
        lockBtn.classList.remove('is-locked'); // White when unlocked
      }
    });

    function convertGoogleDriveUrl(url) {
      if (!url) return '';
      if (url.includes('drive.google.com')) {
        const match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
        if (match && match[1]) {
          return `https://drive.google.com/uc?export=download&id=${match[1]}`;
        }
      }
      return url;
    }

    function startEpisode(id, rawUrl, category, epName, season, episode) {
      if (isLocked) return;
      activeEpisodeId = id;
      const finalUrl = convertGoogleDriveUrl(rawUrl);
      const fullTitle = `${category} — S${season}E${episode}: ${epName}`;

      showSpin(true);
      pTitle.textContent = fullTitle;
      sourceTag.textContent = rawUrl.includes('drive.google.com') ? 'GDRIVE' : 'STREAM';

      // Highlight in details view
      if (selectedCategory) renderDetailsView(selectedCategory);

      // Scroll smoothly to player
      window.scrollTo({ top: 0, behavior: 'smooth' });

      if (hls) { hls.destroy(); hls = null; }

      if (finalUrl.includes('.m3u8')) {
        if (Hls.isSupported()) {
          hls = new Hls();
          hls.loadSource(finalUrl);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            showSpin(false);
            video.play().catch(()=>{});
            updatePlayState(true);
          });
        } else {
          video.src = finalUrl;
          video.play().catch(()=>{});
        }
      } else {
        video.src = finalUrl;
        video.play().then(() => {
          showSpin(false);
          updatePlayState(true);
        }).catch(() => showSpin(false));
      }
      resetHideTimer();
    }

    function togglePlay() {
      if (isLocked) return;
      if (video.paused || video.ended) {
        video.play();
        updatePlayState(true);
      } else {
        video.pause();
        updatePlayState(false);
      }
      resetHideTimer();
    }

    function updatePlayState(isPlaying) {
      const svg = isPlaying ? iconPause : iconPlay;
      centerPlayIcon.innerHTML = svg;
      bottomPlayIcon.innerHTML = svg;
    }

    centerPlayBtn.addEventListener('click', (e) => { e.stopPropagation(); togglePlay(); });
    bottomPlayBtn.addEventListener('click', (e) => { e.stopPropagation(); togglePlay(); });

    function showSpin(show) { playerSpin.style.display = show ? 'block' : 'none'; }

    video.addEventListener('waiting', () => showSpin(true));
    video.addEventListener('playing', () => showSpin(false));

    function resetHideTimer() {
      clearTimeout(hideTimeout);
      if (!video.paused && !isLocked) {
        // AUTOHIDE CONTROLS IN 1 SECOND
        hideTimeout = setTimeout(() => {
          playerOverlay.classList.add('hidden');
        }, 1000);
      }
    }

    playerWrap.addEventListener('touchstart', (e) => { touchCount = e.touches.length; }, {passive: true});
    playerWrap.addEventListener('touchend', (e) => { touchCount = e.touches.length; }, {passive: true});

    playerWrap.addEventListener('click', (e) => {
      if (isLocked || touchCount > 1) return;
      if (e.target === playerWrap || e.target === video || e.target.classList.contains('p-center')) {
        if (playerOverlay.classList.contains('hidden')) {
          playerOverlay.classList.remove('hidden');
          resetHideTimer();
        } else {
          playerOverlay.classList.add('hidden');
          clearTimeout(hideTimeout);
        }
      }
    });

    // Double Tap Seeking (-10s / +10s)
    let lastL = 0, lastR = 0;
    const tapL = document.getElementById('tapL');
    const tapR = document.getElementById('tapR');

    tapL.addEventListener('click', (e) => {
      e.stopPropagation();
      if (isLocked) return;
      const now = Date.now();
      if (now - lastL < 300) {
        video.currentTime = Math.max(0, video.currentTime - 10);
        flash(tapL);
      }
      lastL = now;
      resetHideTimer();
    });

    tapR.addEventListener('click', (e) => {
      e.stopPropagation();
      if (isLocked) return;
      const now = Date.now();
      if (now - lastR < 300) {
        video.currentTime = Math.min(video.duration, video.currentTime + 10);
        flash(tapR);
      }
      lastR = now;
      resetHideTimer();
    });

    function flash(el) {
      el.classList.add('active');
      setTimeout(() => el.classList.remove('active'), 250);
    }

    // Timeline
    video.addEventListener('timeupdate', () => {
      if (!video.duration) return;
      const p = (video.currentTime / video.duration) * 100;
      timelineFill.style.width = p + '%';
      timelineThumb.style.left = p + '%';
      currTimeEl.textContent = fmt(video.currentTime);
      durTimeEl.textContent = fmt(video.duration);
    });

    video.addEventListener('loadedmetadata', () => {
      durTimeEl.textContent = fmt(video.duration);
    });

    function handleSeek(e) {
      if (isLocked) return;
      const rect = timelineBar.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      let pos = (clientX - rect.left) / rect.width;
      pos = Math.max(0, Math.min(1, pos));
      if (video.duration) video.currentTime = pos * video.duration;
    }

    timelineBar.addEventListener('click', handleSeek);
    timelineBar.addEventListener('touchmove', handleSeek);

    function fmt(s) {
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${m < 10 ? '0' : ''}${m}:${sec < 10 ? '0' : ''}${sec}`;
    }

    // Fullscreen
    document.getElementById('fsBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      if (isLocked) return;
      if (!document.fullscreenElement) {
        if (playerWrap.requestFullscreen) playerWrap.requestFullscreen();
        if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
      }
    });

    // PiP
    document.getElementById('pipBtn').addEventListener('click', async (e) => {
      e.stopPropagation();
      if (isLocked) return;
      try {
        if (document.pictureInPictureElement) await document.exitPictureInPicture();
        else if (document.pictureInPictureEnabled) await video.requestPictureInPicture();
      } catch(err){}
    });

    // Subtitles
    function triggerSubUpload() { if (!isLocked) subFileInput.click(); }
    subFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const old = video.querySelector('track');
        if (old) video.removeChild(old);
        const tr = document.createElement('track');
        tr.kind = 'subtitles';
        tr.srclang = 'ru';
        tr.src = URL.createObjectURL(file);
        tr.default = true;
        video.appendChild(tr);
        alert('Субтитры подключены.');
      }
    });

    // Speed Modal
    function openSpeedModal() { if (!isLocked) speedModal.classList.add('show'); }
    function closeSpeedModal() { speedModal.classList.remove('show'); }
    function setSpeed(spd) {
      video.playbackRate = spd;
      speedBadge.textContent = spd + 'x';
      document.querySelectorAll('.speed-opt').forEach(o => o.classList.remove('active'));
      event.target.classList.add('active');
      closeSpeedModal();
    }

    // ==========================================================================
    // 4. PUBLISHING & GALLERY FILE CONVERTERS FOR FIREBASE RTDB
    // ==========================================================================
    function openPublishModal() {
      document.getElementById('publishModal').classList.add('show');
    }

    function closePublishModal(e) {
      if (e && e.target !== document.getElementById('publishModal')) return;
      document.getElementById('publishModal').classList.remove('show');
    }

    function switchModalTab(tab) {
      if (tab === 'ep') {
        document.getElementById('mTabEp').classList.add('active');
        document.getElementById('mTabCover').classList.remove('active');
        document.getElementById('formEpisode').style.display = 'flex';
        document.getElementById('formCover').style.display = 'none';
      } else {
        document.getElementById('mTabCover').classList.add('active');
        document.getElementById('mTabEp').classList.remove('active');
        document.getElementById('formCover').style.display = 'flex';
        document.getElementById('formEpisode').style.display = 'none';
      }
    }

    // File Triggers
    const coverFileInput = document.getElementById('cover-file-input');
    const epThumbFileInput = document.getElementById('ep-thumb-file-input');

    function triggerCoverUpload() { coverFileInput.click(); }
    function triggerEpThumbUpload() { epThumbFileInput.click(); }

    coverFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          coverBase64 = event.target.result;
          document.getElementById('coverFileStatus').style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    });

    epThumbFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          epThumbBase64 = event.target.result;
          document.getElementById('epThumbStatus').style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    });

    // Submit Episode to 'anime_library' Node
    function publishEpisode() {
      const category = document.getElementById('inputCategory').value.trim();
      const name = document.getElementById('inputName').value.trim();
      const season = parseInt(document.getElementById('inputSeason').value) || 1;
      const episode = parseInt(document.getElementById('inputEpisode').value) || 1;
      const url = document.getElementById('inputUrl').value.trim();
      const customThumbUrl = document.getElementById('inputEpThumbUrl').value.trim();

      if (!category || !name || !url) {
        alert('Пожалуйста, заполните категорию, название серии и ссылку на видео');
        return;
      }

      const finalThumbnail = epThumbBase64 || customThumbUrl || null;

      const newRef = animeLibRef.push();
      newRef.set({
        category: category,
        name: name,
        season: season,
        episode: episode,
        url: url,
        thumbnail: finalThumbnail,
        createdAt: Date.now()
      }).then(() => {
        document.getElementById('inputCategory').value = '';
        document.getElementById('inputName').value = '';
        document.getElementById('inputSeason').value = '1';
        document.getElementById('inputEpisode').value = '1';
        document.getElementById('inputUrl').value = '';
        document.getElementById('inputEpThumbUrl').value = '';
        epThumbBase64 = null;
        document.getElementById('epThumbStatus').style.display = 'none';

        closePublishModal();
        alert('🎉 Серия добавлена в базу данных!');
      }).catch((err) => {
        alert('Ошибка при сохранении: ' + err.message);
      });
    }

    // Submit Anime Main Cover to 'anime_covers' Node
    function publishAnimeCover() {
      const category = document.getElementById('inputCoverCategory').value.trim();
      const coverUrl = document.getElementById('inputCoverUrl').value.trim();

      if (!category) {
        alert('Пожалуйста, укажите название аниме');
        return;
      }

      const finalCover = coverBase64 || coverUrl;
      if (!finalCover) {
        alert('Пожалуйста, укажите ссылку на обложку или выберите файл из галереи');
        return;
      }

      const key = sanitizeKey(category);
      coversRef.child(key).set({
        title: category,
        coverUrl: finalCover,
        updatedAt: Date.now()
      }).then(() => {
        document.getElementById('inputCoverCategory').value = '';
        document.getElementById('inputCoverUrl').value = '';
        coverBase64 = null;
        document.getElementById('coverFileStatus').style.display = 'none';

        closePublishModal();
        alert('🖼️ Главная обложка аниме сохранена!');
      }).catch((err) => {
        alert('Ошибка при сохранении обложки: ' + err.message);
      });
    }

    function sanitizeKey(str) {
      return encodeURIComponent(str).replace(/\./g, '%2E');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    function escapeAttr(str) {
      if (!str) return '';
      return String(str).replace(/'/g, "\\'");
    }
  </script>
</body>
</html>
