<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tsuyu // Feed</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <!-- jsmediatags for ID3 audio tags -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <!-- JSZip for ZIP Unpacking -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg: #000000;
            --surface: #0a0a0a;
            --surface-hover: #141414;
            --border: #1f1f1f;
            --border-focus: #333333;
            --text: #ffffff;
            --text-secondary: #8a8a8a;
            --text-muted: #525252;
            --accent: #ffffff;
            --accent-invert: #000000;
            --danger: #ff453a;
            --success: #30d158;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-full: 9999px;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --safe-bottom: env(safe-area-inset-bottom, 20px);
            --safe-top: env(safe-area-inset-top, 20px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font);
            overflow: hidden;
            user-select: none;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            max-width: 600px;
            margin: 0 auto;
            background-color: var(--bg);
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
            overflow: hidden;
        }

        @media (min-width: 601px) {
            .app-container {
                height: 94vh;
                margin-top: 3vh;
                border-radius: var(--radius-lg);
                border: 1px solid var(--border);
            }
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: calc(var(--safe-top) + 12px) 16px 12px 16px;
            background-color: var(--bg);
            border-bottom: 1px solid var(--border);
            z-index: 100;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .channel-avatar {
            width: 38px;
            height: 38px;
            border-radius: var(--radius-full);
            background-color: var(--surface-hover);
            border: 1px solid var(--border-focus);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: -0.5px;
            overflow: hidden;
            object-fit: cover;
            color: var(--text);
        }

        .channel-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .channel-info h1 {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.2;
            color: var(--text);
            letter-spacing: -0.2px;
        }

        .channel-info p {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 1px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text);
            width: 36px;
            height: 36px;
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }

        .icon-btn:active {
            background-color: var(--surface-hover);
            border-color: var(--border-focus);
            transform: scale(0.95);
        }

        .icon-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* Feed */
        .feed {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .feed::-webkit-scrollbar {
            width: 4px;
        }
        .feed::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: var(--radius-full);
        }

        /* Post Card */
        .post {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            transition: border-color 0.2s;
        }

        .post:hover {
            border-color: var(--border-focus);
        }

        .post-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .post-author {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .post-author-avatar {
            width: 28px;
            height: 28px;
            border-radius: var(--radius-full);
            background-color: var(--border-focus);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            overflow: hidden;
            flex-shrink: 0;
            color: var(--text);
        }

        .post-author-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .post-author-name {
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text);
        }

        .post-time {
            font-size: 11px;
            color: var(--text-muted);
        }

        .post-content {
            font-size: 14.5px;
            line-height: 1.5;
            color: var(--text);
            word-break: break-word;
            white-space: pre-wrap;
        }

        .post-content code {
            background-color: var(--bg);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
            border: 1px solid var(--border);
            color: #ffffff;
        }

        /* Collage Grid */
        .collage-grid {
            display: grid;
            gap: 3px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            background-color: #000000;
            width: 100%;
        }

        .collage-grid.grid-1 { grid-template-columns: 1fr; }
        .collage-grid.grid-2 { grid-template-columns: 1fr 1fr; }
        .collage-grid.grid-3 { grid-template-columns: 1fr 1fr; }
        .collage-grid.grid-3 .collage-item:first-child { grid-column: span 2; }
        .collage-grid.grid-4 { grid-template-columns: 1fr 1fr; }
        .collage-grid.grid-multi { grid-template-columns: repeat(3, 1fr); }

        .collage-item {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 180px;
            max-height: 380px;
            background-color: #000000;
            overflow: hidden;
            cursor: pointer;
        }

        .collage-grid.grid-1 .collage-item {
            min-height: 220px;
            max-height: 420px;
        }

        .collage-item img, .collage-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Audio Player Card */
        .audio-list-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }

        .audio-player-card {
            background-color: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .audio-track-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .audio-cover {
            position: relative;
            width: 48px;
            height: 48px;
            border-radius: 6px;
            object-fit: cover;
            flex-shrink: 0;
            background-color: var(--surface-hover);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .audio-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .audio-cover svg {
            width: 22px;
            height: 22px;
            fill: var(--text-secondary);
        }

        .audio-details {
            flex: 1;
            min-width: 0;
        }

        .audio-title {
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .audio-artist {
            font-size: 11.5px;
            color: var(--text-secondary);
            margin-top: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .audio-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .audio-play-btn {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-full);
            background-color: var(--accent);
            color: var(--accent-invert);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.1s;
        }

        .audio-play-btn:active {
            transform: scale(0.92);
        }

        .audio-play-btn svg {
            width: 14px;
            height: 14px;
            fill: var(--accent-invert);
        }

        .audio-progress-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .audio-slider-container {
            position: relative;
            height: 4px;
            background-color: var(--border);
            border-radius: var(--radius-full);
            cursor: pointer;
            overflow: hidden;
        }

        .audio-progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background-color: var(--text);
            border-radius: var(--radius-full);
            width: 0%;
            transition: width 0.1s linear;
        }

        .audio-time-row {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .post-sticker-img {
            max-width: 160px;
            max-height: 160px;
            object-fit: contain;
            display: block;
            margin-top: 4px;
        }

        .inline-emoji-img {
            width: 22px;
            height: 22px;
            object-fit: contain;
            vertical-align: middle;
            display: inline-block;
            margin: 0 2px;
        }

        /* Lightbox Fullscreen Viewer */
        .lightbox-modal {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .lightbox-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox-content {
            max-width: 96vw;
            max-height: 92vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox-content img, .lightbox-content video {
            max-width: 100%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 4px;
        }

        .lightbox-close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--surface);
            border: 1px solid var(--border-focus);
            color: var(--text);
            width: 38px;
            height: 38px;
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 3010;
        }

        /* Poll Widget */
        .poll-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 4px;
        }

        .poll-question {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 2px;
        }

        .poll-option {
            position: relative;
            background-color: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            font-size: 13px;
            cursor: pointer;
            overflow: hidden;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.2s;
        }

        .poll-option:hover {
            border-color: var(--border-focus);
        }

        .poll-progress {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            background-color: var(--surface-hover);
            z-index: 1;
            transition: width 0.4s cubic-bezier(0.1, 1, 0.1, 1);
        }

        .poll-option span {
            position: relative;
            z-index: 2;
        }

        .poll-option .poll-percent {
            font-weight: 600;
            color: var(--text-secondary);
        }

        /* Post Footer */
        .post-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 8px;
            border-top: 1px solid var(--border);
            margin-top: 4px;
            gap: 8px;
            flex-wrap: wrap;
        }

        .reactions-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .reaction-btn, .comment-btn {
            background-color: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-full);
            padding: 5px 11px;
            font-size: 12.5px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .reaction-btn:active, .reaction-btn.active, .comment-btn:active {
            background-color: var(--surface-hover);
            border-color: var(--text);
            color: var(--text);
            transform: scale(0.96);
        }

        .reaction-btn svg, .comment-btn svg {
            width: 15px;
            height: 15px;
            fill: currentColor;
        }

        .reaction-btn img.reaction-emoji-img {
            width: 18px;
            height: 18px;
            object-fit: contain;
        }

        .post-views {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: var(--text-muted);
            margin-left: auto;
        }

        .post-views svg {
            width: 14px;
            height: 14px;
            fill: var(--text-muted);
        }

        /* Dedicated Comments Screen Overlay */
        .comments-screen {
            position: absolute;
            inset: 0;
            background-color: var(--bg);
            z-index: 600;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.28s cubic-bezier(0.1, 1, 0.1, 1);
        }

        .comments-screen.active {
            transform: translateX(0);
        }

        .comments-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: calc(var(--safe-top) + 12px) 16px 12px 16px;
            background-color: var(--bg);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: var(--radius-full);
            transition: background 0.15s;
        }

        .back-btn:active {
            background-color: var(--surface-hover);
        }

        .back-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .comments-header-info h2 {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.2;
            color: var(--text);
        }

        .comments-header-info p {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .comments-scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .comments-scroll-area::-webkit-scrollbar {
            width: 4px;
        }
        .comments-scroll-area::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: var(--radius-full);
        }

        .original-post-pinned {
            border-left: 3px solid var(--text);
        }

        .comments-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 4px 0;
        }

        .comments-divider-line {
            flex: 1;
            height: 1px;
            background-color: var(--border);
        }

        .comments-divider-text {
            font-size: 11.5px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .comments-feed {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .comment-item {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .comment-avatar {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-full);
            background-color: var(--border-focus);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            overflow: hidden;
            flex-shrink: 0;
            color: var(--text);
        }

        .comment-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .comment-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .comment-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .comment-name {
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text);
            letter-spacing: -0.2px;
        }

        .comment-time {
            font-size: 11px;
            color: var(--text-muted);
        }

        .comment-text {
            font-size: 14px;
            color: var(--text);
            line-height: 1.45;
            word-break: break-word;
        }

        .comments-input-bar-wrapper {
            display: flex;
            flex-direction: column;
            background-color: var(--bg);
            border-top: 1px solid var(--border);
            padding: 8px 16px calc(var(--safe-bottom) + 8px) 16px;
            flex-shrink: 0;
            z-index: 10;
            position: relative;
        }

        .comments-input-bar {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .comments-input-box {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 6px;
            background-color: var(--surface);
            border: 1px solid var(--border-focus);
            border-radius: var(--radius-lg);
            padding: 6px 12px;
        }

        .comments-input-box .contenteditable {
            flex: 1;
            background: none;
            border: none;
            color: var(--text);
            font-family: var(--font);
            font-size: 14px;
            outline: none;
            resize: none;
            min-height: 24px;
            max-height: 90px;
            line-height: 24px;
            overflow-y: auto;
            -webkit-user-modify: read-write; /* Enable contenteditable for Safari */
        }
        
        .comments-input-box .contenteditable:empty::before {
            content: attr(data-placeholder);
            color: var(--text-secondary);
        }

        .sticker-btn-icon, .paperclip-btn-icon {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-full);
            transition: color 0.15s;
        }

        .sticker-btn-icon:hover, .paperclip-btn-icon:hover {
            color: var(--text);
        }

        .sticker-btn-icon svg, .paperclip-btn-icon svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .comment-send-btn {
            width: 38px;
            height: 38px;
            border-radius: var(--radius-full);
            background-color: var(--accent);
            color: var(--accent-invert);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.1s, opacity 0.15s;
        }

        .comment-send-btn:active {
            transform: scale(0.92);
            opacity: 0.85;
        }

        .comment-send-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* Bottom Navigation Bar */
        .nav-bar {
            display: flex;
            align-items: center;
            justify-content: space-around;
            background-color: var(--bg);
            border-top: 1px solid var(--border);
            padding: 8px 16px calc(var(--safe-bottom) + 8px) 16px;
            flex-shrink: 0;
            z-index: 100;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            font-size: 10px;
            font-weight: 500;
            transition: color 0.15s;
            width: 60px;
        }

        .nav-item.active {
            color: var(--text);
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: absolute;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: flex-end;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-sheet {
            width: 100%;
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-bottom: none;
            border-top-left-radius: var(--radius-lg);
            border-top-right-radius: var(--radius-lg);
            padding: 18px 16px calc(var(--safe-bottom) + 16px) 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.1, 1, 0.1, 1);
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-overlay.open .modal-sheet {
            transform: translateY(0);
        }

        .sheet-handle {
            width: 36px;
            height: 4px;
            background-color: var(--border-focus);
            border-radius: var(--radius-full);
            align-self: center;
            margin-bottom: -2px;
        }

        .sheet-header-title {
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            color: var(--text);
        }

        /* Attachment Bar */
        .tg-attachment-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: var(--bg);
            border: 1px solid var(--border-focus);
            border-radius: var(--radius-sm);
            padding: 8px 12px;
        }

        .tg-paperclip-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 4px;
            border-radius: var(--radius-full);
            transition: color 0.15s, background 0.15s;
            flex-shrink: 0;
        }

        .tg-paperclip-btn:hover {
            color: var(--text);
            background-color: var(--surface-hover);
        }

        .tg-paperclip-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .tg-attachment-status {
            font-size: 13px;
            color: var(--text-secondary);
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Preview Grid */
        .attachments-preview-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
        }

        .attachment-thumb-item {
            position: relative;
            width: 100%;
            height: 80px;
            border-radius: 6px;
            overflow: hidden;
            background-color: #000;
            border: 1px solid var(--border);
        }

        .attachment-thumb-item img, .attachment-thumb-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .attachment-thumb-item.audio-thumb {
            display: flex;
            align-items: center;
            padding: 6px;
            gap: 6px;
            background-color: var(--bg);
        }

        .audio-thumb-cover {
            position: relative;
            width: 36px;
            height: 36px;
            border-radius: 4px;
            object-fit: cover;
            background: var(--surface-hover);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .audio-thumb-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .audio-thumb-info {
            flex: 1;
            min-width: 0;
            font-size: 10.5px;
            color: var(--text);
        }

        .audio-thumb-info div:first-child {
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .audio-thumb-info div:last-child {
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .remove-thumb-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(0, 0, 0, 0.85);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: var(--radius-full);
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 10px;
            z-index: 5;
        }

        /* Sticker & Emoji Picker Popup */
        .picker-tab-bar {
            display: flex;
            border-bottom: 1px solid var(--border);
            margin-bottom: 8px;
        }

        .picker-tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-secondary);
            padding: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .picker-tab-btn.active {
            color: var(--text);
            border-bottom-color: var(--text);
        }

        .sticker-picker-popup {
            position: absolute;
            bottom: 75px;
            right: 16px;
            width: 290px;
            max-height: 290px;
            background-color: var(--surface);
            border: 1px solid var(--border-focus);
            border-radius: var(--radius-md);
            padding: 12px;
            z-index: 2500;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.95);
        }

        .sticker-picker-header {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sticker-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            overflow-y: auto;
            max-height: 200px;
            padding-right: 2px;
        }

        .sticker-grid::-webkit-scrollbar {
            width: 3px;
        }
        .sticker-grid::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: var(--radius-full);
        }

        .sticker-item {
            width: 100%;
            aspect-ratio: 1;
            object-fit: contain;
            cursor: pointer;
            transition: transform 0.12s ease;
        }

        .sticker-item:active {
            transform: scale(0.88);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-label {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .text-input, .textarea-input {
            width: 100%;
            background-color: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px;
            color: var(--text);
            font-family: var(--font);
            font-size: 14px;
            outline: none;
            resize: none;
            transition: border-color 0.2s;
        }

        .text-input:focus, .textarea-input:focus {
            border-color: var(--text);
        }

        .textarea-input {
            min-height: 90px;
        }
        .contenteditable {
            width: 100%;
            background-color: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px;
            color: var(--text);
            font-family: var(--font);
            font-size: 14px;
            outline: none;
            min-height: 90px;
            line-height: 1.5;
            overflow-y: auto;
        }
        .contenteditable:focus {
            border-color: var(--text);
        }


        .btn-primary {
            background-color: var(--accent);
            color: var(--accent-invert);
            border: none;
            border-radius: var(--radius-sm);
            padding: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: opacity 0.15s, transform 0.1s;
        }

        .btn-primary:active {
            opacity: 0.8;
            transform: scale(0.98);
        }

        /* Search Bar View */
        .search-container {
            display: flex;
            align-items: center;
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 8px 12px;
            gap: 8px;
        }

        .search-container input {
            background: none;
            border: none;
            color: var(--text);
            font-size: 14px;
            outline: none;
            width: 100%;
            font-family: var(--font);
        }

        .search-container svg {
            width: 16px;
            height: 16px;
            fill: var(--text-muted);
            flex-shrink: 0;
        }

        /* Settings Card & Profiles */
        .settings-card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .settings-card-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .settings-card-title svg {
            width: 18px;
            height: 18px;
            fill: var(--text-secondary);
        }

        .avatar-edit-box {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .avatar-preview-lg {
            width: 56px;
            height: 56px;
            border-radius: var(--radius-full);
            background-color: var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            overflow: hidden;
            border: 1px solid var(--border-focus);
            flex-shrink: 0;
            color: var(--text);
        }

        .avatar-preview-lg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .file-upload-btn-minimal {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: border-color 0.15s, background-color 0.15s;
        }

        .file-upload-btn-minimal:hover {
            border-color: var(--text);
            background-color: var(--surface-hover);
        }

        /* Toggles UI in Channel Settings */
        .toggle-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 0;
        }
        .toggle-item label {
            font-size: 13px;
            color: var(--text);
        }
        .toggle-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        /* Multi Emoji Select Box */
        .emoji-select-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            max-height: 120px;
            overflow-y: auto;
            border: 1px solid var(--border);
            padding: 8px;
            border-radius: var(--radius-sm);
        }

        .emoji-select-item {
            width: 100%;
            aspect-ratio: 1;
            object-fit: contain;
            cursor: pointer;
            border: 2px solid transparent;
            border-radius: 4px;
            padding: 2px;
        }

        .emoji-select-item.selected {
            border-color: var(--accent);
            background-color: var(--surface-hover);
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
            color: var(--text-muted);
            gap: 12px;
            margin: auto 0;
        }

        .empty-state svg {
            width: 40px;
            height: 40px;
            fill: var(--text-muted);
        }

        .empty-state p {
            font-size: 13px;
        }

        .hidden {
            display: none !important;
        }

        /* Login/Register Modal */
        #auth-modal .modal-sheet {
            align-items: center;
            text-align: center;
        }
        #auth-modal .input-group {
            width: 100%;
            max-width: 300px;
        }
        #auth-modal .btn-primary {
            width: 100%;
            max-width: 300px;
        }
        #auth-modal .toggle-auth-mode {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 12px;
            margin-top: 10px;
            cursor: pointer;
        }
        #auth-modal h2 {
            font-size: 18px;
            margin-bottom: 15px;
        }
        .auth-loader {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--text-secondary);
            font-size: 13px;
            margin-top: 10px;
        }
        .auth-loader.hidden {
            display: none;
        }
        .auth-loader svg {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Header -->
    <header class="header">
        <div class="header-left" id="header-channel-profile">
            <div class="channel-avatar" id="header-avatar">TS</div>
            <div class="channel-info">
                <h1 id="header-title">Tsuyu Stream</h1>
                <p id="subscribers-count">18.4K подписчиков</p>
            </div>
        </div>
        <div class="header-actions">
            <button class="icon-btn" id="search-toggle-btn" title="Поиск">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </button>
            <button class="icon-btn" id="logout-btn" title="Выйти" style="display: none;">
                <svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
            </button>
        </div>
    </header>

    <!-- Search Bar -->
    <div id="search-bar-wrapper" class="hidden" style="padding: 10px 16px 0 16px; background: var(--bg);">
        <div class="search-container">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="search-input" placeholder="Поиск медиа, постов, треков...">
        </div>
    </div>

    <!-- Main Feed Container -->
    <main class="feed" id="feed-container">
        <!-- Dynamic posts injected here -->
        <div class="empty-state" id="feed-loading-state">
            <svg style="width: 32px; height: 32px;" viewBox="0 0 24 24"><path d="M12 4V2.21c0-.45-.39-.8-.85-.76C7.54 2.45 4 6.27 4 11c0 4.42 3.58 8 8 8s8-3.58 8-8c0-3.09-1.77-5.83-4.37-7.14-.4-.2-.84-.13-1.07.17-.24.31-.13.75.21.92 2.11 1.05 3.57 3.31 3.57 5.95 0 3.31-2.69 6-6 6s-6-2.69-6-6c0-3.15 2.4-5.74 5.48-5.96.4-.03.73-.37.73-.78z"/></svg>
            <p>Загрузка ленты...</p>
        </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="nav-bar" id="bottom-nav">
        <button class="nav-item active" data-tab="feed">
            <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
            <span>Лента</span>
        </button>
        <button class="nav-item" id="open-create-modal" style="display: none;">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            <span>Создать</span>
        </button>
        <button class="nav-item" data-tab="settings">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <span>Профиль</span>
        </button>
    </nav>

    <!-- Dedicated Comments Screen -->
    <div class="comments-screen" id="tg-comments-screen">
        <div class="comments-header">
            <button class="back-btn" id="close-comments-btn" title="Назад">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </button>
            <div class="comments-header-info">
                <h2>Обсуждение публикации</h2>
                <p id="tg-comments-subtitle">0 комментариев</p>
            </div>
        </div>

        <div class="comments-scroll-area">
            <!-- Pinned Original Post Container -->
            <div id="original-post-container"></div>

            <div class="comments-divider">
                <div class="comments-divider-line"></div>
                <div class="comments-divider-text">Комментарии</div>
                <div class="comments-divider-line"></div>
            </div>

            <!-- List of Comments -->
            <div class="comments-feed" id="comments-feed-container"></div>
        </div>

        <!-- Sticky Comment Input Bar -->
        <div class="comments-input-bar-wrapper" id="comment-input-area" style="display: none;">
            <!-- Comment Attachments Preview Grid -->
            <div class="attachments-preview-grid hidden" id="comment-attachments-preview" style="margin-bottom: 8px;">
                <!-- Dynamic attachment thumbs -->
            </div>

            <div class="comments-input-bar">
                <div class="comment-avatar" id="tg-comment-user-avatar" style="width: 32px; height: 32px; font-size: 13px;">U</div>
                <div class="comments-input-box">
                    <div class="contenteditable" id="tg-comment-input" contenteditable="true" data-placeholder="Прокомментировать..."></div>
                    
                    <!-- Paperclip for Comment Attachments -->
                    <label class="paperclip-btn-icon" id="comment-paperclip-btn" title="Прикрепить фото, видео или аудио">
                        <svg viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
                        <input type="file" id="comment-multi-file-input" accept="image/*,video/*,audio/*" multiple style="display: none;">
                    </label>

                    <button class="sticker-btn-icon" id="tg-comment-sticker-toggle" title="Стикеры и Премиум Эмодзи">
                        <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></svg>
                    </button>
                </div>
                <button class="comment-send-btn" id="tg-send-comment-btn" title="Отправить">
                    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>

                <!-- Comments Sticker & Premium Emoji Picker Popover -->
                <div class="sticker-picker-popup hidden" id="comments-sticker-picker">
                    <div class="picker-tab-bar">
                        <button class="picker-tab-btn active" onclick="switchPickerTab('comments', 'stickers')">Стикеры</button>
                        <button class="picker-tab-btn" onclick="switchPickerTab('comments', 'emojis')">Премиум Эмодзи</button>
                    </div>
                    <div class="sticker-picker-header">
                        <span id="comments-picker-title">Стикеры Tsuyu</span>
                        <span style="font-size: 10px; cursor: pointer;" onclick="document.getElementById('comments-sticker-picker').classList.add('hidden')">✕</span>
                    </div>
                    <div class="sticker-grid" id="comments-sticker-grid"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal: Create Post -->
<div class="modal-overlay" id="create-modal">
    <div class="modal-sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-header-title">Новая публикация</div>

        <div class="input-group">
            <div class="contenteditable" id="new-post-text" contenteditable="true" data-placeholder="Сообщение..."></div>
        </div>

        <!-- Attachment Bar with Paperclip 📎 & Sticker Button -->
        <div class="tg-attachment-box">
            <label class="tg-paperclip-btn" title="Прикрепить несколько файлов (Фото, Видео, Музыка)">
                <svg viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
                <input type="file" id="tg-multi-file-input" accept="image/*,video/*,audio/*" multiple style="display: none;">
            </label>
            
            <button class="tg-paperclip-btn" id="post-sticker-toggle" title="Вставить стикер или Премиум Эмодзи">

    function escapeHTML(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // Convert HTML content of contenteditable div to plain text with :[idx]: markers
    function contentEditableToText(editableDiv) {
        let text = '';
        editableDiv.childNodes.forEach(node => {
            if (node.nodeType === Node.TEXT_NODE) {
                text += node.textContent;
            } else if (node.nodeType === Node.ELEMENT_NODE && node.tagName === 'IMG' && node.classList.contains('inline-emoji-img')) {
                const alt = node.getAttribute('alt');
                const emojiIdx = alt ? alt.replace('emoji-', '') : '';
                text += `:[${emojiIdx}]:`;
            } else if (node.nodeType === Node.ELEMENT_NODE) {
                // For other HTML elements, like strong or code, keep original markdown format
                if (node.tagName === 'STRONG') {
                    text += `**${node.textContent}**`;
                } else if (node.tagName === 'CODE') {
                    text += ``${node.textContent}``;
                } else {
                    text += node.textContent; // Fallback for other tags, might need more specific handling
                }
            }
        });
        return text.trim();
    }

    // Insert HTML (like emoji <img>) into contenteditable at caret position
    function insertHtmlAtCaret(html, editableDiv) {
        editableDiv.focus();
        const selection = window.getSelection();
        if (selection.rangeCount > 0) {
            const range = selection.getRangeAt(0);
            range.deleteContents();
            const el = document.createElement('div');
            el.innerHTML = html;
            const frag = document.createDocumentFragment();
            let node, lastNode;
            while ( (node = el.firstChild) ) {
                lastNode = frag.appendChild(node);
            }
            range.insertNode(frag);

            // Set caret after the inserted element
            if (lastNode) {
                range.setStartAfter(lastNode);
                range.collapse(true);
                selection.removeAllRanges();
                selection.addRange(range);
            }
        } else {
            editableDiv.innerHTML += html;
        }
    }

            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/`([^`]+)`/g, '<code>$1</code>');

        // Replace :[idx]: custom emoji markers
        safe = safe.replace(/:\\[(\\d+)\\]:/g, (match, idxStr) => {
            const idx = parseInt(idxStr, 10);
            if (emojiPack && emojiPack[idx]) {
                return `<img class="inline-emoji-img" src="${emojiPack[idx]}" alt="emoji-${idx}">`;
            }
            return match;
        });

        return safe;
    }

    function initDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(dbName, 2);
            request.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(storeStickers)) {
                    db.createObjectStore(storeStickers);
                }
                if (!db.objectStoreNames.contains(storeEmojis)) {
                    db.createObjectStore(storeEmojis);
                }
            };
            request.onsuccess = (e) => resolve(e.target.result);
            request.onerror = (e) => reject(e.target.error);
        });
    }

    function saveToDB(storeName, key, data) {
        return initDB().then(db => {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, "readwrite");
                const store = tx.objectStore(storeName);
                const request = store.put(data, key);
                request.onsuccess = () => resolve();
                request.onerror = (e) => reject(e.target.error);
            });
        });
    }

    function loadFromDB(storeName, key) {
        return initDB().then(db => {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, "readonly");
                const store = tx.objectStore(storeName);
                const request = store.get(key);
                request.onsuccess = () => resolve(request.result || null);
                request.onerror = (e) => reject(e.target.error);
            });
        });
    }

    // Canvas Downscaling Helper (Preserves PNG/WebP transparency)
    function resizeImage(dataUrl, maxW = 300, maxH = 300) {
        return new Promise((resolve) => {
            const img = new Image();
            img.onload = () => {
                let w = img.width;
                let h = img.height;
                if (w > maxW || h > maxH) {
                    if (w > h) {
                        h = Math.round((h * maxW) / w);
                        w = maxW;
                    } else {
                        w = Math.round((w * maxH) / h);
                        h = maxH;
                    }
                }
                const canvas = document.createElement('canvas');
                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);
                resolve(canvas.toDataURL('image/png'));
            };
            img.onerror = () => resolve(dataUrl);
            img.src = dataUrl;
        });
    }

    // Audio Tag Reader
    function readAudioTags(file) {
        return new Promise((resolve) => {
            let defaultTitle = file.name.replace(/\.[^/.]+$/, "");
            let defaultArtist = "Неизвестный исполнитель";

            if (defaultTitle.includes(" - ")) {
                const parts = defaultTitle.split(" - ");
                defaultArtist = parts[0].trim();
                defaultTitle = parts.slice(1).join(" - ").trim();
            }

            if (typeof jsmediatags === 'undefined') {
                resolve({ title: defaultTitle, artist: defaultArtist, cover: null });
                return;
            }

            jsmediatags.read(file, {
                onSuccess: function(tag) {
                    const tags = tag.tags;
                    let title = tags.title ? tags.title.trim() : defaultTitle;
                    let artist = tags.artist ? tags.artist.trim() : defaultArtist;
                    let cover = null;

                    if (tags.picture) {
                        try {
                            const { data, format } = tags.picture;
                            let base64String = "";
                            for (let i = 0; i < data.length; i++) {
                                base64String += String.fromCharCode(data[i]);
                            }
                            cover = `data:${format};base64,${window.btoa(base64String)}`;
                        } catch (e) {}
                    }
                    resolve({ title, artist, cover });
                },
                onError: function() {
                    resolve({ title: defaultTitle, artist: defaultArtist, cover: null });
                }
            });
        });
    }

                svg.innerHTML = '<path d="M8 5v14l11-7z"/>';

        } else {
            audioEl.pause();
            playBtn.querySelector('svg').innerHTML = '<path d="M8 5v14l11-7z"/>';
        }

        audioEl.ontimeupdate = () => {
            if (audioEl.duration) {
                const pct = (audioEl.currentTime / audioEl.duration) * 100;
                progressBar.style.width = pct + '%';
                curTimeText.textContent = formatTime(audioEl.currentTime);

        };
    };

    window.seekAudio = function(event, postId, audioIndex) {
        const audioEl = document.getElementById(`audio-elem-${postId}-${audioIndex}`);
        const slider = event.currentTarget;
        if (!audioEl || !audioEl.duration) return;
        const rect = slider.getBoundingClientRect();
        const clickX = event.clientX - rect.left;
        const pct = clickX / rect.width;
        audioEl.currentTime = pct * audioEl.duration;
    };

    function formatTime(seconds) {
        if (isNaN(seconds)) return "0:00";
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    // Lightbox Fullscreen Viewer
    window.openLightbox = function(src, type) {
        lightboxContent.innerHTML = '';
        if (type === 'video') {
            const video = document.createElement('video');
            video.src = src;
            video.controls = true;
            video.autoplay = true;
            lightboxContent.appendChild(video);
        } else {
            const img = document.createElement('img');
            img.src = src;
            lightboxContent.appendChild(img);
        }
        lightboxModal.classList.add('active');
    };

    lightboxCloseBtn.addEventListener('click', () => {
        lightboxModal.classList.remove('active');
        lightboxContent.innerHTML = '';
    });

    lightboxModal.addEventListener('click', (e) => {
        if (e.target === lightboxModal) {
            lightboxModal.classList.remove('active');
            lightboxContent.innerHTML = '';
        }
    });

    // Render Media Collage Grid HTML safely
    function buildCollageHTML(mediaList) {
        if (!mediaList || mediaList.length === 0) return '';
        const count = mediaList.length;
        let gridClass = `grid-${count > 4 ? 'multi' : count}`;
        
        let itemsHtml = mediaList.map(item => {
            if (item.type === 'video') {
                return `
                    <div class="collage-item" onclick="openLightbox('${item.src}', 'video')">
                        <video src="${item.src}" muted preload="metadata"></video>
                    </div>
                `;
            } else {
                return `
                    <div class="collage-item" onclick="openLightbox('${item.src}', 'image')">
                        <img src="${item.src}" loading="lazy">
                    </div>
                `;
            }
        }).join('');

        return `<div class="collage-grid ${gridClass}">${itemsHtml}</div>`;
    }

    // Build Post Card HTML (Sanitized against XSS)
    function buildPostHTML(post, isPinnedInComments = false) {
        let safeText = renderFormattedText(post.text);

        let authorAvatarHtml = post.authorAvatar ? 
            `<img src="${post.authorAvatar}" alt="Avatar">` : 
            escapeHTML(post.author.substring(0, 2).toUpperCase() || 'TS');

        let collageHtml = buildCollageHTML(post.mediaList);

        // Render Audio Track List
        let audioListHtml = '';
        if (post.audioList && post.audioList.length > 0) {
            let tracksHtml = post.audioList.map((audio, idx) => {
                const currentCover = audio.userProvidedCover || audio.cover;
                let coverContent = currentCover ? 
                    `<img src="${currentCover}" alt="Cover">` : 
                    `<svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>`;

                return `
                    <div class="audio-player-card">
                        <audio id="audio-elem-${post.id}-${idx}" src="${audio.src}" preload="metadata"></audio>
                        <div class="audio-track-info">
                            <div class="audio-cover">${coverContent}</div>
                            <div class="audio-details">
                                <div class="audio-title">${escapeHTML(audio.title || 'Песня')}</div>
                                <div class="audio-artist">${escapeHTML(audio.artist || 'Исполнитель')}</div>
                            </div>
                        </div>
                        <div class="audio-controls">
                            <button class="audio-play-btn" id="play-btn-${post.id}-${idx}" onclick="toggleAudio('${post.id}', ${idx})">
                                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                            </button>
                            <div class="audio-progress-wrapper">
                                <div class="audio-slider-container" onclick="seekAudio(event, '${post.id}', ${idx})">
                                    <div class="audio-progress-bar" id="progress-${post.id}-${idx}"></div>
                                </div>
                                <div class="audio-time-row">
                                    <span id="time-cur-${post.id}-${idx}">0:00</span>
                                    <span id="time-dur-${post.id}-${idx}">--:--</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            audioListHtml = `<div class="audio-list-container">${tracksHtml}</div>`;
        }

        let stickerHtml = post.sticker ? `<img class="post-sticker-img" src="${post.sticker}">` : '';

        // Poll Widget
        let pollHtml = '';
        if (post.poll) {
            const totalVotes = post.poll.options.reduce((sum, opt) => sum + opt.votes, 0);
            let optionsHtml = post.poll.options.map((opt, idx) => {
                const percent = totalVotes > 0 ? Math.round((opt.votes / totalVotes) * 100) : 0;
                const isVoted = post.poll.userVoted === idx; // Assuming userVoted stores index for the current user
                return `
                    <div class="poll-option" onclick="votePoll('${post.id}', ${idx})" ${currentUser ? '' : 'style="pointer-events: none; opacity: 0.6;"'}>
                        <div class="poll-progress" style="width: ${percent}%"></div>
                        <span>${escapeHTML(opt.text)} ${isVoted ? '✓' : ''}</span>
                        <span class="poll-percent">${percent}%</span>
                    </div>
                `;
            }).join('');

            pollHtml = `
                <div class="poll-container">
                    <div class="poll-question">${escapeHTML(post.poll.question)}</div>
                    ${optionsHtml}
                </div>
            `;
        }

        // Reactions (Includes custom reactions enabled by channel owner)
        let reactionsHtml = Object.keys(post.reactions || {}).map(key => {
            const r = post.reactions[key];
            let emojiDisplay = r.isCustom ? `<img class="reaction-emoji-img" src="${r.emoji}">` : `<span>${r.emoji}</span>`;
            return `
                <button class="reaction-btn ${r.active ? 'active' : ''}" onclick="toggleReaction('${post.id}', '${key}')" ${currentUser ? '' : 'style="pointer-events: none; opacity: 0.6;"'}>
                    ${emojiDisplay}
                    <span>${r.count}</span>
                </button>
            `;
        }).join('');

        const commentCount = post.comments ? Object.keys(post.comments).length : 0;
        let commentsBtnHtml = `
            <button class="comment-btn" onclick="openTGCommentsScreen('${post.id}')">
                <svg viewBox="0 0 24 24"><path d="M21.99 4c0-1.1-.89-2-1.99-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4-.01-18zM18 14H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
                <span>${commentCount}</span>
            </button>
        `;

        return `
            <article class="post ${isPinnedInComments ? 'original-post-pinned' : ''}">
                <div class="post-header">
                    <div class="post-author">
                        <div class="post-author-avatar">${authorAvatarHtml}</div>
                        <span class="post-author-name">${escapeHTML(post.author)}</span>
                    </div>
                    <span class="post-time">${escapeHTML(post.time)}</span>
                </div>
                <div class="post-content">${safeText}</div>
                ${collageHtml}
                ${audioListHtml}
                ${stickerHtml}
                ${pollHtml}
                <div class="post-footer">
                    <div class="reactions-bar">
                        ${reactionsHtml}
                        ${!isPinnedInComments ? commentsBtnHtml : ''}
                    </div>
                    <div class="post-views">
                        <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                        <span>${post.views}</span>
                    </div>
                </div>
            </article>
        `;
    }

    // Render Feed Views
    function renderFeed() {
        if (currentTab === 'settings') {
            renderSettingsTab();
            return;
        }

        feedContainer.innerHTML = '';

        let postArray = Object.values(posts);
        let filteredPosts = postArray.filter(post => {
            return (post.text && post.text.toLowerCase().includes(searchQuery.toLowerCase())) ||
                   (post.author && post.author.toLowerCase().includes(searchQuery.toLowerCase()));
        });

        if (filteredPosts.length === 0) {
            feedContainer.innerHTML = `
                <div class="empty-state">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                    <p>Ничего не найдено</p>
                </div>
            `;
            return;
        }

        filteredPosts.forEach(post => {
            const wrapper = document.createElement('div');
            wrapper.innerHTML = buildPostHTML(post, false);
            feedContainer.appendChild(wrapper.firstElementChild);
        });

                });

                for (let i = 0; i < validFiles.length; i++) {
                    const blob = await zip.files[validFiles[i]].async("blob");
                    const rawDataUrl = await new Promise(res => {
                        const r = new FileReader();
                        r.onload = () => res(r.result);

    // Update Post Reactions with Custom Emojis enabled by Channel Owner
    function updateChannelPostReactions() {
        // Create a temporary reactions object to apply to all posts
        const baseReactions = {
            heart: { count: 0, emoji: "❤️", isCustom: false, active: false },
            cupid: { count: 0, emoji: "💘", isCustom: false, active: false }
        };

        (channelConfig.permissions?.enabledReactionEmojis || []).forEach(idx => {
            if (emojiPack[idx]) {
                baseReactions[`custom_${idx}`] = {
                    count: 0,
                    emoji: emojiPack[idx],
                    isCustom: true,
                    active: false
                };
            }
        });

        // Apply these reactions to all posts, preserving active state and existing counts if possible
        let updatedPosts = {};
        for (const postId in posts) {
            if (posts.hasOwnProperty(postId)) {
                let currentPost = { ...posts[postId] };
                let newReactions = { ...baseReactions }; // Start with configured reactions

                // Merge existing reaction counts and active state
                for (const key in newReactions) {
                    if (currentPost.reactions && currentPost.reactions[key]) {
                        newReactions[key].count = currentPost.reactions[key].count;
                        newReactions[key].active = currentPost.reactions[key].active;
                    }
                }
                currentPost.reactions = newReactions;
                updatedPosts[postId] = currentPost;
            }
        }
        posts = updatedPosts; // Update the global posts object
        renderFeed();
    }

    // Reactions & Poll Interactions
    window.toggleReaction = async function(postId, reactionKey) {
        if (!currentUser) { openAuthModal(); return; }
        const post = posts[Object.keys(posts).find(key => posts[key].id === postId)];
        if (!post) return;

        // Ensure post.reactions exists and has the reactionKey
        if (!post.reactions) post.reactions = {};
        if (!post.reactions[reactionKey]) {
            post.reactions[reactionKey] = { count: 0, emoji: emojiPack[reactionKey.replace('custom_', '')], isCustom: true, active: false };
        }

        const r = post.reactions[reactionKey];
        if (r.active) {
            r.active = false;
            r.count--;
        } else {
            r.active = true;
            r.count++;
        }
        await postsRef.child(postId).update({ reactions: post.reactions });
    };

    window.votePoll = async function(postId, optionIndex) {
        if (!currentUser) { openAuthModal(); return; }
        const post = posts[Object.keys(posts).find(key => posts[key].id === postId)];
        if (!post || !post.poll) return;
        if (post.poll.userVoted !== null) return; // Only allow one vote

        post.poll.userVoted = optionIndex; // Mark that current user voted
        post.poll.options[optionIndex].votes++;
        await postsRef.child(postId).update({ poll: post.poll });
    };

            poll: pollObj,
            reactions: { // Default reactions
                heart: { count: 0, emoji: "❤️", isCustom: false, active: false },
                cupid: { count: 0, emoji: "💘", isCustom: false, active: false }
            },
            comments: {},
            views: 1
        };

        // Initialize custom reactions based on channel permissions
        (channelConfig.permissions?.enabledReactionEmojis || []).forEach(idx => {
            if (emojiPack[idx]) {
                newPost.reactions[`custom_${idx}`] = {
                    count: 0,
                    emoji: emojiPack[idx],
                    isCustom: true,
                    active: false
                };
            }
        });

        try {
            await postsRef.child(newPostId).set(newPost);
            // Reset modal after successful publish
            document.getElementById('new-post-text').innerHTML = '';
            document.getElementById('new-post-poll').value = '';
            clearModalAttachments();
            createModal.classList.remove('open');
            // Data will be reloaded by Firebase listener
        } catch (error) {
            console.error("Error publishing post:", error);
            alert("Ошибка при публикации поста: " + error.message);
        }
    });

    // Search Bar
    searchToggleBtn.addEventListener('click', () => {
        searchBarWrapper.classList.toggle('hidden');
        if (!searchBarWrapper.classList.contains('hidden')) {
            searchInput.focus();
        } else {
            searchQuery = '';
            searchInput.value = '';
            renderFeed();
        }
    });

    searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderFeed();
    });

    // Navigation Tabs
    navItems.forEach(item => {
        item.addEventListener('click', () => {
            navItems.forEach(nav => nav.classList.remove('active'));
            item.classList.add('active');
            currentTab = item.getAttribute('data-tab');
            renderFeed();
        });
    });

    // --- Authentication Logic ---
    function openAuthModal() {
        authModal.classList.add('open');
    }

    authModal.addEventListener('click', (e) => {
        if (e.target === authModal) authModal.classList.remove('open');
    });

    toggleAuthModeBtn.addEventListener('click', () => {
        isRegisterMode = !isRegisterMode;
        authModalTitle.textContent = isRegisterMode ? 'Регистрация' : 'Вход';
        authSubmitBtn.textContent = isRegisterMode ? 'Зарегистрироваться' : 'Войти';
        toggleAuthModeBtn.textContent = isRegisterMode ? 'Уже есть аккаунт? Войти' : 'Нет аккаунта? Зарегистрироваться';
    });

    authSubmitBtn.addEventListener('click', async () => {
        const email = authEmailInput.value;
        const password = authPasswordInput.value;

        if (!email || !password) {
            alert("Пожалуйста, введите email и пароль.");
            return;
        }

        authLoader.classList.remove('hidden');
        authSubmitBtn.disabled = true;

        try {
            if (isRegisterMode) {
                await auth.createUserWithEmailAndPassword(email, password);
                alert("Регистрация успешна! Вы вошли в аккаунт.");
            } else {
                await auth.signInWithEmailAndPassword(email, password);
                alert("Вход выполнен успешно!");
            }
            authModal.classList.remove('open');
            authEmailInput.value = '';
            authPasswordInput.value = '';
        } catch (error) {
            console.error("Auth error:", error);
            alert("Ошибка авторизации: " + error.message);
        } finally {
            authLoader.classList.add('hidden');
            authSubmitBtn.disabled = false;
        }
    });

    logoutBtn.addEventListener('click', async () => {
        try {
            await auth.signOut();
            alert("Вы вышли из аккаунта.");
            // onAuthStateChanged will handle UI updates
        } catch (error) {
            console.error("Logout error:", error);
            alert("Ошибка выхода: " + error.message);
        }
    });

    // Initial setup - will be triggered by onAuthStateChanged
    // updateHeaderUI();
    // initPacks();
    // updateChannelPostReactions();
    // renderFeed();
</script>

</body>
</html>
