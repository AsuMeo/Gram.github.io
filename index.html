<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Tsuyu Messenger</title>

    <!-- Firebase JS SDK v10 Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-main: #000000;
            --bg-secondary: #0a0a0c;
            --bg-card: #141416;
            --bg-card-hover: #1c1c1f;
            --bg-bubble-out: #1e293b;
            --bg-bubble-in: #111113;
            --accent: #10b981;
            --accent-pink: #ec4899;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --border-color: #222226;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-size-base: 15px;
            
            /* Custom text configuration variables */
            --str-typing: "печатает...";
            --str-online: "в сети";
            --str-offline: "был(а) недавно";
            --str-msg-action: "жмякай";
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100dvh;
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: var(--font-family);
            font-size: var(--font-size-base);
            overflow: hidden;
            position: fixed;
        }

        /* SVG Icons */
        .icon {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            display: inline-block;
            vertical-align: middle;
            flex-shrink: 0;
        }

        .icon-sm { width: 18px; height: 18px; }
        .icon-lg { width: 28px; height: 28px; }

        /* App View Screens */
        .app-view {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            background: var(--bg-main);
            z-index: 1;
            transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.2s ease;
        }

        .app-view.hidden {
            display: none !important;
        }

        .app-view.slide-in {
            transform: translateX(100%);
        }

        /* Header Navigation */
        .header {
            height: calc(56px + env(safe-area-inset-top));
            padding-top: env(safe-area-inset-top);
            background-color: rgba(10, 10, 12, 0.95);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-left: 12px;
            padding-right: 12px;
            border-bottom: 1px solid var(--border-color);
            z-index: 20;
            flex-shrink: 0;
        }

        .header-title {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
        }

        .header-btn {
            background: none;
            border: none;
            color: var(--text-main);
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .header-btn:active {
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* Auth Screen */
        .auth-container {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            padding: 24px;
            justify-content: center;
            background: #000;
            overflow-y: auto;
        }

        .auth-brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-brand h1 {
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 1px;
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .auth-brand p {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 6px;
        }

        .input-group {
            margin-bottom: 12px;
            position: relative;
        }

        .input-control {
            width: 100%;
            padding: 14px 16px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-control:focus {
            border-color: var(--accent);
        }

        .btn-primary {
            width: 100%;
            padding: 15px;
            background-color: var(--accent);
            color: #000;
            font-weight: 700;
            font-size: 16px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary:active {
            opacity: 0.85;
        }

        .avatar-picker-preview {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 2px dashed var(--border-color);
            margin: 0 auto 16px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            background-size: cover;
            background-position: center;
        }

        /* Search Bar & Dialogs */
        .search-bar-container {
            padding: 10px 14px;
            background-color: var(--bg-main);
            flex-shrink: 0;
        }

        .search-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-input-wrapper .icon {
            position: absolute;
            left: 12px;
            color: var(--text-muted);
        }

        .search-input {
            width: 100%;
            padding: 10px 12px 10px 38px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            cursor: pointer;
            position: relative;
            transition: background 0.15s;
        }

        .chat-item:active {
            background-color: var(--bg-card-hover);
        }

        .avatar-container {
            position: relative;
            margin-right: 14px;
            flex-shrink: 0;
        }

        .avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
            background-color: var(--bg-card);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #fff;
            font-size: 20px;
            background-size: cover;
            background-position: center;
        }

        .status-dot {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            position: absolute;
            bottom: 1px;
            right: 1px;
            border: 2px solid var(--bg-main);
            background-color: #6b7280;
        }

        .status-dot.online {
            background-color: #10b981;
        }

        .chat-info {
            flex: 1;
            min-width: 0;
        }

        .chat-header-line {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 4px;
        }

        .chat-name {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-time {
            font-size: 12px;
            color: var(--text-muted);
            margin-left: 6px;
        }

        .chat-last-msg {
            font-size: 14px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .chat-typing-indicator {
            color: var(--accent);
            font-size: 13px;
            font-style: italic;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Active Chat View */
        .chat-header-user {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
            cursor: pointer;
        }

        .chat-header-meta {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .chat-header-name {
            font-size: 16px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-header-status {
            font-size: 12px;
            color: var(--accent);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-header-status.offline {
            color: var(--text-muted);
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            -webkit-overflow-scrolling: touch;
            background-color: #030303;
        }

        .msg-bubble-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 82%;
            position: relative;
        }

        .msg-bubble-wrapper.outgoing {
            align-self: flex-end;
        }

        .msg-bubble-wrapper.incoming {
            align-self: flex-start;
        }

        .msg-bubble {
            padding: 8px 12px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.4;
            position: relative;
            word-break: break-word;
            box-shadow: 0 1px 2px rgba(0,0,0,0.4);
        }

        .msg-bubble.outgoing {
            background-color: var(--bg-bubble-out);
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .msg-bubble.incoming {
            background-color: var(--bg-bubble-in);
            color: #efefef;
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .msg-meta {
            display: inline-flex;
            align-items: center;
            float: right;
            margin-left: 10px;
            margin-top: 4px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.6);
            gap: 4px;
        }

        /* Reply Banner inside bubble */
        .msg-reply-quote {
            border-left: 3px solid var(--accent);
            background: rgba(255,255,255,0.06);
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 6px;
            font-size: 12px;
            color: #ccc;
        }

        /* Reactions */
        .msg-reactions {
            position: absolute;
            bottom: -10px;
            right: 8px;
            display: flex;
            align-items: center;
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 12px;
            padding: 2px 6px;
            gap: 3px;
            z-index: 5;
            box-shadow: 0 2px 6px rgba(0,0,0,0.6);
        }

        .reaction-heart {
            color: var(--accent-pink);
            font-size: 13px;
            display: flex;
            align-items: center;
        }

        .reaction-avatars {
            display: flex;
            align-items: center;
            margin-left: 2px;
        }

        .reaction-avatar {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            border: 1px solid #000;
            margin-left: -4px;
            object-fit: cover;
            background-color: #333;
        }

        /* Collages Grid */
        .media-collage {
            display: grid;
            gap: 2px;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            margin-bottom: 4px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .media-collage.cols-1 { grid-template-columns: 1fr; }
        .media-collage.cols-2 { grid-template-columns: 1fr 1fr; }
        .media-collage.cols-3 { grid-template-columns: 1fr 1fr; grid-template-rows: 120px 120px; }

        .media-collage-item {
            width: 100%;
            height: 180px;
            object-fit: cover;
            cursor: pointer;
            background: #111;
        }

        .media-collage.cols-1 .media-collage-item {
            max-height: 280px;
            height: auto;
        }

        /* Circle Video Player */
        .circle-video-container {
            width: 190px;
            height: 190px;
            border-radius: 50%;
            overflow: hidden;
            position: relative;
            border: 3px solid var(--accent);
            background: #000;
            margin: 4px 0;
            cursor: pointer;
        }

        .circle-video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Voice Note Bar */
        .voice-note-player {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 0;
            min-width: 210px;
        }

        .voice-play-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--accent);
            color: #000;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .voice-waveform {
            flex: 1;
            height: 28px;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .voice-wave-bar {
            flex: 1;
            background: #4b5563;
            border-radius: 2px;
            transition: height 0.1s ease;
        }

        /* Music Player */
        .audio-music-player {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,0.25);
            padding: 8px 12px;
            border-radius: 12px;
            min-width: 220px;
        }

        .audio-progress-straight {
            flex: 1;
            height: 4px;
            background: #374151;
            border-radius: 2px;
            position: relative;
            overflow: hidden;
        }

        .audio-progress-bar-inner {
            height: 100%;
            background: var(--accent);
            width: 0%;
        }

        /* Input Bar */
        .chat-input-bar {
            padding: 8px 10px calc(8px + env(safe-area-inset-bottom)) 10px;
            background-color: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: flex-end;
            gap: 8px;
            z-index: 10;
            flex-shrink: 0;
        }

        .chat-input-wrapper {
            flex: 1;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            display: flex;
            align-items: flex-end;
            padding: 6px 12px;
            min-height: 42px;
            max-height: 120px;
        }

        .chat-textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            resize: none;
            max-height: 100px;
            line-height: 1.4;
            padding: 4px 0;
        }

        .input-action-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 6px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .input-action-btn:active {
            color: var(--accent);
        }

        .send-btn-main {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background-color: var(--accent);
            color: #000;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .input-reply-preview {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-card);
            padding: 8px 12px;
            border-top: 1px solid var(--border-color);
            font-size: 13px;
        }

        /* Bottom Sheet Modal */
        .bottom-sheet-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(6px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .bottom-sheet-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .bottom-sheet-content {
            background: #111113;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px;
            border-top: 1px solid var(--border-color);
            transform: translateY(100%);
            transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .bottom-sheet-overlay.active .bottom-sheet-content {
            transform: translateY(0);
        }

        .attach-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            padding: 10px 0;
        }

        .attach-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .attach-icon-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
        }

        /* Message Popup Context Menu */
        .msg-context-menu {
            position: fixed;
            background: #18181c;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 8px;
            z-index: 120;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            width: 210px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .msg-context-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            font-size: 14px;
            color: #fff;
            border-radius: 10px;
            cursor: pointer;
        }

        .msg-context-item:active {
            background: rgba(255,255,255,0.08);
        }

        .reaction-picker-row {
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 6px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 4px;
        }

        .reaction-pick-btn {
            font-size: 24px;
            background: none;
            border: none;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .reaction-pick-btn:active {
            transform: scale(1.3);
        }

        /* Media Lightbox Viewer */
        .lightbox-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            display: none;
        }

        .lightbox-modal.active {
            display: flex;
        }

        .lightbox-content {
            max-width: 100%;
            max-height: 85dvh;
            object-fit: contain;
        }

        .lightbox-close {
            position: absolute;
            top: calc(16px + env(safe-area-inset-top));
            right: 16px;
            color: #fff;
            background: rgba(255,255,255,0.1);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* Settings View Styles */
        .settings-section {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .settings-title {
            font-size: 13px;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .settings-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            cursor: pointer;
        }

        .settings-item label {
            font-size: 15px;
            color: #fff;
        }

        .settings-select {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 8px 12px;
            border-radius: 10px;
            outline: none;
        }

        /* Round Recorder Modal */
        .recorder-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.92);
            z-index: 150;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            display: none;
        }

        .recorder-overlay.active {
            display: flex;
        }

        .circle-preview-box {
            width: 260px;
            height: 260px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid var(--accent);
            background: #000;
            position: relative;
        }

        .circle-preview-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .recorder-controls {
            margin-top: 30px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .rec-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .rec-btn.stop { background: #ef4444; color: #fff; }
        .rec-btn.cancel { background: #374151; color: #fff; }

        .custom-checkbox {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            margin-bottom: 8px;
            cursor: pointer;
        }

        .custom-checkbox input {
            accent-color: var(--accent);
            width: 18px;
            height: 18px;
        }
    </style>
</head>
<body>

    <!-- AUTH SCREEN -->
    <div id="screen-auth" class="app-view">
        <div class="auth-container">
            <div class="auth-brand">
                <h1>
                    <svg class="icon icon-lg" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                    Tsuyu
                </h1>
                <p>E2EE Android Realtime Messenger 2026</p>
            </div>

    <script>
        // 1. FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyBm0mIvHVznIeF2PoFk6dtdaiT5r877wyA",
            authDomain: "meow-874ce.firebaseapp.com",
            databaseURL: "https://meow-874ce-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "meow-874ce",
            storageBucket: "meow-874ce.firebasestorage.app",
            messagingSenderId: "471541334599",
            appId: "1:471541334599:web:567af3e7dbe70a37572762"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const rtdb = firebase.database();

        // 2. STATE VARIABLES
        let currentUser = null;
        let currentUserProfile = null;
        let activeChatPartner = null;
        let isRegistering = false;
        let userCryptoKeyPair = null;
        let activeMessagesListener = null;
        let activePartnerStatusListener = null;
        let typingTimeout = null;
        let replyTargetMsg = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let isCircleRecording = false;

        let customConfig = {
            typing: "мяукает...",
            online: "мяукает сейчас",
            offline: "мяукала недавно"
        };

        // 3. INDEXEDDB LOCAL STORAGE
        const DB_NAME = "TsuyuLocalDB";
        let dbInstance = null;

        function initIDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains("keys")) db.createObjectStore("keys");
                    if (!db.objectStoreNames.contains("chats")) db.createObjectStore("chats", { keyPath: "id" });
                };
                req.onsuccess = (e) => { dbInstance = e.target.result; resolve(dbInstance); };
                req.onerror = (e) => reject(e);
            });
        }

        function saveIDBItem(storeName, key, value) {
            return new Promise((resolve) => {
                const tx = dbInstance.transaction(storeName, "readwrite");
                const store = tx.objectStore(storeName);
                store.put(value, key);
                tx.oncomplete = () => resolve(true);
            });
        }

        function getIDBItem(storeName, key) {
            return new Promise((resolve) => {
                const tx = dbInstance.transaction(storeName, "readonly");
                const store = tx.objectStore(storeName);
                const req = store.get(key);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => resolve(null);
            });
        }

        // 4. WEBCRYPTO E2EE ENGINE (2026 ECDH P-256 + AES-GCM)
        async function generateE2EEKeyPair() {
            const keyPair = await window.crypto.subtle.generateKey(
                { name: "ECDH", namedCurve: "P-256" },
                true,
                ["deriveKey", "deriveBits"]
            );
            const exportedPub = await window.crypto.subtle.exportKey("jwk", keyPair.publicKey);
            const exportedPriv = await window.crypto.subtle.exportKey("jwk", keyPair.privateKey);
            return { keyPair, exportedPub, exportedPriv };
        }

        async function deriveSymmetricAESKey(myPrivJwk, partnerPubJwk) {
            // Clean & sanitize JWK for WebCrypto import
            const cleanPrivJwk = {
                kty: "EC",
                crv: "P-256",
                x: myPrivJwk.x,
                y: myPrivJwk.y,
                d: myPrivJwk.d,
                ext: true
            };
            const cleanPubJwk = {
                kty: "EC",
                crv: "P-256",
                x: partnerPubJwk.x,
                y: partnerPubJwk.y,
                ext: true
            };

            const privKey = await window.crypto.subtle.importKey(
                "jwk", cleanPrivJwk,
                { name: "ECDH", namedCurve: "P-256" },
                false, ["deriveKey"]
            );
            const pubKey = await window.crypto.subtle.importKey(
                "jwk", cleanPubJwk,
                { name: "ECDH", namedCurve: "P-256" },
                false, []
            );
            return await window.crypto.subtle.deriveKey(
                { name: "ECDH", public: pubKey },
                privKey,
                { name: "AES-GCM", length: 256 },
                false,
                ["encrypt", "decrypt"]
            );
        }

        async function encryptPayload(dataObj, aesKey) {
            const iv = window.crypto.getRandomValues(new Uint8Array(12));
            const encoded = new TextEncoder().encode(JSON.stringify(dataObj));
            const cipherBuffer = await window.crypto.subtle.encrypt(
                { name: "AES-GCM", iv: iv },
                aesKey,
                encoded
            );
            return {
                ciphertext: Array.from(new Uint8Array(cipherBuffer)).map(b => String.fromCharCode(b)).join(''),
                iv: Array.from(iv)
            };
        }

        async function decryptPayload(cipherData, aesKey) {
            try {
                const iv = new Uint8Array(cipherData.iv);
                const cipherBytes = new Uint8Array(cipherData.ciphertext.split('').map(c => c.charCodeAt(0)));
                const decryptedBuffer = await window.crypto.subtle.decrypt(
                    { name: "AES-GCM", iv: iv },
                    aesKey,
                    cipherBytes
                );
                return JSON.parse(new TextDecoder().decode(decryptedBuffer));
            } catch (err) {
                return { text: "[Не удалось расшифровать сообщение]" };
            }
        }

        // 5. APPLICATION INITIALIZATION
        window.addEventListener("DOMContentLoaded", async () => {
            await initIDB();

            auth.onAuthStateChanged(async (user) => {
                if (user) {
                    currentUser = user;
                    await loadOrCreateUserKeyPair();
                    setupUserPresence();
                    await loadUserProfile();
                    showScreen("screen-chats");
                    listenToDialogs();
                } else {
                    currentUser = null;
                    showScreen("screen-auth");
                }
            });
        });

        async function loadOrCreateUserKeyPair() {
            let savedKeys = await getIDBItem("keys", currentUser.uid);
            if (!savedKeys || !savedKeys.priv || !savedKeys.pub) {
                const keyData = await generateE2EEKeyPair();
                savedKeys = { pub: keyData.exportedPub, priv: keyData.exportedPriv };
                await saveIDBItem("keys", currentUser.uid, savedKeys);
            }
            userCryptoKeyPair = savedKeys;
            await rtdb.ref(`users/${currentUser.uid}/publicKey`).set(savedKeys.pub);
        }

        function toggleAuthMode(e) {
            e.preventDefault();
            isRegistering = !isRegistering;
            document.getElementById("reg-avatar-group").style.display = isRegistering ? "block" : "none";
            document.getElementById("reg-name-group").style.display = isRegistering ? "block" : "none";
            document.getElementById("reg-username-group").style.display = isRegistering ? "block" : "none";
            document.getElementById("reg-bio-group").style.display = isRegistering ? "block" : "none";
            document.getElementById("auth-submit-btn").innerText = isRegistering ? "Зарегистрироваться" : "Войти";
            document.getElementById("auth-toggle-link").innerText = isRegistering ? "Уже есть аккаунт? Войти" : "Нет аккаунта? Зарегистрироваться";
        }

        let regAvatarBase64 = "";
        function handleAvatarSelect(evt) {
            const file = evt.target.files[0];
            if (!file) return;
            compressImage(file, 400, 0.75).then(base64 => {
                regAvatarBase64 = base64;
                document.getElementById("avatar-preview-box").style.backgroundImage = `url(${regAvatarBase64})`;
                document.getElementById("avatar-preview-box").innerHTML = "";
            });
        }

        async function submitAuth() {
            const email = document.getElementById("auth-email").value.trim();
            const password = document.getElementById("auth-password").value.trim();

            if (!email || !password) return alert("Заполните email и пароль!");

            if (isRegistering) {
                const name = document.getElementById("auth-display-name").value.trim();
                let username = document.getElementById("auth-username").value.trim().toLowerCase().replace('@','');
                const bio = document.getElementById("auth-bio").value.trim();

                if (!name || !username) return alert("Заполните имя и юзернейм!");

                const uSnap = await rtdb.ref(`usernames/${username}`).once("value");
                if (uSnap.exists()) return alert("Этот юзернейм уже занят!");

                try {
                    const res = await auth.createUserWithEmailAndPassword(email, password);
                    const uid = res.user.uid;

                    await rtdb.ref(`usernames/${username}`).set(uid);

                    const keyData = await generateE2EEKeyPair();
                    const profileData = {
                        uid: uid,
                        displayName: name,
                        username: username,
                        bio: bio || "Привет, я использую Tsuyu!",
                        avatar: regAvatarBase64 || "",
                        publicKey: keyData.exportedPub,
                        privacy: { write: "all", lastSeen: "all", avatar: "all" }
                    };

                    await rtdb.ref(`users/${uid}`).set(profileData);
                    await saveIDBItem("keys", uid, { pub: keyData.exportedPub, priv: keyData.exportedPriv });
                } catch (err) {
                    alert("Ошибка регистрации: " + err.message);
                }
            } else {
                try {
                    await auth.signInWithEmailAndPassword(email, password);
                } catch (err) {
                    alert("Ошибка входа: " + err.message);
                }
            }
        }

        // 6. REALTIME SEARCH BY USERNAME
        async function handleSearchInput(val) {

            if (!query) {
                resBox.style.display = "none";

        // 7. DIALOGS LIST
        function listenToDialogs() {
            const dialogsRef = rtdb.ref(`dialogs/${currentUser.uid}`);
            dialogsRef.on('value', async (snap) => {
                const container = document.getElementById("chat-list-container");
                container.innerHTML = "";
                if (!snap.exists()) {
                    container.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-muted);">У вас пока нет активных чатов.<br>Используйте поиск для начала общения.</div>`;
                    return;
                }

                const dialogs = snap.val();
                for (let partnerUid in dialogs) {
                    const dialogData = dialogs[partnerUid];
                    const pSnap = await rtdb.ref(`users/${partnerUid}`).once("value");
                    const partner = pSnap.val();
                    if (!partner) continue;

                    let lastText = "Сообщение";
                    if (dialogData.lastMsg) {
                        try {
                            const partnerPubKey = dialogData.lastMsgSenderPubKey || partner.publicKey;
                            const symKey = await deriveSymmetricAESKey(userCryptoKeyPair.priv, partnerPubKey);
                            const dec = await decryptPayload(dialogData.lastMsg, symKey);
                            if (dec.photos && dec.photos.length) lastText = "📷 Фотография";
                            else if (dec.circle) lastText = "⭕ Кружочек";
                            else if (dec.voice) lastText = "🎙 Голосовое сообщение";
                            else if (dec.audio) lastText = "🎵 Аудиозапись";
                            else lastText = dec.text || "Сообщение";
                        } catch (e) {
                            lastText = "Зашифрованное сообщение";
                        }
                    }

                    const item = document.createElement("div");
                    item.className = "chat-item";
                    item.onclick = () => openChatWithUser(partner);

                    item.innerHTML = `
                        <div class="avatar-container">
                            <div class="avatar" id="dialog-avatar-${partnerUid}" style="${partner.avatar ? `background-image:url(${partner.avatar});` : ''}">${partner.avatar ? '' : partner.displayName[0]}</div>

                    rtdb.ref(`presence/${partnerUid}`).on('value', (pStateSnap) => {
                        const st = pStateSnap.val();
                        const dot = document.getElementById(`dialog-status-${partnerUid}`);

        async function openChatWithUser(partner) {
            activeChatPartner = partner;

            // Fetch partner public key from RTDB
            let pkSnap = await rtdb.ref(`users/${partner.uid}/publicKey`).once("value");
            if (pkSnap.exists()) {
                activeChatPartner.publicKey = pkSnap.val();
            } else if (!activeChatPartner.publicKey) {
                // Generate fallback key if partner doesn't have one
                const dummyPair = await generateE2EEKeyPair();
                activeChatPartner.publicKey = dummyPair.exportedPub;
            }

            document.getElementById("active-chat-name").innerText = partner.displayName;
            const avEl = document.getElementById("active-chat-avatar");
            if (partner.avatar) {
                avEl.style.backgroundImage = `url(${partner.avatar})`;
                avEl.innerText = "";
            } else {
                avEl.innerText = partner.displayName[0];
            }

            showScreen("screen-active-chat");
            listenToActiveChatMessages();
            listenToPartnerPresence();
        }

        function closeActiveChat() {
            if (activeMessagesListener) activeMessagesListener.off();
            if (activePartnerStatusListener) activePartnerStatusListener.off();
            activeChatPartner = null;
            document.getElementById("screen-active-chat").classList.add("slide-in");
            setTimeout(() => { showScreen("screen-chats"); }, 200);
        }

        function listenToPartnerPresence() {
            if (!activeChatPartner) return;
            activePartnerStatusListener = rtdb.ref(`presence/${activeChatPartner.uid}`);
            activePartnerStatusListener.on('value', (snap) => {
                const st = snap.val();
                const dot = document.getElementById("active-chat-status-dot");
                const txt = document.getElementById("active-chat-status");

                if (st && st.online) {
                    dot.classList.add("online");
                    txt.innerText = customConfig.online;
                    txt.classList.remove("offline");
                } else {
                    dot.classList.remove("online");
                    txt.innerText = st ? `была в сети ${formatTime(st.lastSeen)}` : customConfig.offline;
                    txt.classList.add("offline");
                }
            });

            rtdb.ref(`typing/${currentUser.uid}/${activeChatPartner.uid}`).on('value', (snap) => {
                const isTyping = snap.val();
                const txt = document.getElementById("active-chat-status");
                if (isTyping) txt.innerText = customConfig.typing;

        async function listenToActiveChatMessages() {
            const chatId = getChatRoomId(currentUser.uid, activeChatPartner.uid);
            const msgsRef = rtdb.ref(`messages/${chatId}`);

            if (activeMessagesListener) activeMessagesListener.off();

            activeMessagesListener = msgsRef.on('value', async (snap) => {
                const container = document.getElementById("messages-container");
                container.innerHTML = "";

                if (!snap.exists()) return;

                const msgsObj = snap.val();
                for (let msgId in msgsObj) {
                    const rawMsg = msgsObj[msgId];
                    try {
                        const senderPubKey = rawMsg.senderPublicKey || activeChatPartner.publicKey;
                        const symKey = await deriveSymmetricAESKey(userCryptoKeyPair.priv, senderPubKey);
                        const decrypted = await decryptPayload(rawMsg.encryptedPayload, symKey);
                        renderMessageBubble(msgId, decrypted, rawMsg.senderUid, rawMsg.reactions || {});
                    } catch (e) {
                        renderMessageBubble(msgId, { text: "[Ошибка расшифровки]" }, rawMsg.senderUid, {});
                    }
                }

                container.scrollTop = container.scrollHeight;
            });
        }

        function getChatRoomId(uid1, uid2) {
            return uid1 < uid2 ? `${uid1}_${uid2}` : `${uid2}_${uid1}`;
        }

        // 8. RENDER MESSAGE BUBBLE
        function renderMessageBubble(msgId, payload, senderUid, reactions) {
            const container = document.getElementById("messages-container");
            const isOutgoing = senderUid === currentUser.uid;

            const wrapper = document.createElement("div");
            wrapper.className = `msg-bubble-wrapper ${isOutgoing ? 'outgoing' : 'incoming'}`;
            wrapper.id = `msg-wrap-${msgId}`;

            let contentHtml = "";

            if (payload.replyQuote) {
                contentHtml += `<div class="msg-reply-quote"><b>${escapeHtml(payload.replyQuote.senderName)}:</b> ${escapeHtml(payload.replyQuote.text)}</div>`;
            }

            if (payload.photos && payload.photos.length > 0) {
                const colsClass = payload.photos.length === 1 ? 'cols-1' : (payload.photos.length === 2 ? 'cols-2' : 'cols-3');
                contentHtml += `<div class="media-collage ${colsClass}">`;
                payload.photos.forEach(imgBase64 => {
                    contentHtml += `<img src="${imgBase64}" class="media-collage-item" onclick="openLightboxImage('${imgBase64}')">`;
                });
                contentHtml += `</div>`;
            }

            if (payload.circle) {
                contentHtml += `
                    <div class="circle-video-container" onclick="togglePlayVideo(this)">
                        <video src="${payload.circle}" loop playsinline></video>
                    </div>
                `;
            }

            if (payload.voice) {
                contentHtml += `
                    <div class="voice-note-player">
                        <button class="voice-play-btn" onclick="playVoiceAudio(this, '${payload.voice}')">
                            <svg class="icon icon-sm" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                        </button>
                        <div class="voice-waveform">
                            ${[40,70,30,90,60,100,50,80,40,90,70,50,30,60,90,40].map(h => `<div class="voice-wave-bar" style="height:${h}%;"></div>`).join('')}
                        </div>
                    </div>
                `;
            }

            if (payload.audio) {
                contentHtml += `
                    <div class="audio-music-player">
                        <button class="voice-play-btn" onclick="playMusicAudio(this, '${payload.audio}')">
                            <svg class="icon icon-sm" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                        </button>
                        <div style="flex:1;">
                            <div style="font-size:12px; font-weight:600; margin-bottom:4px;">${escapeHtml(payload.audioName || "Аудиозапись")}</div>
                            <div class="audio-progress-straight"><div class="audio-progress-bar-inner"></div></div>
                        </div>
                    </div>
                `;
            }

            if (payload.text) {
                contentHtml += `<div>${escapeHtml(payload.text)}</div>`;
            }

            contentHtml += `
                <div class="msg-meta">
                    <span>${formatTime(payload.timestamp)}</span>
                    ${isOutgoing ? `<svg class="icon icon-sm" viewBox="0 0 24 24" style="color:var(--accent);"><polyline points="20 6 9 17 4 12"/><polyline points="20 12 13 19"/></svg>` : ''}
                </div>
            `;

            const bubble = document.createElement("div");
            bubble.className = `msg-bubble ${isOutgoing ? 'outgoing' : 'incoming'}`;
            bubble.innerHTML = contentHtml;

            let lastTap = 0;
            bubble.addEventListener("touchend", (e) => {
                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTap;
                if (tapLength < 300 && tapLength > 0) {
                    toggleHeartReaction(msgId);
                    e.preventDefault();
                }
                lastTap = currentTime;
            });

            bubble.oncontextmenu = (e) => {
                e.preventDefault();
                showMsgContextMenu(e, msgId, payload, isOutgoing);
            };

            wrapper.appendChild(bubble);

            if (reactions && Object.keys(reactions).length > 0) {
                const reactDiv = document.createElement("div");
                reactDiv.className = "msg-reactions";

                let avsHtml = "";
                for (let rUid in reactions) {
                    const av = rUid === currentUser.uid ? currentUserProfile.avatar : activeChatPartner.avatar;
                    if (av) avsHtml += `<img class="reaction-avatar" src="${av}">`;
                }

                reactDiv.innerHTML = `
                    <div class="reaction-heart">❤️</div>
                    <div class="reaction-avatars">${avsHtml}</div>
                `;
                wrapper.appendChild(reactDiv);
            }

            container.appendChild(wrapper);
        }

        // 9. SEND MESSAGE ACTION & COMPRESSION
        let pendingMediaFiles = [];

        async function sendMessageAction() {
            try {
                const txtArea = document.getElementById("chat-textarea");
                const text = txtArea.value.trim();

                if (!text && pendingMediaFiles.length === 0) return;

                if (!activeChatPartner || !activeChatPartner.publicKey) {
                    throw new Error("Не удалось загрузить ключ собеседника. Попробуйте еще раз.");
                }

                const chatId = getChatRoomId(currentUser.uid, activeChatPartner.uid);
                const symKey = await deriveSymmetricAESKey(userCryptoKeyPair.priv, activeChatPartner.publicKey);

                const payloadObj = {
                    text: text,
                    photos: pendingMediaFiles,
                    timestamp: Date.now(),
                    senderUid: currentUser.uid,
                    replyQuote: replyTargetMsg
                };

                const encrypted = await encryptPayload(payloadObj, symKey);

                const msgRef = rtdb.ref(`messages/${chatId}`).push();
                await msgRef.set({
                    senderUid: currentUser.uid,
                    senderPublicKey: userCryptoKeyPair.pub,
                    encryptedPayload: encrypted
                });

                const dialogData = {
                    lastMsg: encrypted,
                    lastMsgSenderPubKey: userCryptoKeyPair.pub,
                    timestamp: Date.now()
                };
                await rtdb.ref(`dialogs/${currentUser.uid}/${activeChatPartner.uid}`).set(dialogData);
                await rtdb.ref(`dialogs/${activeChatPartner.uid}/${currentUser.uid}`).set(dialogData);

                txtArea.value = "";
                txtArea.style.height = "auto";
                pendingMediaFiles = [];
                cancelReply();
            } catch (err) {
                alert("Ошибка отправки: " + err.message);
            }
        }

        // Image compression helper
        function compressImage(file, maxDim = 1024, quality = 0.7) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let w = img.width;
                        let h = img.height;
                        if (w > maxDim || h > maxDim) {
                            if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
                            else { w = Math.round((w * maxDim) / h); h = maxDim; }
                        }
                        const canvas = document.createElement("canvas");
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext("2d");
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL("image/jpeg", quality));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        // Reactions
        async function toggleHeartReaction(msgId) {
            const chatId = getChatRoomId(currentUser.uid, activeChatPartner.uid);
            const reactRef = rtdb.ref(`messages/${chatId}/${msgId}/reactions/${currentUser.uid}`);
            const snap = await reactRef.once("value");
            if (snap.exists()) {
                await reactRef.remove();
            } else {
                await reactRef.set({ heart: true, timestamp: Date.now() });
            }
        }

        async function deleteMessageAction(msgId) {
            if (confirm("Удалить сообщение у обоих участников?")) {
                const chatId = getChatRoomId(currentUser.uid, activeChatPartner.uid);
                await rtdb.ref(`messages/${chatId}/${msgId}`).remove();
            }
        }

        async function editMessagePrompt(msgId, oldText) {
            const newText = prompt("Редактировать сообщение:", oldText);
            if (newText !== null && newText.trim() !== "") {
                const chatId = getChatRoomId(currentUser.uid, activeChatPartner.uid);
                const symKey = await deriveSymmetricAESKey(userCryptoKeyPair.priv, activeChatPartner.publicKey);

                const snap = await rtdb.ref(`messages/${chatId}/${msgId}`).once("value");
                if (snap.exists()) {
                    const raw = snap.val();
                    const dec = await decryptPayload(raw.encryptedPayload, symKey);
                    dec.text = newText.trim();
                    dec.edited = true;

                    const newEncrypted = await encryptPayload(dec, symKey);
                    await rtdb.ref(`messages/${chatId}/${msgId}/encryptedPayload`).set(newEncrypted);
                }
            }
        }

        function initReplyMessage(msgId, text) {
            replyTargetMsg = { msgId, senderName: activeChatPartner.displayName, text };
            document.getElementById("reply-banner-text").innerText = text;
            document.getElementById("reply-banner").style.display = "flex";
        }

        function cancelReply() {
            replyTargetMsg = null;
            document.getElementById("reply-banner").style.display = "none";
        }

        function openAttachSheet() {

        }

        function closeAttachSheet(e) {
            document.getElementById("attach-sheet").classList.remove("active");
        }

        function triggerFileInput(type) {
            closeAttachSheet();
            if (type === 'gallery') document.getElementById("attach-file-input").click();
            if (type === 'audio') document.getElementById("attach-audio-input").click();
        }

        async function handleMediaSelect(e) {
            const files = Array.from(e.target.files);
            if (!files.length) return;

            for (let file of files) {
                if (file.type.startsWith("image/")) {
                    const compressedBase64 = await compressImage(file, 1024, 0.7);
                    pendingMediaFiles.push(compressedBase64);
                }
            }
            sendMessageAction();
        }

        function handleAudioSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async (evt) => {
                try {
                    const base64Audio = evt.target.result;
                    const chatId = getChatRoomId(currentUser.uid, activeChatPartner.uid);
                    const symKey = await deriveSymmetricAESKey(userCryptoKeyPair.priv, activeChatPartner.publicKey);

                    const payload = {
                        audio: base64Audio,
                        audioName: file.name,
                        timestamp: Date.now(),
                        senderUid: currentUser.uid
                    };

                    const encrypted = await encryptPayload(payload, symKey);
                    await rtdb.ref(`messages/${chatId}`).push({
                        senderUid: currentUser.uid,
                        senderPublicKey: userCryptoKeyPair.pub,
                        encryptedPayload: encrypted
                    });
                } catch (err) {
                    alert("Ошибка отправки аудио: " + err.message);
                }
            };
            reader.readAsDataURL(file);
        }

        // 11. RECORDERS
        async function startVoiceRecord() {
            closeAttachSheet();
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                voiceRecorder = new MediaRecorder(stream);
                voiceChunks = [];
                voiceRecorder.ondataavailable = e => voiceChunks.push(e.data);
                voiceRecorder.onstop = async () => {
                    const blob = new Blob(voiceChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        const base64Voice = e.target.result;
                        const chatId = getChatRoomId(currentUser.uid, activeChatPartner.uid);
                        const symKey = await deriveSymmetricAESKey(userCryptoKeyPair.priv, activeChatPartner.publicKey);
                        const encrypted = await encryptPayload({ voice: base64Voice, timestamp: Date.now(), senderUid: currentUser.uid }, symKey);
                        await rtdb.ref(`messages/${chatId}`).push({
                            senderUid: currentUser.uid,
                            senderPublicKey: userCryptoKeyPair.pub,
                            encryptedPayload: encrypted
                        });
                    };
                    reader.readAsDataURL(blob);
                };
                voiceRecorder.start();
                alert("Запись голосового сообщения началась... Нажмите OK для отправки.");
                voiceRecorder.stop();
            } catch (err) {
                alert("Нет доступа к микрофону");
            }
        }

        let circleStream = null;
        async function openCircleRecorder() {
            closeAttachSheet();
            const modal = document.getElementById("circle-recorder-modal");
            modal.classList.add("active");
            try {
                circleStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 300, height: 300 }, audio: true });
                document.getElementById("circle-preview-video").srcObject = circleStream;
            } catch (err) {
                alert("Ошибка доступа к камере!");
                closeCircleRecorder();
            }
        }

        function closeCircleRecorder() {
            if (circleStream) circleStream.getTracks().forEach(t => t.stop());
            document.getElementById("circle-recorder-modal").classList.remove("active");
            isCircleRecording = false;
        }

        async function toggleCircleRecording() {
            if (!isCircleRecording) {
                isCircleRecording = true;
                recordedChunks = [];
                mediaRecorder = new MediaRecorder(circleStream, { mimeType: 'video/webm' });
                mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        const base64Circle = e.target.result;
                        const chatId = getChatRoomId(currentUser.uid, activeChatPartner.uid);
                        const symKey = await deriveSymmetricAESKey(userCryptoKeyPair.priv, activeChatPartner.publicKey);
                        const encrypted = await encryptPayload({ circle: base64Circle, timestamp: Date.now(), senderUid: currentUser.uid }, symKey);
                        await rtdb.ref(`messages/${chatId}`).push({
                            senderUid: currentUser.uid,
                            senderPublicKey: userCryptoKeyPair.pub,
                            encryptedPayload: encrypted
                        });
                        closeCircleRecorder();
                    };
                    reader.readAsDataURL(blob);
                };
                mediaRecorder.start();
                document.getElementById("circle-rec-action-btn").style.background = "#22c55e";
            } else {
                mediaRecorder.stop();
            }
        }

        // 12. MEDIA PLAYERS & LIGHTBOX
        function openLightboxImage(src) {
            const modal = document.getElementById("lightbox-modal");
            const img = document.getElementById("lightbox-img");
            const vid = document.getElementById("lightbox-video");
            vid.style.display = "none";
            img.style.display = "block";
            img.src = src;
            modal.classList.add("active");
        }

        function closeLightbox() {
            document.getElementById("lightbox-modal").classList.remove("active");
        }

        function togglePlayVideo(container) {
            const vid = container.querySelector("video");
            if (vid.paused) vid.play();
            else vid.pause();
        }

        function playVoiceAudio(btn, src) {
            const audio = new Audio(src);
            audio.play();
            btn.style.background = "#ec4899";
            audio.onended = () => { btn.style.background = "var(--accent)"; };
        }

        function playMusicAudio(btn, src) {
            const audio = new Audio(src);
            audio.play();
            btn.style.background = "#ec4899";
            audio.onended = () => { btn.style.background = "var(--accent)"; };
        }

        // 13. SETTINGS & ROTATION
        function openSettings() {
            showScreen("screen-settings");
        }

        function closeSettings() {
            document.getElementById("screen-settings").classList.add("slide-in");
            setTimeout(() => { showScreen("screen-chats"); }, 200);
        }

        async function rotatePrivateKey() {
            if (confirm("Вы уверены? Новый приватный ключ заменит текущий, и публичный ключ обновится.")) {
                const newKeys = await generateE2EEKeyPair();
                userCryptoKeyPair = { pub: newKeys.exportedPub, priv: newKeys.exportedPriv };
                await saveIDBItem("keys", currentUser.uid, userCryptoKeyPair);
                await rtdb.ref(`users/${currentUser.uid}/publicKey`).set(userCryptoKeyPair.pub);
                alert("Ключ успешно обновлен!");
            }
        }

        function exportKeyBundle() {
            const jsonStr = JSON.stringify(userCryptoKeyPair, null, 2);
            const blob = new Blob([jsonStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `tsuyu-keys-${currentUser.uid}.json`;
            a.click();
        }

        function openChatMenu() {
            document.getElementById("export-chat-modal").classList.add("active");
        }

        function closeExportModal(e) {
            document.getElementById("export-chat-modal").classList.remove("active");
        }

        async function executeExportChat() {
            if (!activeChatPartner) return;
            const chatId = getChatRoomId(currentUser.uid, activeChatPartner.uid);
            const snap = await rtdb.ref(`messages/${chatId}`).once("value");

            if (!snap.exists()) return alert("Переписка пуста");

            const incText = document.getElementById("exp-text").checked;
            const incPhotos = document.getElementById("exp-photos").checked;
            const incVoice = document.getElementById("exp-voice").checked;

            const symKey = await deriveSymmetricAESKey(userCryptoKeyPair.priv, activeChatPartner.publicKey);
            const msgsObj = snap.val();

            let exportHtml = `<html><head><meta charset="utf-8"><title>Экспорт чата Tsuyu</title></head><body style="background:#111; color:#fff; font-family:sans-serif; padding:20px;"><h2>Чат с ${escapeHtml(activeChatPartner.displayName)}</h2><hr>`;

            for (let id in msgsObj) {
                const dec = await decryptPayload(msgsObj[id].encryptedPayload, symKey);
                const sender = msgsObj[id].senderUid === currentUser.uid ? "Вы" : activeChatPartner.displayName;
                exportHtml += `<div style="margin-bottom:12px; padding:8px; background:#222; border-radius:8px;"><b>${escapeHtml(sender)}:</b> `;
                if (incText && dec.text) exportHtml += `<span>${escapeHtml(dec.text)}</span>`;
                if (incPhotos && dec.photos) dec.photos.forEach(p => exportHtml += `<br><img src="${p}" style="max-width:200px;">`);
                if (incVoice && dec.voice) exportHtml += `<br>[Голосовое сообщение]`;
                exportHtml += `<br><small style="color:#888;">${formatTime(dec.timestamp)}</small></div>`;
            }

            exportHtml += `</body></html>`;

            const blob = new Blob([exportHtml], { type: "text/html" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `tsuyu-chat-${activeChatPartner.username}.html`;
            a.click();
            closeExportModal();
        }

        function updateProfileAvatar(evt) {
            const file = evt.target.files[0];
            if (!file) return;
            compressImage(file, 400, 0.75).then(async (base64) => {
                await rtdb.ref(`users/${currentUser.uid}/avatar`).set(base64);
                currentUserProfile.avatar = base64;
                renderProfileInSettings();
            });
        }

        function applyCustomFont(evt) {
            const file = evt.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const font = new FontFace('CustomUserFont', e.target.result);
                font.load().then(loadedFont => {
                    document.fonts.add(loadedFont);
                    document.documentElement.style.setProperty('--font-family', 'CustomUserFont, sans-serif');
                });
            };
            reader.readAsArrayBuffer(file);
        }

        function changeFontSize(size) {
            document.documentElement.style.setProperty('--font-size-base', size);
        }

        function updateCustomTextConfig(key, val) {
            customConfig[key] = val;
        }

        async function updatePrivacy(field, val) {
            await rtdb.ref(`users/${currentUser.uid}/privacy/${field}`).set(val);
        }

        async function logout() {
            await rtdb.ref(`presence/${currentUser.uid}`).set({ online: false, lastSeen: Date.now() });
            await auth.signOut();
            location.reload();
        }

        // 14. ROUTER & UTILS
        function showScreen(screenId) {
            const screens = ["screen-auth", "screen-chats", "screen-active-chat", "screen-settings"];
            screens.forEach(s => {
                const el = document.getElementById(s);
                if (s === screenId) {
                    el.classList.remove("hidden");
                    el.classList.remove("slide-in");
                } else {
                    if (s !== "screen-chats") el.classList.add("hidden");
                }
            });
        }

        function formatTime(ts) {
            if (!ts) return "";
            const d = new Date(ts);
            return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function escapeHtml(str) {
            if (!str) return "";
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }
    </script>
</body>
</html>
