  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
    :root {
      --bg: #000000;
      --surface: #0a0a0a;
      --card: #111111;
      --accent: #ffffff;
      --accent-dim: #888888;
      --accent-muted: #555555;
      --like: #ff2d55;
      --like-glow: rgba(255,45,85,0.3);
      --comment: #34c759;
      --border: rgba(255,255,255,0.08);
      --radius: 16px;
    }
    html, body { background: var(--bg); color: var(--accent); font-family: -apple-system, BlinkMacSystemFont, "SF Pro", "Segoe UI", Roboto, sans-serif; height: 100%; overflow: hidden; }

    /* ===== APP SHELL ===== */
    .app-shell { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

    /* ===== TOP BAR ===== */
    .top-bar {
      height: 52px; background: rgba(0,0,0,0.85); backdrop-filter: blur(20px);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 1rem; letter-spacing: -0.5px; }
    .brand-dot { width: 8px; height: 8px; background: linear-gradient(135deg, #ff2d55, #ff9500); border-radius: 50%; animation: pulse-dot 2s ease infinite; }
    @keyframes pulse-dot { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.3);opacity:0.7} }
    .top-actions { display: flex; align-items: center; gap: 6px; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--card);
      color: var(--accent); display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.15s;
    }
    .icon-btn:active { transform: scale(0.9); background: var(--surface); }
    .icon-btn svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

    /* ===== FEED CONTAINER (Snap Scroll) ===== */
    .feed-container {
      flex: 1; overflow-y: scroll; scroll-snap-type: y mandatory; scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch; padding-top: 52px; padding-bottom: 60px;
    }
    .feed-container::-webkit-scrollbar { display: none; }

    /* ===== VIDEO CARD (Full Screen TikTok Style) ===== */
    .video-card {
      width: 100%; height: 100vh; height: 100dvh; scroll-snap-align: start;
      position: relative; display: flex; align-items: center; justify-content: center;
      background: var(--bg); overflow: hidden;
    }
    .video-card video {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .video-card video.contain { object-fit: contain; background: #000; }

    /* ===== PLAY OVERLAY ===== */
    .play-overlay {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      z-index: 5; pointer-events: none;
    }
    .play-overlay .big-play {
      width: 72px; height: 72px; border-radius: 50%; background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center;
      opacity: 0; transform: scale(0.5); transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1);
    }
    .play-overlay .big-play.show { opacity: 1; transform: scale(1); }
    .play-overlay .big-play svg { width: 28px; height: 28px; fill: #fff; stroke: none; margin-left: 4px; }

    /* ===== RIGHT ACTION BAR ===== */
    .action-bar {
      position: absolute; right: 8px; bottom: 100px; z-index: 10;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
    }
    .action-btn {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      background: none; border: none; color: var(--accent); cursor: pointer;
    }
    .action-btn .act-icon {
      width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,0.08);
      backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center;
      transition: all 0.15s; position: relative;
    }
    .action-btn:active .act-icon { transform: scale(0.9); }
    .action-btn .act-icon svg { width: 24px; height: 24px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .action-btn .act-count { font-size: 0.7rem; font-weight: 600; color: var(--accent); text-shadow: 0 1px 4px rgba(0,0,0,0.8); }

    .action-btn.like .act-icon.liked { background: var(--like); box-shadow: 0 0 20px var(--like-glow); }
    .action-btn.like .act-icon.liked svg { fill: #fff; stroke: none; }

    .action-btn.comment .act-icon { background: rgba(52,199,89,0.15); }
    .action-btn.comment .act-icon svg { stroke: var(--comment); }

    /* Like burst animation */
    .like-burst {
      position: absolute; pointer-events: none; z-index: 20;
    }
    .like-burst svg { width: 40px; height: 40px; fill: var(--like); animation: burst-fly 0.8s ease-out forwards; }
    @keyframes burst-fly {
      0% { transform: translate(0,0) scale(1); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0.3); opacity: 0; }
    }

    /* ===== BOTTOM INFO ===== */
    .video-info {
      position: absolute; left: 0; right: 70px; bottom: 0; z-index: 10;
      padding: 20px 16px 24px; background: linear-gradient(transparent, rgba(0,0,0,0.7));
    }
    .info-user { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .info-avatar {
      width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #ff2d55, #ff9500);
      display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem;
    }
    .info-name { font-weight: 700; font-size: 0.9rem; }
    .info-desc { font-size: 0.8rem; color: var(--accent-dim); line-height: 1.4; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .info-music { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--accent-dim); }
    .info-music svg { width: 14px; height: 14px; fill: currentColor; animation: spin-music 3s linear infinite; }
    @keyframes spin-music { 100% { transform: rotate(360deg); } }

    /* ===== PROGRESS BAR ===== */
    .progress-bar {
      position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: rgba(255,255,255,0.1); z-index: 15;
    }
    .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ff2d55, #ff9500); border-radius: 0 2px 2px 0; transition: width 0.1s linear; }

    /* ===== ADD VIDEO MODAL ===== */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(20px);
      z-index: 200; display: flex; align-items: flex-end; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
    }
    .modal-overlay.show { opacity: 1; pointer-events: auto; }
    .modal-card {
      width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius) var(--radius) 0 0; padding: 20px; transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    .modal-overlay.show .modal-card { transform: translateY(0); }
    .modal-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; }
    .modal-title button { background: none; border: none; color: var(--accent-dim); font-size: 1.2rem; cursor: pointer; }
    .input-wrap { margin-bottom: 12px; }
    .input-wrap label { display: block; font-size: 0.75rem; color: var(--accent-muted); margin-bottom: 6px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
    .clean-input {
      width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 14px; color: #fff; font-size: 0.9rem; outline: none; transition: border-color 0.15s;
    }
    .clean-input:focus { border-color: var(--like); }
    .clean-input::placeholder { color: var(--accent-muted); }
    .btn-primary {
      width: 100%; background: linear-gradient(135deg, #ff2d55, #ff9500); border: none; color: #fff;
      padding: 14px; border-radius: 12px; font-weight: 700; font-size: 0.95rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 8px;
    }
    .btn-primary:active { opacity: 0.8; transform: scale(0.98); }
    .btn-primary svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }

    /* ===== COMMENTS DRAWER ===== */
    .comments-drawer {
      position: fixed; inset: 0; z-index: 300; display: flex; flex-direction: column; justify-content: flex-end;
      opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
    }
    .comments-drawer.show { opacity: 1; pointer-events: auto; }
    .comments-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.6); }
    .comments-sheet {
      position: relative; background: var(--surface); border-radius: var(--radius) var(--radius) 0 0;
      max-height: 70vh; display: flex; flex-direction: column; transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    .comments-drawer.show .comments-sheet { transform: translateY(0); }
    .comments-header {
      padding: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between;
    }
    .comments-header h3 { font-size: 1rem; font-weight: 700; }
    .comments-header button { background: none; border: none; color: var(--accent-dim); font-size: 1.3rem; cursor: pointer; }
    .comments-list { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; }
    .comments-list::-webkit-scrollbar { display: none; }
    .comment-item { display: flex; gap: 10px; align-items: flex-start; }
    .comment-avatar {
      width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #5856d6, #af52de);
      display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.75rem; flex-shrink: 0;
    }
    .comment-body { flex: 1; }
    .comment-author { font-weight: 600; font-size: 0.8rem; margin-bottom: 2px; }
    .comment-text { font-size: 0.8rem; color: var(--accent-dim); line-height: 1.4; }
    .comment-time { font-size: 0.65rem; color: var(--accent-muted); margin-top: 2px; }
    .comments-input-wrap {
      padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: center;
    }
    .comments-input {
      flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 20px;
      padding: 10px 14px; color: #fff; font-size: 0.85rem; outline: none;
    }
    .comments-input:focus { border-color: var(--comment); }
    .send-btn {
      width: 36px; height: 36px; border-radius: 50%; background: var(--comment); border: none;
      color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .send-btn:active { transform: scale(0.9); }
    .send-btn svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }

    /* ===== EMPTY STATE ===== */
    .empty-state {
      position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      padding: 40px; text-align: center;
    }
    .empty-state svg { width: 64px; height: 64px; stroke: var(--accent-muted); stroke-width: 1.5; fill: none; }
    .empty-state h2 { font-size: 1.1rem; color: var(--accent-dim); }
    .empty-state p { font-size: 0.8rem; color: var(--accent-muted); }

    /* ===== LOADING SKELETON ===== */
    .skeleton-card {
      width: 100%; height: 100vh; height: 100dvh; scroll-snap-align: start;
      background: var(--bg); position: relative; overflow: hidden;
    }
    .skeleton-card::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);
      animation: skeleton-shine 1.5s infinite;
    }
    @keyframes skeleton-shine { 0%{transform:translateX(-100%)} 100%{transform:translateX(100%)} }

    /* ===== TOAST ===== */
    .toast {
      position: fixed; top: 64px; left: 50%; transform: translateX(-50%) translateY(-20px);
      background: var(--surface); border: 1px solid var(--border); color: var(--accent);
      padding: 10px 20px; border-radius: 24px; font-size: 0.8rem; font-weight: 600;
      z-index: 500; opacity: 0; pointer-events: none; transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ===== BOTTOM NAV (Optional) ===== */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 60px;
      background: rgba(0,0,0,0.9); backdrop-filter: blur(20px);
      border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-around;
      z-index: 100; padding-bottom: env(safe-area-inset-bottom);
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: none; color: var(--accent-muted); cursor: pointer; }
    .nav-item.active { color: var(--accent); }
    .nav-item svg { width: 24px; height: 24px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .nav-item span { font-size: 0.6rem; font-weight: 600; }
    .nav-item.add svg { fill: currentColor; stroke: none; }

    /* ===== SCROLL INDICATOR ===== */
    .scroll-hint {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      animation: hint-bounce 2s ease infinite; z-index: 50; pointer-events: none;
    }
    .scroll-hint span { font-size: 0.65rem; color: var(--accent-dim); text-shadow: 0 1px 4px rgba(0,0,0,0.8); }
    .scroll-hint svg { width: 20px; height: 20px; stroke: var(--accent-dim); stroke-width: 2; fill: none; }
    @keyframes hint-bounce { 0%,100%{transform:translateX(-50%)translateY(0)} 50%{transform:translateX(-50%)translateY(6px)} }
  </style>
</head>
<body>

<div class="app-shell">
  <!-- TOP BAR -->
  <header class="top-bar">
    <div class="brand">
      <div class="brand-dot"></div>
      FINGER TOK
    </div>

      <button class="icon-btn" onclick="toggleObjectFit()" title="Режим отображения">

  <!-- FEED -->
  <div class="feed-container" id="feedContainer">

  <!-- SCROLL HINT -->

      <span>Добавить</span>
    </button>
    <button class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      <span>Профиль</span>
    </button>
  </nav>
</div>

<!-- ADD VIDEO MODAL -->
<div class="modal-overlay" id="addModal" onclick="closeAddModal(event)">
  <div class="modal-card" onclick="event.stopPropagation()">
    <div class="modal-title">
      Добавить видео
      <button onclick="closeAddModal()">&times;</button>
    </div>
    <div class="input-wrap">
      <label>Прямая ссылка на видео</label>
      <input type="url" class="clean-input" id="videoUrlInput" placeholder="https://site.com/video.mp4 или .m3u8" autocomplete="off">
    </div>
    <div class="input-wrap">
      <label>Описание (опционально)</label>
      <input type="text" class="clean-input" id="videoDescInput" placeholder="Опиши свое видео..." autocomplete="off" maxlength="100">
    </div>
    <button class="btn-primary" onclick="submitVideo()">
      <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
      Опубликовать

</div>

<!-- COMMENTS DRAWER -->
<div class="comments-drawer" id="commentsDrawer" onclick="closeComments(event)">
  <div class="comments-backdrop" onclick="closeComments()"></div>
  <div class="comments-sheet" onclick="event.stopPropagation()">
    <div class="comments-header">
      <h3>Комментарии <span id="commentCount" style="color:var(--accent-muted);font-weight:400;">0</span></h3>
      <button onclick="closeComments()">&times;</button>
    </div>
    <div class="comments-list" id="commentsList"></div>
    <div class="comments-input-wrap">
      <input type="text" class="comments-input" id="commentInput" placeholder="Написать комментарий..." maxlength="200">
      <button class="send-btn" onclick="submitComment()">
        <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script type="module">
  // ===== FIREBASE INIT (already loaded via module script in head) =====
  let db, fbRef, fbPush, fbSet, fbOnValue, fbOnChildAdded, fbOnChildChanged, fbOnChildRemoved, fbServerTimestamp, fbQuery, fbOrderByChild, fbLimitToLast;

  // Wait for Firebase to be ready
  await new Promise(resolve => {
    if (window.db) {
      resolve();
    } else {
      window.addEventListener('firebase-ready', resolve, { once: true });
    }
  });

  db = window.db;
  fbRef = window.fbRef;
  fbPush = window.fbPush;
  fbSet = window.fbSet;
  fbOnValue = window.fbOnValue;
  fbOnChildAdded = window.fbOnChildAdded;
  fbOnChildChanged = window.fbOnChildChanged;
  fbOnChildRemoved = window.fbOnChildRemoved;
  fbServerTimestamp = window.fbServerTimestamp;
  fbQuery = window.fbQuery;
  fbOrderByChild = window.fbOrderByChild;
  fbLimitToLast = window.fbLimitToLast;

  // ===== STATE =====
  const state = {
    videos: [],
    currentVideoId: null,
    objectFit: 'cover', // or 'contain'
    userId: 'user_' + Math.random().toString(36).substr(2, 9),
    likedVideos: new Set(),
    videoElements: new Map(),
    commentsOpenFor: null
  };

  // ===== DOM REFS =====
  const feedContainer = document.getElementById('feedContainer');
  const skeleton = document.getElementById('skeleton');
  const toast = document.getElementById('toast');
  const scrollHint = document.getElementById('scrollHint');

  // ===== HELPERS =====
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  }

  function formatTime(ts) {
    if (!ts) return 'только что';
    const now = Date.now();
    const diff = now - ts;
    const sec = Math.floor(diff / 1000);
    if (sec < 60) return 'только что';
    const min = Math.floor(sec / 60);
    if (min < 60) return min + ' мин назад';
    const hr = Math.floor(min / 60);
    if (hr < 24) return hr + ' ч назад';
    const day = Math.floor(hr / 24);
    return day + ' дн назад';
  }

  function getInitials(name) {
    return name ? name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0,2) : '??';
  }

  // ===== VIDEO CARD RENDERER =====
  function createVideoCard(videoData, videoId) {
    const card = document.createElement('div');
    card.className = 'video-card';
    card.dataset.videoId = videoId;
    card.dataset.url = videoData.url || '';

    const isLiked = state.likedVideos.has(videoId);
    const likeCount = videoData.likes || 0;
    const commentCount = videoData.comments ? Object.keys(videoData.comments).length : 0;
    const desc = videoData.description || 'Без описания';
    const userName = videoData.userName || 'Аноним';

    card.innerHTML = `
      <video class="${state.objectFit === 'contain' ? 'contain' : ''}" 
             src="${videoData.url}" 
             loop 
             playsinline 
             webkit-playsinline
             preload="metadata"
             muted></video>

      <div class="play-overlay" id="playOverlay_${videoId}">
        <div class="big-play" id="bigPlay_${videoId}">
          <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        </div>
      </div>

      <div class="action-bar">
        <button class="action-btn like ${isLiked ? 'liked' : ''}" id="likeBtn_${videoId}" onclick="handleLike('${videoId}', event)">
          <div class="act-icon ${isLiked ? 'liked' : ''}">
            <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
          </div>
          <span class="act-count" id="likeCount_${videoId}">${likeCount}</span>
        </button>

        <button class="action-btn comment" onclick="openComments('${videoId}')">
          <div class="act-icon">
            <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
          </div>
          <span class="act-count" id="commentCount_${videoId}">${commentCount}</span>
        </button>

        <button class="action-btn" onclick="shareVideo('${videoId}')">
          <div class="act-icon">
            <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
          </div>
          <span class="act-count">Поделиться</span>
        </button>
      </div>

      <div class="video-info">
        <div class="info-user">
          <div class="info-avatar">${getInitials(userName)}</div>
          <div class="info-name">${userName}</div>
        </div>
        <div class="info-desc">${desc}</div>
        <div class="info-music">
          <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
          Finger Workout Original Sound
        </div>
      </div>

      <div class="progress-bar">
        <div class="progress-fill" id="progress_${videoId}"></div>
      </div>
    `;

    // Video interactions
    const video = card.querySelector('video');
    const playOverlay = card.querySelector('.play-overlay');
    const bigPlay = card.querySelector('.big-play');
    const progressFill = card.querySelector('.progress-fill');

    // Click to play/pause
    card.addEventListener('click', (e) => {
      if (e.target.closest('.action-bar') || e.target.closest('.video-info')) return;
      toggleVideo(video, bigPlay);
    });

    // Double tap to like
    let lastTap = 0;
    card.addEventListener('click', (e) => {
      const now = Date.now();
      if (now - lastTap < 300) {
        // Double tap
        if (!state.likedVideos.has(videoId)) {
          handleLike(videoId, e);
          createLikeBurst(e.clientX || e.touches?.[0]?.clientX || window.innerWidth/2, 
                         e.clientY || e.touches?.[0]?.clientY || window.innerHeight/2);
        }
      }
      lastTap = now;
    });

    // Progress
    video.addEventListener('timeupdate', () => {
      if (video.duration) {
        progressFill.style.width = (video.currentTime / video.duration * 100) + '%';
      }
    });

    video.addEventListener('ended', () => {
      bigPlay.classList.add('show');
    });

    state.videoElements.set(videoId, video);
    return card;
  }

  function toggleVideo(video, bigPlay) {
    if (video.paused) {
      // Pause all other videos
      state.videoElements.forEach((v, id) => {
        if (v !== video && !v.paused) {
          v.pause();
          const otherOverlay = document.getElementById(`bigPlay_${id}`);
          if (otherOverlay) otherOverlay.classList.add('show');
        }
      });
      video.play().then(() => {
        bigPlay.classList.remove('show');
      }).catch(() => {});
    } else {
      video.pause();
      bigPlay.classList.add('show');
    }
  }

  function createLikeBurst(x, y) {
    const burst = document.createElement('div');
    burst.className = 'like-burst';
    burst.style.left = (x - 20) + 'px';
    burst.style.top = (y - 20) + 'px';
    burst.innerHTML = `<svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>`;
    const angle = (Math.random() - 0.5) * 120;
    const dist = 60 + Math.random() * 40;
    burst.style.setProperty('--tx', Math.sin(angle * Math.PI / 180) * dist + 'px');
    burst.style.setProperty('--ty', -(Math.cos(angle * Math.PI / 180) * dist + 20) + 'px');
    document.body.appendChild(burst);
    setTimeout(() => burst.remove(), 800);
  }

  // ===== FIREBASE: LOAD VIDEOS =====
  const videosRef = fbRef(db, 'videos');

  fbOnValue(videosRef, (snapshot) => {
    const data = snapshot.val();
    if (!data) {
      skeleton.style.display = 'none';
      showEmptyState();
      return;
    }

    // Convert to array and sort by timestamp desc
    const videosArray = Object.entries(data).map(([id, v]) => ({ id, ...v }));
    videosArray.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

    state.videos = videosArray;

    // Clear feed except skeleton
    feedContainer.innerHTML = '';

    if (videosArray.length === 0) {
      showEmptyState();
      return;
    }

    scrollHint.style.display = videosArray.length > 1 ? 'flex' : 'none';

    videosArray.forEach(v => {
      const card = createVideoCard(v, v.id);
      feedContainer.appendChild(card);
    });

    // Auto-play first video
    setTimeout(() => {
      const firstVideo = state.videoElements.get(videosArray[0]?.id);
      if (firstVideo) {
        firstVideo.play().catch(() => {});
        const firstOverlay = document.getElementById(`bigPlay_${videosArray[0].id}`);
        if (firstOverlay) firstOverlay.classList.remove('show');
      }
    }, 500);

    // Intersection Observer for auto-play
    setupIntersectionObserver();
  });

  function showEmptyState() {
    feedContainer.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line><circle cx="12" cy="10" r="3"></circle></svg>
        <h2>Пока нет видео</h2>
        <p>Будь первым! Нажми + и добавь свое видео</p>
      </div>
    `;
  }

  // ===== INTERSECTION OBSERVER =====
  function setupIntersectionObserver() {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const card = entry.target;
        const videoId = card.dataset.videoId;
        const video = state.videoElements.get(videoId);
        const bigPlay = document.getElementById(`bigPlay_${videoId}`);

        if (entry.isIntersecting && entry.intersectionRatio > 0.6) {
          state.currentVideoId = videoId;
          if (video && video.paused) {
            // Pause others
            state.videoElements.forEach((v, id) => {
              if (id !== videoId && !v.paused) {
                v.pause();
                const otherPlay = document.getElementById(`bigPlay_${id}`);
                if (otherPlay) otherPlay.classList.add('show');
              }
            });
            video.play().then(() => {
              if (bigPlay) bigPlay.classList.remove('show');
            }).catch(() => {});
          }
        } else if (!entry.isIntersecting && video && !video.paused) {
          video.pause();
          if (bigPlay) bigPlay.classList.add('show');
        }
      });
    }, { threshold: [0.6] });

    document.querySelectorAll('.video-card').forEach(card => observer.observe(card));
  }

  // ===== LIKE HANDLER =====
  window.handleLike = function(videoId, event) {
    event?.stopPropagation();
    const likeBtn = document.getElementById(`likeBtn_${videoId}`);
    const likeIcon = likeBtn?.querySelector('.act-icon');
    const likeCountEl = document.getElementById(`likeCount_${videoId}`);

    const videoRef = fbRef(db, `videos/${videoId}`);
    fbOnValue(videoRef, (snap) => {
      const data = snap.val();
      if (!data) return;

      const currentLikes = data.likes || 0;
      const isLiked = state.likedVideos.has(videoId);

      if (!isLiked) {
        fbSet(fbRef(db, `videos/${videoId}/likes`), currentLikes + 1);
        state.likedVideos.add(videoId);
        if (likeIcon) likeIcon.classList.add('liked');
        likeBtn?.classList.add('liked');
      } else {
        fbSet(fbRef(db, `videos/${videoId}/likes`), Math.max(0, currentLikes - 1));
        state.likedVideos.delete(videoId);
        if (likeIcon) likeIcon.classList.remove('liked');
        likeBtn?.classList.remove('liked');
      }

      // Update count immediately for UX
      if (likeCountEl) {
        likeCountEl.textContent = !isLiked ? currentLikes + 1 : Math.max(0, currentLikes - 1);
      }
    }, { onlyOnce: true });
  };

  // ===== COMMENTS =====
  window.openComments = function(videoId) {
    state.commentsOpenFor = videoId;
    const drawer = document.getElementById('commentsDrawer');
    const list = document.getElementById('commentsList');
    const countEl = document.getElementById('commentCount');
    const input = document.getElementById('commentInput');
    input.value = '';
    input.focus();

    drawer.classList.add('show');

    // Load comments
    const commentsRef = fbRef(db, `videos/${videoId}/comments`);
    fbOnValue(commentsRef, (snap) => {
      const data = snap.val();
      list.innerHTML = '';

      if (!data) {
        list.innerHTML = '<div style="text-align:center;color:var(--accent-muted);padding:20px;font-size:0.8rem;">Пока нет комментариев. Будь первым!</div>';
        countEl.textContent = '0';
        return;
      }

      const comments = Object.entries(data).map(([id, c]) => ({ id, ...c }));
      comments.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

      countEl.textContent = comments.length;

      comments.forEach(c => {
        const item = document.createElement('div');
        item.className = 'comment-item';
        item.innerHTML = `
          <div class="comment-avatar">${getInitials(c.userName)}</div>
          <div class="comment-body">
            <div class="comment-author">${c.userName || 'Аноним'}</div>
            <div class="comment-text">${c.text}</div>
            <div class="comment-time">${formatTime(c.timestamp)}</div>
          </div>
        `;
        list.appendChild(item);
      });

      // Update badge on video card
      const badge = document.getElementById(`commentCount_${videoId}`);
      if (badge) badge.textContent = comments.length;
    });
  };

  window.closeComments = function(event) {
    if (event && event.target !== event.currentTarget && !event.target.classList.contains('comments-backdrop')) return;
    document.getElementById('commentsDrawer').classList.remove('show');
    state.commentsOpenFor = null;
  };

  window.submitComment = function() {
    const input = document.getElementById('commentInput');
    const text = input.value.trim();
    if (!text || !state.commentsOpenFor) return;

    const commentRef = fbPush(fbRef(db, `videos/${state.commentsOpenFor}/comments`));
    fbSet(commentRef, {
      text: text,
      userName: 'Пользователь ' + state.userId.slice(-4),
      userId: state.userId,
      timestamp: Date.now()
    });

    input.value = '';
    showToast('Комментарий отправлен!');
  };

  // Enter to submit comment
  document.getElementById('commentInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') submitComment();
  });

  // ===== ADD VIDEO =====
  window.openAddModal = function() {
    document.getElementById('addModal').classList.add('show');
    setTimeout(() => document.getElementById('videoUrlInput').focus(), 100);
  };

  window.closeAddModal = function(event) {
    if (event && event.target !== event.currentTarget) return;
    document.getElementById('addModal').classList.remove('show');
    document.getElementById('videoUrlInput').value = '';
    document.getElementById('videoDescInput').value = '';
  };

  window.submitVideo = async function() {
    const url = document.getElementById('videoUrlInput').value.trim();
    const desc = document.getElementById('videoDescInput').value.trim();

    if (!url) {
      showToast('Введите ссылку на видео!');
      return;
    }

    // Validate URL
    try {
      new URL(url);
    } catch {
      showToast('Неверный формат ссылки!');
      return;
    }

    const newVideoRef = fbPush(fbRef(db, 'videos'));
    await fbSet(newVideoRef, {
      url: url,
      description: desc || 'Без описания',
      userName: 'Пользователь ' + state.userId.slice(-4),
      userId: state.userId,
      likes: 0,
      timestamp: fbServerTimestamp(),
      comments: {}
    });

    closeAddModal();
    showToast('Видео опубликовано!');
  };

  // ===== SHARE =====
  window.shareVideo = function(videoId) {
    const video = state.videos.find(v => v.id === videoId);
    if (!video) return;

    if (navigator.share) {
      navigator.share({
        title: 'Finger Tok',
        text: video.description || 'Смотри это видео в Finger Tok!',
        url: video.url
      }).catch(() => {});
    } else {
      navigator.clipboard.writeText(video.url).then(() => {
        showToast('Ссылка скопирована!');
      });
    }
  };

  // ===== TOGGLE OBJECT FIT =====
  window.toggleObjectFit = function() {
    state.objectFit = state.objectFit === 'cover' ? 'contain' : 'cover';
    document.querySelectorAll('.video-card video').forEach(v => {
      v.classList.toggle('contain', state.objectFit === 'contain');
    });
    showToast(state.objectFit === 'cover' ? 'Режим: Обрезка' : 'Режим: По размеру');
  };

  // ===== KEYBOARD SHORTCUTS =====
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeAddModal();
      closeComments();
    }
  });

  // ===== HIDE SCROLL HINT AFTER FIRST SCROLL =====
  let hintShown = false;
  feedContainer.addEventListener('scroll', () => {
    if (!hintShown && feedContainer.scrollTop > 50) {
      hintShown = true;
      scrollHint.style.opacity = '0';
      setTimeout(() => scrollHint.style.display = 'none', 300);
    }
  }, { passive: true });

  // ===== REALTIME LISTENERS FOR LIKES/COMMENTS =====
  fbOnChildChanged(videosRef, (snapshot) => {
    const videoId = snapshot.key;
    const data = snapshot.val();

    // Update like count
    const likeCountEl = document.getElementById(`likeCount_${videoId}`);
    if (likeCountEl && data.likes !== undefined) {
      likeCountEl.textContent = data.likes;
    }

    // Update comment count
    const commentCountEl = document.getElementById(`commentCount_${videoId}`);
    if (commentCountEl && data.comments) {
      commentCountEl.textContent = Object.keys(data.comments).length;
    }
  });

  console.log('🔥 Finger Tok loaded! Firebase RTDB connected.');
</script>

</body>
</html>
