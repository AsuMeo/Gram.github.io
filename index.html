<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Калькулятор</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#0e0e0e;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
#app{width:100%;height:100%;}

#calc-screen{display:flex;flex-direction:column;height:100%;background:#0e0e0e;}
#calc-display{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;padding:20px 16px;gap:8px;}
#calc-history{color:#888;font-size:18px;min-height:24px;word-break:break-all;}
#calc-input{color:#fff;font-size:52px;font-weight:300;word-break:break-all;text-align:right;}
#calc-pad{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#1a1a1a;padding:1px;}
.calc-btn{height:72px;border:none;background:#1c1c1c;color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .1s;}
.calc-btn:active{background:#333;}
.calc-btn.op{background:#ff9500;color:#fff;font-size:32px;}
.calc-btn.op:active{background:#d48000;}
.calc-btn.ac{background:#a5a5a5;color:#000;}
.calc-btn.zero{grid-column:span 2;justify-content:flex-start;padding-left:28px;}

#msg-screen{display:none;flex-direction:column;height:100%;background:#0e0e0e;}
#msg-header{height:56px;display:flex;align-items:center;gap:12px;padding:0 12px;background:#1a1a1a;border-bottom:1px solid #2a2a2a;flex-shrink:0;}
#msg-avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#333;}
#msg-info{flex:1;min-width:0;}
#msg-name{color:#fff;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#msg-status{color:#8e8e93;font-size:12px;}
#msg-status.online{color:#34c759;}
#msg-status.typing{color:#34c759;}
#msg-back-btn,#msg-menu-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;cursor:pointer;}

#msg-body{flex:1;overflow-y:auto;padding:8px 12px;display:flex;flex-direction:column;gap:4px;background:#0e0e0e;}
.msg-row{display:flex;flex-direction:column;max-width:80%;margin:2px 0;}
.msg-row.out{align-self:flex-end;align-items:flex-end;}
.msg-row.in{align-self:flex-start;align-items:flex-start;}
.msg-bubble{padding:8px 12px;border-radius:18px;font-size:15px;line-height:1.4;word-break:break-word;position:relative;}
.msg-row.out .msg-bubble{background:#2b5278;color:#fff;border-bottom-right-radius:4px;}
.msg-row.in .msg-bubble{background:#2c2c2e;color:#fff;border-bottom-left-radius:4px;}
.msg-bubble img{max-width:220px;border-radius:12px;display:block;margin:4px 0;}
.msg-bubble video{max-width:220px;border-radius:12px;display:block;margin:4px 0;}
.msg-bubble .msg-voice{display:flex;align-items:center;gap:8px;padding:4px 0;}
.msg-bubble .msg-voice span{font-size:13px;opacity:.7;}
.msg-meta{display:flex;align-items:center;gap:4px;margin-top:2px;padding:0 4px;}
.msg-time{font-size:11px;color:#8e8e93;}
.msg-checks{font-size:11px;color:#8e8e93;}
.msg-checks.read{color:#4fc3f7;}
.msg-deleted{font-style:italic;color:#666;font-size:13px;}

#msg-input-area{flex-shrink:0;padding:8px 12px 16px;background:#1a1a1a;border-top:1px solid #2a2a2a;display:flex;align-items:flex-end;gap:8px;}
#msg-attach-btn,#msg-voice-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:#8e8e93;cursor:pointer;flex-shrink:0;}
#msg-input{flex:1;background:#2c2c2e;border:none;border-radius:20px;padding:10px 16px;color:#fff;font-size:15px;outline:none;max-height:120px;resize:none;font-family:inherit;}
#msg-input::placeholder{color:#666;}
#msg-send-btn{width:36px;height:36px;border-radius:50%;background:#2b5278;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
#msg-send-btn svg{width:20px;height:20px;fill:#fff;}

#chats-screen{display:none;flex-direction:column;height:100%;background:#0e0e0e;}
#chats-header{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#1a1a1a;border-bottom:1px solid #2a2a2a;flex-shrink:0;}
#chats-title{color:#fff;font-size:17px;font-weight:600;}
#chats-menu-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;}
#chats-list{flex:1;overflow-y:auto;}
.chat-item{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;border-bottom:1px solid #1a1a1a;}
.chat-item:active{background:#1a1a1a;}
.chat-avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#333;flex-shrink:0;}
.chat-info{flex:1;min-width:0;}
.chat-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;}
.chat-name{color:#fff;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chat-time{color:#8e8e93;font-size:12px;flex-shrink:0;}
.chat-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.chat-preview{color:#8e8e93;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chat-unread{min-width:20px;height:20px;border-radius:10px;background:#2b5278;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;padding:0 6px;flex-shrink:0;}
.chat-status{color:#34c759;font-size:11px;flex-shrink:0;}
.chat-typing{color:#34c759;font-size:12px;}

#auth-screen{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;background:#0e0e0e;padding:24px;gap:16px;}
#auth-screen h2{color:#fff;font-size:24px;font-weight:600;margin-bottom:8px;}
.auth-input{width:100%;max-width:320px;background:#1c1c1c;border:1px solid #2a2a2a;border-radius:12px;padding:14px 16px;color:#fff;font-size:16px;outline:none;}
.auth-input:focus{border-color:#2b5278;}
.auth-btn{width:100%;max-width:320px;background:#2b5278;border:none;border-radius:12px;padding:14px;color:#fff;font-size:16px;font-weight:500;cursor:pointer;}
.auth-btn:active{background:#1e3a5f;}
.auth-link{color:#2b5278;font-size:14px;cursor:pointer;text-align:center;}

#menu-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:100;}
#menu-panel{position:fixed;right:0;top:0;bottom:0;width:260px;background:#1a1a1a;z-index:101;transform:translateX(100%);transition:transform .2s;}
#menu-panel.open{transform:translateX(0);}
.menu-header{padding:16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #2a2a2a;}
.menu-avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#333;}
.menu-name{color:#fff;font-size:16px;font-weight:500;}
.menu-email{color:#8e8e93;font-size:13px;}
.menu-item{padding:14px 16px;color:#fff;font-size:15px;display:flex;align-items:center;gap:12px;cursor:pointer;}
.menu-item:active{background:#2a2a2a;}
.menu-item svg{width:22px;height:22px;fill:#8e8e93;}

#profile-screen{display:none;flex-direction:column;height:100%;background:#0e0e0e;}
#profile-header{height:56px;display:flex;align-items:center;gap:12px;padding:0 12px;background:#1a1a1a;border-bottom:1px solid #2a2a2a;flex-shrink:0;}
#profile-back-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;cursor:pointer;}
#profile-title{color:#fff;font-size:17px;font-weight:600;flex:1;}
#profile-body{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;align-items:center;gap:16px;}
#profile-avatar-preview{width:120px;height:120px;border-radius:50%;object-fit:cover;background:#333;cursor:pointer;border:2px solid #2a2a2a;}
#profile-name-input{width:100%;max-width:300px;background:#1c1c1c;border:1px solid #2a2a2a;border-radius:12px;padding:12px 16px;color:#fff;font-size:16px;outline:none;text-align:center;}
#profile-save-btn{width:100%;max-width:300px;background:#2b5278;border:none;border-radius:12px;padding:12px;color:#fff;font-size:16px;cursor:pointer;}

#add-contact-screen{display:none;flex-direction:column;height:100%;background:#0e0e0e;}
#add-contact-header{height:56px;display:flex;align-items:center;gap:12px;padding:0 12px;background:#1a1a1a;border-bottom:1px solid #2a2a2a;flex-shrink:0;}
#add-contact-back-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;cursor:pointer;}
#add-contact-body{flex:1;padding:24px;display:flex;flex-direction:column;gap:16px;align-items:center;}
#add-contact-input{width:100%;max-width:320px;background:#1c1c1c;border:1px solid #2a2a2a;border-radius:12px;padding:14px 16px;color:#fff;font-size:16px;outline:none;}
#add-contact-btn{width:100%;max-width:320px;background:#2b5278;border:none;border-radius:12px;padding:14px;color:#fff;font-size:16px;cursor:pointer;}

#delete-modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:200;align-items:center;justify-content:center;padding:24px;}
#delete-modal-box{background:#1a1a1a;border-radius:16px;padding:20px;width:100%;max-width:320px;}
#delete-modal-title{color:#fff;font-size:17px;font-weight:600;margin-bottom:16px;}
.delete-option{display:flex;align-items:center;gap:12px;padding:12px 0;color:#fff;font-size:15px;cursor:pointer;border-bottom:1px solid #2a2a2a;}
.delete-option:last-child{border:none;}
.delete-option input{width:20px;height:20px;accent-color:#2b5278;}
#delete-modal-btns{display:flex;gap:8px;margin-top:16px;}
.delete-modal-btn{flex:1;padding:12px;border:none;border-radius:10px;font-size:15px;cursor:pointer;}
.delete-modal-btn.cancel{background:#2c2c2e;color:#fff;}
.delete-modal-btn.confirm{background:#ff3b30;color:#fff;}

#voice-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.8);z-index:200;flex-direction:column;align-items:center;justify-content:center;gap:24px;}
#voice-circle{width:80px;height:80px;border-radius:50%;background:#ff3b30;display:flex;align-items:center;justify-content:center;animation:pulse 1s infinite;}
#voice-timer{color:#fff;font-size:24px;font-weight:300;}
#voice-hint{color:#8e8e93;font-size:14px;}
@keyframes pulse{0%{transform:scale(1);}50%{transform:scale(1.1);}100%{transform:scale(1);}}

#splash{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;background:#0e0e0e;position:fixed;top:0;left:0;right:0;bottom:0;z-index:300;transition:opacity .3s;}
#splash-logo{width:80px;height:80px;border-radius:20px;background:#2b5278;display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
#splash-logo svg{width:48px;height:48px;fill:#fff;}
#splash-text{color:#fff;font-size:20px;font-weight:600;}

.msg-bubble .msg-circle{width:200px;height:200px;border-radius:50%;object-fit:cover;display:block;}

::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#333;border-radius:2px;}
</style>
</head>
<body>
<div id="app">

<div id="splash">
<div id="splash-logo"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg></div>
<div id="splash-text">Messenger</div>
</div>

<div id="calc-screen">
<div id="calc-display">
<div id="calc-history"></div>
<div id="calc-input">0</div>
</div>
<div id="calc-pad">
<button class="calc-btn ac" onclick="calcClear()">AC</button>
<button class="calc-btn" onclick="calcOp('+/-')">+/-</button>
<button class="calc-btn" onclick="calcOp('%')">%</button>
<button class="calc-btn op" onclick="calcOp('/')">&divide;</button>
<button class="calc-btn" onclick="calcNum('7')">7</button>
<button class="calc-btn" onclick="calcNum('8')">8</button>
<button class="calc-btn" onclick="calcNum('9')">9</button>
<button class="calc-btn op" onclick="calcOp('*')">&times;</button>
<button class="calc-btn" onclick="calcNum('4')">4</button>
<button class="calc-btn" onclick="calcNum('5')">5</button>
<button class="calc-btn" onclick="calcNum('6')">6</button>
<button class="calc-btn op" onclick="calcOp('-')">&minus;</button>
<button class="calc-btn" onclick="calcNum('1')">1</button>
<button class="calc-btn" onclick="calcNum('2')">2</button>
<button class="calc-btn" onclick="calcNum('3')">3</button>
<button class="calc-btn op" onclick="calcOp('+')">+</button>
<button class="calc-btn zero" onclick="calcNum('0')">0</button>
<button class="calc-btn" onclick="calcNum('.')">.</button>
<button class="calc-btn op" onclick="calcEq()">=</button>
</div>
</div>

<div id="auth-screen">
<h2 id="auth-title">Вход</h2>
<input type="email" id="auth-email" class="auth-input" placeholder="Email">
<input type="password" id="auth-pass" class="auth-input" placeholder="Пароль">
<button class="auth-btn" onclick="authSubmit()" id="auth-btn">Войти</button>
<div class="auth-link" id="auth-toggle" onclick="toggleAuth()">Нет аккаунта? Зарегистрироваться</div>
</div>

<div id="chats-screen">
<div id="chats-header">
<div id="chats-title">Сообщения</div>
<div id="chats-menu-btn" onclick="openMenu()">
<svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
</div>
</div>
<div id="chats-list"></div>
</div>

<div id="msg-screen">
<div id="msg-header">
<div id="msg-back-btn" onclick="showChats()">
<svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
</div>
<img id="msg-avatar" src="" alt="">
<div id="msg-info">
<div id="msg-name"></div>
<div id="msg-status"></div>
</div>
<div id="msg-menu-btn" onclick="openChatMenu()">
<svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
</div>
</div>
<div id="msg-body"></div>
<div id="msg-input-area">
<div id="msg-attach-btn" onclick="pickFile()">
<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
</div>
<textarea id="msg-input" rows="1" placeholder="Сообщение..." oninput="onTyping()" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendText();}"></textarea>
<div id="msg-voice-btn" onpointerdown="startVoiceRecord()" onpointerup="stopVoiceRecord()">
<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/></svg>
</div>
<div id="msg-send-btn" onclick="sendText()">
<svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
</div>
</div>
</div>

<div id="menu-overlay" onclick="closeMenu()"></div>
<div id="menu-panel">
<div class="menu-header">
<img class="menu-avatar" id="menu-avatar" src="" alt="">
<div>
<div class="menu-name" id="menu-name"></div>
<div class="menu-email" id="menu-email"></div>
</div>
</div>
<div class="menu-item" onclick="showProfile()">
<svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
Профиль
</div>
<div class="menu-item" onclick="showAddContact()">
<svg viewBox="0 0 24 24"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
Добавить контакт
</div>
<div class="menu-item" onclick="logout()">
<svg viewBox="0 0 24 24"><path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
Выйти
</div>
</div>

<div id="profile-screen">
<div id="profile-header">
<div id="profile-back-btn" onclick="showChats()">
<svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
</div>
<div id="profile-title">Профиль</div>
</div>
<div id="profile-body">
<img id="profile-avatar-preview" src="" alt="" onclick="pickAvatar()">
<input type="text" id="profile-name-input" placeholder="Ваше имя">
<button id="profile-save-btn" onclick="saveProfile()">Сохранить</button>
</div>
</div>

<div id="add-contact-screen">
<div id="add-contact-header">
<div id="add-contact-back-btn" onclick="showChats()">
<svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
</div>
<div id="profile-title">Новый диалог</div>
</div>
<div id="add-contact-body">
<input type="email" id="add-contact-input" placeholder="Email собеседника">
<button id="add-contact-btn" onclick="addContact()">Начать диалог</button>
</div>
</div>

<div id="delete-modal" onclick="if(event.target===this)closeDeleteModal()">
<div id="delete-modal-box">
<div id="delete-modal-title">Удалить сообщение?</div>
<div class="delete-option" onclick="document.getElementById('del-both').checked=!document.getElementById('del-both').checked">
<input type="checkbox" id="del-both">
<span>Удалить у всех</span>
</div>
<div id="delete-modal-btns">
<button class="delete-modal-btn cancel" onclick="closeDeleteModal()">Отмена</button>
<button class="delete-modal-btn confirm" onclick="confirmDelete()">Удалить</button>
</div>
</div>
</div>

<div id="voice-overlay">
<div id="voice-circle">
<svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/></svg>
</div>
<div id="voice-timer">0:00</div>
<div id="voice-hint">Отпустите для отправки</div>
</div>

<input type="file" id="file-input" accept="image/*,video/*" style="display:none" onchange="onFileSelected(event)">
<input type="file" id="avatar-input" accept="image/*" style="display:none" onchange="onAvatarSelected(event)">

</div>

<script>
const firebaseConfig = {

const CRYPTO = {
  async genKeyPair() {
    return await window.crypto.subtle.generateKey(
      { name: 'ECDH', namedCurve: 'P-384' },
      true, ['deriveKey']
    );
  },
  async exportPub(key) {
    const buf = await window.crypto.subtle.exportKey('spki', key);
    return btoa(String.fromCharCode(...new Uint8Array(buf)));
  },
  async importPub(b64) {
    const buf = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    return await window.crypto.subtle.importKey('spki', buf, { name: 'ECDH', namedCurve: 'P-384' }, false, []);
  },
  async deriveShared(priv, pub) {
    return await window.crypto.subtle.deriveKey(
      { name: 'ECDH', public: pub },
      priv,
      { name: 'AES-GCM', length: 256 },
      false, ['encrypt', 'decrypt']
    );
  },
  async encrypt(data, key) {
    const iv = window.crypto.getRandomValues(new Uint8Array(12));
    const enc = await window.crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, data);
    const combined = new Uint8Array(iv.length + enc.byteLength);
    combined.set(iv);
    combined.set(new Uint8Array(enc), iv.length);
    return btoa(String.fromCharCode(...combined));
  },
  async decrypt(b64, key) {
    const buf = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const iv = buf.slice(0, 12);
    const data = buf.slice(12);
    return await window.crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
  },
  async genRatchetKey() {
    return await window.crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
  },
  async exportKey(key) {
    const buf = await window.crypto.subtle.exportKey('raw', key);
    return btoa(String.fromCharCode(...new Uint8Array(buf)));
  },
  async importKey(b64) {
    const buf = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    return await window.crypto.subtle.importKey('raw', buf, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  },
  async hash(data) {
    const buf = new TextEncoder().encode(data);
    const hash = await window.crypto.subtle.digest('SHA-256', buf);
    return btoa(String.fromCharCode(...new Uint8Array(hash)));
  }
};

const KEYS = {
  async initKeys() {
    const pair = await CRYPTO.genKeyPair();
    const pub = await CRYPTO.exportPub(pair.publicKey);
    localStorage.setItem('ec_pub', pub);
    localStorage.setItem('ec_created', Date.now().toString());
    await this.storePriv(pair.privateKey);
    return pub;
  },
  async storePriv(key) {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('msgKeys', 1);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('keys')) db.createObjectStore('keys');
      };
      req.onsuccess = e => {
        const idb = e.target.result;
        const tx = idb.transaction('keys', 'readwrite');
        const store = tx.objectStore('keys');
        store.put(key, 'ec_private');
        tx.oncomplete = resolve;
      };
      req.onerror = reject;
    });
  },
  async getPriv() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('msgKeys', 1);
      req.onsuccess = e => {
        const idb = e.target.result;
        const tx = idb.transaction('keys', 'readonly');
        const store = tx.objectStore('keys');
        const getReq = store.get('ec_private');
        getReq.onsuccess = () => resolve(getReq.result);
        getReq.onerror = reject;
      };
      req.onerror = reject;
    });
  },
  async getPub() {
    return localStorage.getItem('ec_pub');
  },
  async getChatKey(chatId) {
    const raw = localStorage.getItem('chat_key_' + chatId);
    if (!raw) return null;
    return await CRYPTO.importKey(raw);
  },
  async setChatKey(chatId, key) {
    const exported = await CRYPTO.exportKey(key);
    localStorage.setItem('chat_key_' + chatId, exported);
    localStorage.setItem('chat_key_time_' + chatId, Date.now().toString());
  },
  async rotateChatKey(chatId) {
    const newKey = await CRYPTO.genRatchetKey();
    await this.setChatKey(chatId, newKey);
    return newKey;
  },
  async getProfileKey() {
    const raw = localStorage.getItem('profile_key');
    if (!raw) {
      const key = await CRYPTO.genRatchetKey();
      const exported = await CRYPTO.exportKey(key);
      localStorage.setItem('profile_key', exported);
      localStorage.setItem('profile_key_time', Date.now().toString());
      return key;
    }
    return await CRYPTO.importKey(raw);
  },
  async checkExpiry() {
    const created = parseInt(localStorage.getItem('ec_created') || '0');
    if (Date.now() - created > 24 * 3600 * 1000) return false;
    const pkTime = parseInt(localStorage.getItem('profile_key_time') || '0');
    if (Date.now() - pkTime > 7 * 24 * 3600 * 1000) {
      localStorage.removeItem('profile_key');
      localStorage.removeItem('profile_key_time');
    }
    return true;
  },
  async deriveChatKey(chatId, partnerPubB64) {
    const myPriv = await this.getPriv();
    if (!myPriv) return null;
    const partnerPub = await CRYPTO.importPub(partnerPubB64);
    const shared = await CRYPTO.deriveShared(myPriv, partnerPub);
    const hash = await CRYPTO.hash(chatId + await CRYPTO.exportKey(shared));
    const seed = Uint8Array.from(atob(hash), c => c.charCodeAt(0)).slice(0, 32);
    const chatKey = await window.crypto.subtle.importKey('raw', seed, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    await this.setChatKey(chatId, chatKey);
    return chatKey;
  }
};

let calcExpr = '';
let calcResult = '';
function calcNum(n) {
  if (calcResult) { calcExpr = calcResult === '0' ? '' : calcResult; calcResult = ''; }
  if (n === '.' && calcExpr.includes('.')) return;
  calcExpr += n;
  updateCalc();
  checkSecret();
}
function calcOp(op) {
  if (calcResult) { calcExpr = calcResult; calcResult = ''; }
  if (op === '+/-') {
    if (calcExpr) {
      if (calcExpr.startsWith('-')) calcExpr = calcExpr.slice(1);
      else calcExpr = '-' + calcExpr;
    }
    updateCalc();
    return;
  }
  if (op === '%') {
    try { calcExpr = String(parseFloat(calcExpr || '0') / 100); } catch(e){}
    updateCalc();
    return;
  }
  if (!calcExpr) return;
  const last = calcExpr.trim().slice(-1);
  if ('+-*/'.includes(last)) calcExpr = calcExpr.slice(0, -1);
  calcExpr += ' ' + op + ' ';
  updateCalc();
}
function calcEq() {
  if (!calcExpr) return;
  try {
    const clean = calcExpr.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
    calcResult = String(eval(clean) || '0');
    document.getElementById('calc-history').textContent = calcExpr + ' =';
    calcExpr = calcResult;
    updateCalc();
  } catch(e) {
    calcResult = 'Error';
    updateCalc();
    setTimeout(() => { calcResult = ''; calcExpr = ''; updateCalc(); }, 1000);
  }
}
function calcClear() {
  calcExpr = ''; calcResult = '';
  document.getElementById('calc-history').textContent = '';
  updateCalc();
}
function updateCalc() {
  const display = calcResult || calcExpr || '0';
  document.getElementById('calc-input').textContent = display;
}
function checkSecret() {
  if (calcExpr === '993') {
    calcExpr = ''; calcResult = '';
    document.getElementById('calc-history').textContent = '';
    updateCalc();
    showAuth();
  }
}

function loadChats() {
  if (chatsListener) chatsListener.off();
  if (!currentUser) return;
  const list = document.getElementById('chats-list');
  list.innerHTML = '';
  chatsListener = db.ref('chats/' + currentUser.uid);
  chatsListener.on('value', async snap => {
    list.innerHTML = '';
    const chats = snap.val() || {};
    const chatIds = Object.keys(chats).sort((a, b) => (chats[b].lastMsgTime || 0) - (chats[a].lastMsgTime || 0));
    for (const chatId of chatIds) {
      const chatData = chats[chatId];
      const partnerUid = chatData.partner;
      let profile = chatProfiles[partnerUid];
      if (!profile) {
        const pSnap = await db.ref('users/' + partnerUid).once('value');
        profile = pSnap.val() || { name: 'Пользователь', avatar: '' };
        chatProfiles[partnerUid] = profile;
      }
      const msgSnap = await db.ref('messages/' + chatId).orderByKey().limitToLast(1).once('value');
      const msgs = msgSnap.val() || {};
      const lastMsg = Object.values(msgs)[0];
      const unreadSnap = await db.ref('messages/' + chatId).orderByChild('read').equalTo(false).once('value');
      const allMsgs = unreadSnap.val() || {};
      let unreadCount = 0;
      Object.values(allMsgs).forEach(m => { if (m.sender !== currentUser.uid && !m.read) unreadCount++; });
      const onlineSnap = await db.ref('users/' + partnerUid + '/online').once('value');
      const isOnline = onlineSnap.val();
      const typingSnap = await db.ref('typing/' + chatId + '/' + partnerUid).once('value');
      const isTypingNow = typingSnap.val();
      let preview = '';
      if (lastMsg) {
        if (lastMsg.deleted) preview = 'Сообщение удалено';
        else if (lastMsg.type === 'text') {
          try {
            const key = await KEYS.getChatKey(chatId);
            if (key) {
              const dec = await CRYPTO.decrypt(lastMsg.text, key);
              preview = new TextDecoder().decode(dec);
            } else preview = '...';
          } catch(e) { preview = '...'; }
        } else if (lastMsg.type === 'image') preview = 'Фото';
        else if (lastMsg.type === 'video') preview = 'Видео';
        else if (lastMsg.type === 'voice') preview = 'Голосовое';
        else if (lastMsg.type === 'circle') preview = 'Кружочек';
      }
      const time = lastMsg ? formatTime(lastMsg.timestamp) : '';
      const item = document.createElement('div');
      item.className = 'chat-item';
      item.onclick = () => showChat(chatId, partnerUid);
      let statusHtml = '';
      if (isTypingNow) statusHtml = '<div class="chat-typing">печатает...</div>';
      else if (isOnline) statusHtml = '<div class="chat-status">в сети</div>';
      item.innerHTML = '<img class="chat-avatar" src="' + (profile.avatar || '') + '" alt="" onerror="this.style.display=\'none\'">' +
        '<div class="chat-info"><div class="chat-top"><div class="chat-name">' + escapeHtml(profile.name || 'Пользователь') + '</div>' +
        '<div class="chat-time">' + time + '</div></div><div class="chat-bottom"><div class="chat-preview">' +
        (lastMsg && lastMsg.sender === currentUser.uid ? 'Вы: ' : '') + escapeHtml(preview) + '</div>' +
        (unreadCount > 0 ? '<div class="chat-unread">' + unreadCount + '</div>' : '') + statusHtml + '</div></div>';
      list.appendChild(item);
    }
  });
}

async function renderMessage(msgId, msg) {
  const body = document.getElementById('msg-body');
  const isOut = msg.sender === currentUser.uid;
  const row = document.createElement('div');
  row.className = 'msg-row ' + (isOut ? 'out' : 'in');
  row.setAttribute('data-msgid', msgId);
  row.oncontextmenu = (e) => { e.preventDefault(); openDeleteModal(msgId); };
  row.ontouchstart = (e) => {
    let timer = setTimeout(() => { openDeleteModal(msgId); }, 600);
    const clear = () => { clearTimeout(timer); document.removeEventListener('touchend', clear); };
    document.addEventListener('touchend', clear);
  };
  let content = '';
  if (msg.deleted) {
    content = '<div class="msg-deleted">Сообщение удалено</div>';
  } else {
    const key = await KEYS.getChatKey(currentChatId);
    if (msg.type === 'text') {
      try {
        if (key) {
          const dec = await CRYPTO.decrypt(msg.text, key);
          const text = new TextDecoder().decode(dec);
          content = escapeHtml(text);
        } else content = '[зашифровано]';
      } catch(e) { content = '[ошибка расшифровки]'; }
    } else if (msg.type === 'image') {
      try {
        if (key) {
          const dec = await CRYPTO.decrypt(msg.text, key);
          const b64 = new TextDecoder().decode(dec);
          content = '<img src="' + b64 + '" alt="" onclick="this.requestFullscreen&&this.requestFullscreen()">';
        } else content = '[зашифровано]';
      } catch(e) { content = '[ошибка]'; }
    } else if (msg.type === 'video') {
      try {
        if (key) {
          const dec = await CRYPTO.decrypt(msg.text, key);
          const b64 = new TextDecoder().decode(dec);
          content = '<video src="' + b64 + '" controls preload="metadata" style="max-width:220px;border-radius:12px;"></video>';
        } else content = '[зашифровано]';
      } catch(e) { content = '[ошибка]'; }
    } else if (msg.type === 'voice') {
      try {
        if (key) {
          const dec = await CRYPTO.decrypt(msg.text, key);
          const b64 = new TextDecoder().decode(dec);
          const dur = msg.duration || 0;
          const min = Math.floor(dur / 60);
          const sec = String(dur % 60).padStart(2, '0');
          content = '<div class="msg-voice"><audio src="' + b64 + '" controls style="max-width:180px;"></audio><span>' + min + ':' + sec + '</span></div>';
        } else content = '[зашифровано]';
      } catch(e) { content = '[ошибка]'; }
    } else if (msg.type === 'circle') {
      try {
        if (key) {
          const dec = await CRYPTO.decrypt(msg.text, key);
          const b64 = new TextDecoder().decode(dec);
          content = '<video src="' + b64 + '" controls preload="metadata" class="msg-circle"></video>';
        } else content = '[зашифровано]';
      } catch(e) { content = '[ошибка]'; }
    }
  }
  const time = formatTime(msg.timestamp);
  let checks = '';
  if (isOut) {
    checks = msg.read ? '<span class="msg-checks read">&#10003;&#10003;</span>' : '<span class="msg-checks">&#10003;</span>';
  }
  row.innerHTML = '<div class="msg-bubble">' + content + '</div><div class="msg-meta"><span class="msg-time">' + time + '</span>' + checks + '</div>';
  body.appendChild(row);
}

function scrollToBottom() {
  const body = document.getElementById('msg-body');
  body.scrollTop = body.scrollHeight;
}

async function ensureChatKey() {
  let key = await KEYS.getChatKey(currentChatId);
  if (!key) {
    const snap = await db.ref('chat_keys/' + currentChatId + '/' + currentChatPartner).once('value');
    const partnerPub = snap.val();
    if (partnerPub) {
      key = await KEYS.deriveChatKey(currentChatId, partnerPub);
    }
  }
  if (!key) {
    key = await CRYPTO.genRatchetKey();
    await KEYS.setChatKey(currentChatId, key);
  }
  return key;
}

async function sendText() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || !currentChatId || !currentUser) return;
  input.value = '';
  input.style.height = 'auto';
  const key = await ensureChatKey();
  const enc = await CRYPTO.encrypt(new TextEncoder().encode(text), key);
  const newKey = await KEYS.rotateChatKey(currentChatId);
  const msgRef = db.ref('messages/' + currentChatId).push();
  await msgRef.set({
    sender: currentUser.uid,
    text: enc,
    type: 'text',
    timestamp: Date.now(),
    read: false
  });
  await db.ref('chats/' + currentUser.uid + '/' + currentChatId).update({ lastMsgTime: Date.now() });
  await db.ref('chats/' + currentChatPartner + '/' + currentChatId).update({ lastMsgTime: Date.now() });
  startAutoDelete(msgRef.key);
}

async function sendMedia(type, b64, extra) {
  if (!currentChatId || !currentUser) return;
  const key = await ensureChatKey();
  const enc = await CRYPTO.encrypt(new TextEncoder().encode(b64), key);
  const newKey = await KEYS.rotateChatKey(currentChatId);
  const data = {
    sender: currentUser.uid,
    text: enc,
    type: type,
    timestamp: Date.now(),
    read: false
  };
  if (extra) Object.assign(data, extra);
  const msgRef = db.ref('messages/' + currentChatId).push();
  await msgRef.set(data);
  await db.ref('chats/' + currentUser.uid + '/' + currentChatId).update({ lastMsgTime: Date.now() });
  await db.ref('chats/' + currentChatPartner + '/' + currentChatId).update({ lastMsgTime: Date.now() });
  startAutoDelete(msgRef.key);
}

function pickFile() {
  document.getElementById('file-input').click();
}
async function onFileSelected(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async ev => {
    const b64 = ev.target.result;
    const type = file.type.startsWith('video') ? 'video' : 'image';
    await sendMedia(type, b64);
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

function onTyping() {
  if (!currentChatId || !currentUser) return;
  if (!isTyping) {
    isTyping = true;
    db.ref('typing/' + currentChatId + '/' + currentUser.uid).set(true);
  }
  clearTimeout(typingTimer);
  typingTimer = setTimeout(() => {
    isTyping = false;
    db.ref('typing/' + currentChatId + '/' + currentUser.uid).set(false);
  }, 1500);
}

async function markRead() {
  if (!currentChatId || !currentUser) return;
  const snap = await db.ref('messages/' + currentChatId).orderByChild('read').equalTo(false).once('value');
  const msgs = snap.val() || {};
  for (const [id, msg] of Object.entries(msgs)) {
    if (msg.sender !== currentUser.uid) {
      await db.ref('messages/' + currentChatId + '/' + id + '/read').set(true);
      if (!msg.senderDeleted) {
        startAutoDelete(id);
      }
    }
  }
}

function startAutoDelete(msgId) {
  setTimeout(async () => {
    const snap = await db.ref('messages/' + currentChatId + '/' + msgId).once('value');
    const msg = snap.val();
    if (msg && msg.read && !msg.deleted) {
      await db.ref('messages/' + currentChatId + '/' + msgId).remove();
    }
  }, 10 * 60 * 1000);
}

function openDeleteModal(msgId) {
  deleteMsgId = msgId;
  document.getElementById('del-both').checked = false;
  document.getElementById('delete-modal').style.display = 'flex';
}
function closeDeleteModal() {
  document.getElementById('delete-modal').style.display = 'none';
  deleteMsgId = null;
}
async function confirmDelete() {
  if (!deleteMsgId || !currentChatId) { closeDeleteModal(); return; }
  const both = document.getElementById('del-both').checked;
  if (both) {
    await db.ref('messages/' + currentChatId + '/' + deleteMsgId).remove();
  } else {
    await db.ref('messages/' + currentChatId + '/' + deleteMsgId + '/senderDeleted').set(true);
    const existing = document.querySelector('[data-msgid="' + deleteMsgId + '"]');
    if (existing) existing.remove();
  }
  closeDeleteModal();
}

async function startVoiceRecord() {
  if (!navigator.mediaDevices) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    voiceRecorder = new MediaRecorder(stream);
    voiceChunks = [];
    voiceRecorder.ondataavailable = e => { if (e.data.size > 0) voiceChunks.push(e.data); };
    voiceRecorder.onstop = async () => {
      const blob = new Blob(voiceChunks, { type: 'audio/webm' });
      const reader = new FileReader();
      reader.onload = async ev => {
        await sendMedia('voice', ev.target.result, { duration: voiceSeconds });
      };
      reader.readAsDataURL(blob);
      stream.getTracks().forEach(t => t.stop());
    };
    voiceRecorder.start();
    voiceSeconds = 0;
    document.getElementById('voice-overlay').style.display = 'flex';
    voiceTimer = setInterval(() => {
      voiceSeconds++;
      const min = Math.floor(voiceSeconds / 60);
      const sec = String(voiceSeconds % 60).padStart(2, '0');
      document.getElementById('voice-timer').textContent = min + ':' + sec;
    }, 1000);
  } catch(e) { console.error(e); }
}
function stopVoiceRecord() {
  if (voiceRecorder && voiceRecorder.state !== 'inactive') {
    voiceRecorder.stop();
  }
  clearInterval(voiceTimer);
  document.getElementById('voice-overlay').style.display = 'none';
}

function formatTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const h = String(d.getHours()).padStart(2, '0');
  const m = String(d.getMinutes()).padStart(2, '0');
  return h + ':' + m;
}
function escapeHtml(t) {
  const d = document.createElement('div');
  d.textContent = t;
  return d.innerHTML;
}

window.onload = () => {
  setTimeout(() => {
    document.getElementById('splash').style.opacity = '0';
    setTimeout(() => document.getElementById('splash').style.display = 'none', 300);
  }, 1200);
};
</script>
