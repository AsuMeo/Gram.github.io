<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Calculator</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0d0f12">

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-main: #0b0e14;
            --bg-card: #151a23;
            --bg-card-hover: #1e2533;
            --accent: #0088cc;
            --accent-glow: rgba(0, 136, 204, 0.3);
            --accent-green: #10b981;
            --text-primary: #f1f5f9;
            --text-secondary: #8d96a0;
            --danger: #ef4444;
            --bubble-out: #1c2733;
            --bubble-in: #151e27;
            --border: #232d3b;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-main);
            color: var(--text-primary);
        }

        /* Screen Manager */
        .screen {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            flex-direction: column;
            background: var(--bg-main);
        }

        .screen.active {
            display: flex;
            z-index: 2;
        }

        /* ================= CALCULATOR UI ================= */
        #calc-screen {
            padding: calc(20px + var(--safe-top)) 20px calc(20px + var(--safe-bottom)) 20px;
            justify-content: flex-end;
            background: #000000;
        }

        .calc-display {
            width: 100%;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            word-break: break-all;
            padding: 10px;
            margin-bottom: 20px;
        }

        .calc-history {
            color: #666;
            font-size: 1.2rem;
            min-height: 24px;
        }

        .calc-main-val {
            color: #ffffff;
            font-size: 3.5rem;
            font-weight: 300;
            line-height: 1.1;
        }

        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            width: 100%;
        }

        .calc-btn {
            aspect-ratio: 1;
            border-radius: 50%;
            border: none;
            outline: none;
            font-size: 1.8rem;
            font-weight: 400;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.1s;
        }

        .calc-btn:active {
            opacity: 0.6;
        }

        .calc-btn.gray { background: #a5a5a5; color: #000; }
        .calc-btn.dark { background: #333333; color: #fff; }
        .calc-btn.orange { background: #ff9f0a; color: #fff; }
        .calc-btn.zero {
            grid-column: span 2;
            aspect-ratio: auto;
            border-radius: 40px;
            padding-left: 28px;
            justify-content: flex-start;
        }

        /* ================= AUTH UI ================= */
        #auth-screen {
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #090d14 0%, #151d2a 100%);
        }

        .auth-card {
            width: 100%;
            max-width: 360px;
            background: rgba(21, 26, 35, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 30px 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .auth-title {
            text-align: center;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
            color: #fff;
        }

        .auth-subtitle {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: -12px;
            margin-bottom: 10px;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-group i {
            position: absolute;
            left: 16px;
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .auth-input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .auth-input:focus {
            border-color: var(--accent);
        }

        .auth-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--accent-glow);
            transition: transform 0.1s, opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .auth-btn:active {
            transform: scale(0.98);
        }

        .auth-toggle {
            text-align: center;
            font-size: 0.9rem;
            color: var(--accent);
            cursor: pointer;
            margin-top: 6px;
        }

        /* ================= MESSENGER MAIN ================= */
        .app-header {
            padding: calc(12px + var(--safe-top)) 16px 12px 16px;
            background: rgba(15, 20, 28, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        .app-header h1 {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.2rem;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .icon-btn:active {
            background: var(--bg-card-hover);
        }

        /* Chat List Screen */
        .chat-list {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            gap: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            cursor: pointer;
        }

        .chat-item:active {
            background: var(--bg-card-hover);
        }

        .avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #2a3544;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            position: relative;
            object-fit: cover;
            flex-shrink: 0;
        }

        .online-dot {
            width: 13px;
            height: 13px;
            background: var(--accent-green);
            border: 2px solid var(--bg-main);
            border-radius: 50%;
            position: absolute;
            bottom: 1px;
            right: 1px;
            display: none;
        }

        .online-dot.visible {
            display: block;
        }

        .chat-info {
            flex: 1;
            min-width: 0;
        }

        .chat-top-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 4px;
        }

        .chat-name {
            font-weight: 600;
            font-size: 1.05rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-time {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .chat-bottom-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-last-msg {
            font-size: 0.9rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .typing-text {
            color: var(--accent);
            font-style: italic;
        }

        /* Float Action Button */
        .fab {
            position: fixed;
            bottom: calc(24px + var(--safe-bottom));
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 28px;
            background: var(--accent);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            box-shadow: 0 6px 20px var(--accent-glow);
            cursor: pointer;
            z-index: 20;
        }

        /* ================= CONVERSATION VIEW ================= */
        #chat-screen {
            background: #090c10;
        }

        .chat-header-user {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .chat-header-info {
            display: flex;
            flex-direction: column;
        }

        .chat-header-title {
            font-weight: 600;
            font-size: 1.05rem;
        }

        .chat-header-status {
            font-size: 0.78rem;
            color: var(--text-secondary);
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            -webkit-overflow-scrolling: touch;
        }

        .msg-bubble {
            max-width: 82%;
            padding: 8px 12px 6px 12px;
            border-radius: 16px;
            position: relative;
            word-wrap: break-word;
            font-size: 0.95rem;
            line-height: 1.35;
            animation: fadeIn 0.15s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-bubble.out {
            align-self: flex-end;
            background: var(--bubble-out);
            border-bottom-right-radius: 4px;
        }

        .msg-bubble.in {
            align-self: flex-start;
            background: var(--bubble-in);
            border-bottom-left-radius: 4px;
        }

        .msg-meta {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
            font-size: 0.68rem;
            color: var(--text-secondary);
            margin-top: 4px;
            float: right;
            margin-left: 10px;
        }

        .msg-media-img, .msg-media-video {
            max-width: 100%;
            border-radius: 12px;
            display: block;
            margin-top: 4px;
            max-height: 280px;
            object-fit: cover;
        }

        /* Roundel / Video Note Circle */
        .msg-roundel {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            overflow: hidden;
            object-fit: cover;
            border: 2px solid var(--accent);
            background: #000;
            display: block;
            margin: 4px 0;
        }

        .msg-audio-player {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 0;
            width: 220px;
        }

        .play-audio-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* Input Bar */
        .chat-input-bar {
            padding: 8px 12px calc(8px + var(--safe-bottom)) 12px;
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: flex-end;
            gap: 8px;
        }

        .chat-input-wrapper {
            flex: 1;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            max-height: 120px;
        }

        .chat-textarea {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 0.98rem;
            resize: none;
            max-height: 100px;
            line-height: 1.3;
        }

        .attach-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.25rem;
            cursor: pointer;
            padding: 4px;
        }

        .send-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* ================= MODALS & OVERLAYS ================= */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 320px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-title {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-text {
            background: none;
            border: none;
            color: var(--accent);
            font-weight: 600;
            padding: 8px 12px;
            cursor: pointer;
        }

        .btn-danger {
            color: var(--danger);
        }

        /* Attachment Options Modal / Drawer */
        .attach-drawer {
            position: fixed;
            bottom: -100%;
            left: 0;
            right: 0;
            background: var(--bg-card);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 20px calc(20px + var(--safe-bottom));
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            z-index: 90;
            transition: bottom 0.3s ease;
            border-top: 1px solid var(--border);
        }

        .attach-drawer.active {
            bottom: 0;
        }

        .attach-opt {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .attach-icon-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: #fff;
        }

        /* Camera / Video Roundel Recording Overlay */
        #roundel-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 150;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        #roundel-overlay.active {
            display: flex;
        }

        .roundel-preview-wrapper {
            width: 260px;
            height: 260px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid var(--accent);
            position: relative;
            background: #000;
        }

        .roundel-preview-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        .roundel-timer {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--danger);
        }

        .roundel-controls {
            display: flex;
            gap: 20px;
        }

        .roundel-rec-btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--danger);
            border: 4px solid #fff;
            cursor: pointer;
        }

        /* Audio Voice Record Overlay */
        #voice-overlay {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 90px;
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            z-index: 80;
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        #voice-overlay.active {
            display: flex;
        }

        .voice-rec-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--danger);
            font-weight: 600;
        }

        .rec-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--danger);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        /* Profile Modal */
        .profile-avatar-upload {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            margin: 0 auto;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            background: #2a3544;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }

        .profile-avatar-upload img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-avatar-upload .overlay-icon {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.4rem;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .profile-avatar-upload:hover .overlay-icon {
            opacity: 1;
        }

        /* Checkbox styling */
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            color: var(--text-primary);
            cursor: pointer;
        }

        .checkbox-container input {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
        }
    </style>
</head>
<body>

    <!-- SCREEN 1: CALCULATOR -->
    <div id="calc-screen" class="screen active">
        <div class="calc-display">
            <div class="calc-history" id="calc-hist"></div>
            <div class="calc-main-val" id="calc-val">0</div>
        </div>
        <div class="calc-grid">
            <button class="calc-btn gray" onclick="calcAction('C')">AC</button>
            <button class="calc-btn gray" onclick="calcAction('+/-')">±</button>
            <button class="calc-btn gray" onclick="calcAction('%')">%</button>
            <button class="calc-btn orange" onclick="calcAction('÷')">÷</button>

            <button class="calc-btn dark" onclick="calcNum('7')">7</button>
            <button class="calc-btn dark" onclick="calcNum('8')">8</button>
            <button class="calc-btn dark" onclick="calcNum('9')">9</button>
            <button class="calc-btn orange" onclick="calcAction('×')">×</button>

            <button class="calc-btn dark" onclick="calcNum('4')">4</button>
            <button class="calc-btn dark" onclick="calcNum('5')">5</button>
            <button class="calc-btn dark" onclick="calcNum('6')">6</button>
            <button class="calc-btn orange" onclick="calcAction('-')">-</button>

            <button class="calc-btn dark" onclick="calcNum('1')">1</button>
            <button class="calc-btn dark" onclick="calcNum('2')">2</button>
            <button class="calc-btn dark" onclick="calcNum('3')">3</button>
            <button class="calc-btn orange" onclick="calcAction('+')">+</button>

            <button class="calc-btn dark zero" onclick="calcNum('0')">0</button>
            <button class="calc-btn dark" onclick="calcNum('.')">.</button>
            <button class="calc-btn orange" onclick="calcAction('=')">=</button>
        </div>
    </div>

    <!-- SCREEN 2: AUTH (REGISTER / LOGIN) -->
    <div id="auth-screen" class="screen">
        <div class="auth-card">
            <div class="auth-title" id="auth-title">Вход</div>
            <div class="auth-subtitle">Скрытный мессенджер с E2E шифрованием</div>

            <div class="input-group">
                <i class="fa-solid fa-at"></i>
                <input type="text" id="auth-username" class="auth-input" placeholder="Юзернейм (без @)" autocomplete="off">
            </div>

            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="auth-password" class="auth-input" placeholder="Пароль">
            </div>

            <button class="auth-btn" id="auth-submit-btn" onclick="handleAuthSubmit()">
                <span>Войти</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>

            <div class="auth-toggle" id="auth-toggle-btn" onclick="toggleAuthMode()">
                Нет аккаунта? Зарегистрироваться
            </div>
        </div>
    </div>

    <!-- SCREEN 3: CHATS LIST -->
    <div id="chats-screen" class="screen">
        <div class="app-header">
            <h1 id="my-profile-name">Чаты</h1>
            <div class="header-actions">
                <button class="icon-btn" onclick="openProfileModal()"><i class="fa-solid fa-user-gear"></i></button>
                <button class="icon-btn" onclick="lockApp()"><i class="fa-solid fa-lock"></i></button>
            </div>
        </div>

        <div class="chat-list" id="chat-list-container">
            <!-- Chats rendered dynamically -->
        </div>

        <div class="fab" onclick="openNewChatModal()">
            <i class="fa-solid fa-message"></i>
        </div>
    </div>

    <!-- SCREEN 4: CONVERSATION -->
    <div id="chat-screen" class="screen">
        <div class="app-header">
            <button class="icon-btn" onclick="backToChats()"><i class="fa-solid fa-arrow-left"></i></button>
            <div class="chat-header-user">
                <img id="chat-peer-avatar" class="avatar" src="" alt="" style="display:none;">
                <div id="chat-peer-avatar-fallback" class="avatar">?</div>
                <div class="chat-header-info">
                    <div class="chat-header-title" id="chat-peer-username">User</div>

        function calcAction(op) {
            if (op === 'C') {
                calcInput = '';
            } else if (op === '=') {
                checkSecretCode();
                try {
                    let sanitized = calcInput.replace(/×/g, '*').replace(/÷/g, '/');
                    calcInput = String(eval(sanitized) || '');
                } catch (e) {
                    calcInput = 'Error';
                }
            } else if (op === '+/-') {
                if (calcInput.startsWith('-')) calcInput = calcInput.substring(1);
                else calcInput = '-' + calcInput;
            } else {
                calcInput += op;
            }
            updateCalcDisplay();
            checkSecretCode();
        }

        function updateCalcDisplay() {

        /* ================= CRYPTO ENGINE (WebCrypto RSA + AES-GCM) ================= */
        // Utility: ArrayBuffer <-> Base64
        function arrayBufferToBase64(buffer) {
            let binary = '';
            let bytes = new Uint8Array(buffer);
            let len = bytes.byteLength;
            for (let i = 0; i < len; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return window.btoa(binary);
        }

        function base64ToArrayBuffer(base64) {
            let binary_string = window.atob(base64);
            let len = binary_string.length;
            let bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binary_string.charCodeAt(i);
            }
            return bytes.buffer;
        }

        // Generate RSA-OAEP Key Pair
        async function generateRsaKeyPair() {
            return await window.crypto.subtle.generateKey(
                {
                    name: "RSA-OAEP",
                    modulusLength: 2048,
                    publicExponent: new Uint8Array([1, 0, 1]),
                    hash: "SHA-256"
                },
                true,
                ["encrypt", "decrypt"]
            );
        }

        // Export Public Key to JWK Base64 String
        async function exportPublicKey(key) {
            const jwk = await window.crypto.subtle.exportKey("jwk", key);
            return btoa(JSON.stringify(jwk));
        }

        // Import Public Key from JWK Base64 String
        async function importPublicKey(jwkBase64) {
            const jwk = JSON.parse(atob(jwkBase64));
            return await window.crypto.subtle.importKey(
                "jwk",
                jwk,
                { name: "RSA-OAEP", hash: "SHA-256" },
                true,
                ["encrypt"]
            );
        }

        // Export Private Key
        async function exportPrivateKey(key) {
            const jwk = await window.crypto.subtle.exportKey("jwk", key);
            return JSON.stringify(jwk);
        }

        // Import Private Key
        async function importPrivateKey(jwkJson) {
            const jwk = JSON.parse(jwkJson);
            return await window.crypto.subtle.importKey(
                "jwk",
                jwk,
                { name: "RSA-OAEP", hash: "SHA-256" },
                true,
                ["decrypt"]
            );
        }

        // Hybrid Encryption: RSA-OAEP + AES-GCM 256
        async function encryptData(dataString, recipientPublicKeyJwk, senderPublicKeyJwk) {
            // Generate random AES key
            const aesKey = await window.crypto.subtle.generateKey(
                { name: "AES-GCM", length: 256 },
                true,
                ["encrypt", "decrypt"]
            );

            // Encrypt data string
            const enc = new TextEncoder();
            const iv = window.crypto.getRandomValues(new Uint8Array(12));
            const ciphertextBuffer = await window.crypto.subtle.encrypt(
                { name: "AES-GCM", iv: iv },
                aesKey,
                enc.encode(dataString)
            );

            // Export AES raw key
            const rawAesKey = await window.crypto.subtle.exportKey("raw", aesKey);

            // Encrypt AES key for recipient
            const recipientPubKey = await importPublicKey(recipientPublicKeyJwk);
            const encAesKeyRecipient = await window.crypto.subtle.encrypt(
                { name: "RSA-OAEP" },
                recipientPubKey,
                rawAesKey
            );

            // Encrypt AES key for sender (so sender can re-decrypt own messages)
            const senderPubKey = await importPublicKey(senderPublicKeyJwk);
            const encAesKeySender = await window.crypto.subtle.encrypt(
                { name: "RSA-OAEP" },
                senderPubKey,
                rawAesKey
            );

            return {
                cipher: arrayBufferToBase64(ciphertextBuffer),
                iv: arrayBufferToBase64(iv),
                keyForRecipient: arrayBufferToBase64(encAesKeyRecipient),
                keyForSender: arrayBufferToBase64(encAesKeySender)
            };
        }

        // Hybrid Decryption
        async function decryptData(encryptedPayload, myPrivateKey, isSender) {
            try {
                const encAesKeyBase64 = isSender ? encryptedPayload.keyForSender : encryptedPayload.keyForRecipient;
                const encAesKeyBuffer = base64ToArrayBuffer(encAesKeyBase64);

                // Decrypt AES key with RSA Private Key
                const rawAesKey = await window.crypto.subtle.decrypt(
                    { name: "RSA-OAEP" },
                    myPrivateKey,
                    encAesKeyBuffer
                );

                // Import AES key
                const aesKey = await window.crypto.subtle.importKey(
                    "raw",
                    rawAesKey,
                    "AES-GCM",
                    true,
                    ["decrypt"]
                );

                // Decrypt Ciphertext
                const iv = base64ToArrayBuffer(encryptedPayload.iv);
                const cipherBuffer = base64ToArrayBuffer(encryptedPayload.cipher);

                const decryptedBuffer = await window.crypto.subtle.decrypt(
                    { name: "AES-GCM", iv: iv },
                    aesKey,
                    cipherBuffer
                );

                const dec = new TextDecoder();
                return dec.decode(decryptedBuffer);
            } catch (e) {
                console.error("Decryption failed:", e);
                return "[Не удалось расшифровать сообщение]";
            }
        }

        /* 24-hour / 7-day Key Management Engine */
        async function setupUserKeys() {
            const now = Date.now();

            // 1. Message Key (24h)
            const msgKeyTimestamp = localStorage.getItem('msg_key_time_' + currentUser.uid);
            let msgPrivateKeyJwk = localStorage.getItem('msg_priv_key_' + currentUser.uid);
            let msgPublicKeyJwk = localStorage.getItem('msg_pub_key_' + currentUser.uid);

            if (!msgKeyTimestamp || (now - parseInt(msgKeyTimestamp)) > 24 * 60 * 60 * 1000 || !msgPrivateKeyJwk) {
                // Key expired or missing: Generate new 24h key pair
                const kp = await generateRsaKeyPair();
                msgPublicKeyJwk = await exportPublicKey(kp.publicKey);
                msgPrivateKeyJwk = await exportPrivateKey(kp.privateKey);

                localStorage.setItem('msg_key_time_' + currentUser.uid, now.toString());
                localStorage.setItem('msg_priv_key_' + currentUser.uid, msgPrivateKeyJwk);
                localStorage.setItem('msg_pub_key_' + currentUser.uid, msgPublicKeyJwk);

                myKeyPair = kp;
                await db.ref('users/' + currentUser.uid + '/publicKey').set(msgPublicKeyJwk);
            } else {
                const privKey = await importPrivateKey(msgPrivateKeyJwk);
                myKeyPair = { privateKey: privKey, publicKeyJwk: msgPublicKeyJwk };
            }

            // 2. Profile Key (7 Days)
            const profKeyTimestamp = localStorage.getItem('prof_key_time_' + currentUser.uid);
            let profPrivateKeyJwk = localStorage.getItem('prof_priv_key_' + currentUser.uid);
            let profPublicKeyJwk = localStorage.getItem('prof_pub_key_' + currentUser.uid);

            if (!profKeyTimestamp || (now - parseInt(profKeyTimestamp)) > 7 * 24 * 60 * 60 * 1000 || !profPrivateKeyJwk) {
                const kpProf = await generateRsaKeyPair();
                profPublicKeyJwk = await exportPublicKey(kpProf.publicKey);
                profPrivateKeyJwk = await exportPrivateKey(kpProf.privateKey);

                localStorage.setItem('prof_key_time_' + currentUser.uid, now.toString());
                localStorage.setItem('prof_priv_key_' + currentUser.uid, profPrivateKeyJwk);
                localStorage.setItem('prof_pub_key_' + currentUser.uid, profPublicKeyJwk);

                myProfileKeyPair = kpProf;
                await db.ref('users/' + currentUser.uid + '/profilePublicKey').set(profPublicKeyJwk);
            } else {
                const privKeyProf = await importPrivateKey(profPrivateKeyJwk);
                myProfileKeyPair = { privateKey: privKeyProf, publicKeyJwk: profPublicKeyJwk };
            }
        }

        /* ================= AUTHENTICATION (ANONYMOUS + USERNAME MAPPING IN RTDB) ================= */

            document.getElementById('auth-submit-btn').querySelector('span').textContent = isAuthLoginMode ? 'Войти' : 'Создать аккаунт';

        async function handleAuthSubmit() {
            const usernameInput = document.getElementById('auth-username').value.trim().toLowerCase().replace('@', '');
            const passwordInput = document.getElementById('auth-password').value.trim();

            if (!usernameInput || !passwordInput) {
                alert('Заполните все поля!');
                return;
            }

            try {
                // Anonymous auth to Firebase
                const authResult = await auth.signInAnonymously();
                const uid = authResult.user.uid;

                const usernameRef = db.ref('usernames/' + usernameInput);
                const snapshot = await usernameRef.once('value');

                if (isAuthLoginMode) {
                    // LOGIN MODE
                    if (!snapshot.exists()) {
                        alert('Пользователь с таким юзернеймом не найден!');
                        return;
                    }
                    const userData = snapshot.val();
                    if (userData.password !== btoa(passwordInput)) {
                        alert('Неверный пароль!');
                        return;
                    }

                    currentUser = { uid: userData.uid, username: usernameInput };
                } else {
                    // REGISTER MODE
                    if (snapshot.exists()) {
                        alert('Данный юзернейм уже занят!');
                        return;
                    }

                    currentUser = { uid: uid, username: usernameInput };

                    // Save mapping to RTDB (Strictly RTDB)
                    await usernameRef.set({
                        uid: uid,
                        password: btoa(passwordInput),
                        created: Date.now()
                    });

                    await db.ref('users/' + uid + '/profile').set({
                        username: usernameInput,
                        avatar: ''
                    });
                }

                localStorage.setItem('stealth_user', JSON.stringify(currentUser));
                initMessengerSession();

            } catch (err) {
                alert('Ошибка авторизации: ' + err.message);
            }
        }

        /* ================= MESSENGER INITIALIZATION ================= */
        async function initMessengerSession() {

        /* ================= ONLINE & TYPING STATUS ================= */
        function setupOnlinePresence() {
            const userStatusRef = db.ref('users/' + currentUser.uid + '/status');
            const myConnectionsRef = db.ref('users/' + currentUser.uid + '/connections');

            db.ref('.info/connected').on('value', (snap) => {
                if (snap.val() === false) return;

                const con = myConnectionsRef.push();
                con.onDisconnect().remove();
                con.set(true);

                userStatusRef.onDisconnect().set({
                    online: false,
                    lastSeen: Date.now()
                });

                userStatusRef.set({
                    online: true,
                    lastSeen: Date.now()
                });
            });
        }

        function handleTyping() {
            if (!activeChatPeerUid) return;
            const typingRef = db.ref('chats/' + getChatId(currentUser.uid, activeChatPeerUid) + '/typing/' + currentUser.uid);
            typingRef.set(true);

            if (typingTimeout) clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                typingRef.set(false);
            }, 1500);
        }

        function formatTime(timestamp) {
            if (!timestamp) return '';
            const date = new Date(timestamp);
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `${hours}:${minutes}`;
        }

        /* ================= CHAT LIST ENGINE ================= */
        function loadChatsList() {
            const userChatsRef = db.ref('user_chats/' + currentUser.uid);
            userChatsRef.on('value', async (snapshot) => {
                const chatsContainer = document.getElementById('chat-list-container');
                chatsContainer.innerHTML = '';

                if (!snapshot.exists()) {
                    chatsContainer.innerHTML = `<div style="text-align:center; padding: 40px; color: var(--text-secondary);">У вас пока нет чатов.<br>Нажмите + чтобы начать.</div>`;
                    return;
                }

                const chats = snapshot.val();
                for (const peerUid in chats) {
                    renderChatItem(peerUid, chats[peerUid]);
                }
            });
        }

        async function renderChatItem(peerUid, chatData) {
            const chatsContainer = document.getElementById('chat-list-container');

            // Fetch peer profile from RTDB
            const peerSnap = await db.ref('users/' + peerUid).once('value');
            if (!peerSnap.exists()) return;

            const peerData = peerSnap.val();
            const username = peerData.profile ? peerData.profile.username : 'Пользователь';
            const avatar = peerData.profile ? peerData.profile.avatar : '';
            const isOnline = peerData.status ? peerData.status.online : false;

            let chatItemEl = document.getElementById('chat-item-' + peerUid);
            if (!chatItemEl) {
                chatItemEl = document.createElement('div');
                chatItemEl.id = 'chat-item-' + peerUid;
                chatItemEl.className = 'chat-item';
                chatsContainer.appendChild(chatItemEl);
            }

            chatItemEl.onclick = () => openChatScreen(peerUid, username, peerData.publicKey, peerData.profilePublicKey);

            let avatarHtml = avatar
                ? `<img class="avatar" src="${avatar}"><div class="online-dot ${isOnline ? 'visible' : ''}"></div>`
                : `<div class="avatar">${username.charAt(0).toUpperCase()}<div class="online-dot ${isOnline ? 'visible' : ''}"></div></div>`;

            chatItemEl.innerHTML = `
                ${avatarHtml}
                <div class="chat-info">
                    <div class="chat-top-row">
                        <div class="chat-name">@${username}</div>
                        <div class="chat-time" id="chat-time-${peerUid}">${formatTime(chatData.lastTimestamp)}</div>
                    </div>
                    <div class="chat-bottom-row">
                        <div class="chat-last-msg" id="chat-msg-${peerUid}">${chatData.lastMessage || 'Зашифрованное сообщение'}</div>
                    </div>
                </div>
            `;
        }

        /* ================= CONVERSATION / MESSAGES ================= */
        function getChatId(uid1, uid2) {
            return uid1 < uid2 ? `${uid1}_${uid2}` : `${uid2}_${uid1}`;
        }

        async function openChatScreen(peerUid, peerUsername, peerPublicKey, peerProfileKey) {
            activeChatPeerUid = peerUid;
            activeChatPeerUsername = peerUsername;
            activeChatPeerPublicKey = peerPublicKey;
            activeChatPeerProfileKey = peerProfileKey;

            document.getElementById('chat-peer-username').textContent = '@' + peerUsername;
            showScreen('chat-screen');

            // Listen to peer presence
            db.ref('users/' + peerUid + '/status').on('value', (snap) => {
                const status = snap.val();
                const statusEl = document.getElementById('chat-peer-status');
                if (status && status.online) {
                    statusEl.textContent = 'в сети';
                    statusEl.style.color = 'var(--accent-green)';
                } else if (status && status.lastSeen) {
                    statusEl.textContent = 'был(а) в ' + formatTime(status.lastSeen);
                    statusEl.style.color = 'var(--text-secondary)';
                } else {
                    statusEl.textContent = 'офлайн';
                    statusEl.style.color = 'var(--text-secondary)';
                }
            });

            // Listen to peer typing
            const chatId = getChatId(currentUser.uid, peerUid);
            db.ref('chats/' + chatId + '/typing/' + peerUid).on('value', (snap) => {
                if (snap.val() === true) {
                    document.getElementById('chat-peer-status').textContent = 'печатает...';
                    document.getElementById('chat-peer-status').style.color = 'var(--accent)';
                }
            });

            // Listen to messages in RTDB
            const messagesRef = db.ref('chats/' + chatId + '/messages');
            messagesRef.off(); // reset listener
            messagesRef.on('value', async (snap) => {
                const container = document.getElementById('messages-container');
                container.innerHTML = '';

                if (!snap.exists()) return;

                const messagesObj = snap.val();
                for (const msgId in messagesObj) {
                    const msg = messagesObj[msgId];
                    await renderMessage(msgId, msg);
                }
                container.scrollTop = container.scrollHeight;
            });
        }

        async function renderMessage(msgId, msg) {
            const container = document.getElementById('messages-container');
            const isOut = msg.sender === currentUser.uid;

            const msgEl = document.createElement('div');
            msgEl.className = `msg-bubble ${isOut ? 'out' : 'in'}`;
            msgEl.id = 'msg-' + msgId;

            // Decrypt message content
            let contentHtml = '';
            try {
                const decryptedStr = await decryptData(msg.encryptedPayload, myKeyPair.privateKey, isOut);

                if (msg.type === 'text') {
                    contentHtml = `<div>${escapeHtml(decryptedStr)}</div>`;
                } else if (msg.type === 'image') {
                    contentHtml = `<img src="${decryptedStr}" class="msg-media-img">`;
                } else if (msg.type === 'video') {
                    contentHtml = `<video src="${decryptedStr}" controls class="msg-media-video"></video>`;
                } else if (msg.type === 'audio') {
                    contentHtml = `
                        <div class="msg-audio-player">
                            <button class="play-audio-btn" onclick="playAudio('${msgId}', '${decryptedStr}')"><i class="fa-solid fa-play"></i></button>
                            <span style="font-size: 0.85rem;">Голосовое сообщение</span>
                        </div>`;
                } else if (msg.type === 'roundel') {
                    contentHtml = `<video src="${decryptedStr}" autoplay loop muted playsinline class="msg-roundel"></video>`;
                }
            } catch (e) {
                contentHtml = `<div style="color:red;">[Ошибка расшифровки]</div>`;
            }

            msgEl.innerHTML = `
                ${contentHtml}
                <div class="msg-meta">
                    <span>${formatTime(msg.timestamp)}</span>
                    ${isOut ? '<i class="fa-solid fa-check"></i>' : ''}
                </div>
            `;

            // Long press or click for deletion options
            msgEl.oncontextmenu = (e) => {
                e.preventDefault();
                targetMsgToDeleteId = msgId;
                openModal('delete-msg-modal');
            };

            container.appendChild(msgEl);
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        /* ================= SENDING E2EE MESSAGES ================= */
        async function sendTextMessage() {
            const inputEl = document.getElementById('msg-input');
            const text = inputEl.value.trim();
            if (!text || !activeChatPeerUid) return;

            inputEl.value = '';
            await sendMessagePayload(text, 'text');
        }

        async function sendMessagePayload(dataString, type) {
            if (!activeChatPeerPublicKey) {
                // Fetch fresh peer public key if not set
                const snap = await db.ref('users/' + activeChatPeerUid + '/publicKey').once('value');
                activeChatPeerPublicKey = snap.val();
            }

            if (!activeChatPeerPublicKey) {
                alert('Не удалось получить публичный ключ собеседника!');
                return;
            }

            // Perform E2E Encryption locally
            const encryptedPayload = await encryptData(dataString, activeChatPeerPublicKey, myKeyPair.publicKeyJwk);

            const chatId = getChatId(currentUser.uid, activeChatPeerUid);
            const msgRef = db.ref('chats/' + chatId + '/messages').push();

            const msgData = {
                sender: currentUser.uid,
                recipient: activeChatPeerUid,
                type: type,
                encryptedPayload: encryptedPayload,
                timestamp: Date.now()
            };

            await msgRef.set(msgData);

            // Update chat lists
            let previewText = '[Медиа]';
            if (type === 'text') previewText = dataString;
            else if (type === 'image') previewText = '📷 Фото';
            else if (type === 'video') previewText = '🎥 Видео';
            else if (type === 'audio') previewText = '🎤 Голосовое';
            else if (type === 'roundel') previewText = '🔵 Кружочек';

            const updateData = {
                lastMessage: previewText,
                lastTimestamp: Date.now()
            };

            await db.ref('user_chats/' + currentUser.uid + '/' + activeChatPeerUid).set(updateData);
            await db.ref('user_chats/' + activeChatPeerUid + '/' + currentUser.uid).set(updateData);
        }

        /* ================= DELETE MESSAGES ================= */
        async function confirmDeleteMessage() {
            if (!targetMsgToDeleteId || !activeChatPeerUid) return;

            const deleteForBoth = document.getElementById('delete-for-both-check').checked;
            const chatId = getChatId(currentUser.uid, activeChatPeerUid);

            if (deleteForBoth) {
                // Permanently remove node from RTDB
                await db.ref('chats/' + chatId + '/messages/' + targetMsgToDeleteId).remove();
            } else {
                // Remove locally from UI
                const msgEl = document.getElementById('msg-' + targetMsgToDeleteId);
                if (msgEl) msgEl.remove();
            }

            closeModal('delete-msg-modal');
            targetMsgToDeleteId = null;
        }

        /* ================= ATTACHMENTS & MEDIA RECORDING ================= */
        function toggleAttachDrawer() {
            document.getElementById('attach-drawer').classList.toggle('active');
        }

        function triggerFileInput(acceptType) {
            toggleAttachDrawer();
            const input = document.getElementById('hidden-file-input');
            input.accept = acceptType;
            input.click();
        }

        function handleFileSelected(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                const base64Str = e.target.result;
                const type = file.type.startsWith('image/') ? 'image' : 'video';
                await sendMessagePayload(base64Str, type);
            };
            reader.readAsDataURL(file);
        }

        /* Audio Recording */
        async function startVoiceRecord() {
            toggleAttachDrawer();
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                voiceRecorder = new MediaRecorder(stream);
                voiceChunks = [];

                voiceRecorder.ondataavailable = (e) => voiceChunks.push(e.data);
                voiceRecorder.start();

                document.getElementById('voice-overlay').classList.add('active');
                voiceSeconds = 0;
                voiceTimerInterval = setInterval(() => {
                    voiceSeconds++;
                    document.getElementById('voice-timer').textContent = formatRecordTimer(voiceSeconds);
                }, 1000);
            } catch (err) {
                alert('Нет доступа к микрофону!');
            }
        }

        function cancelVoiceRecord() {
            if (voiceRecorder) voiceRecorder.stop();
            clearInterval(voiceTimerInterval);
            document.getElementById('voice-overlay').classList.remove('active');
        }

        async function stopAndSendVoice() {
            if (!voiceRecorder) return;
            voiceRecorder.onstop = async () => {
                const blob = new Blob(voiceChunks, { type: 'audio/webm' });
                const reader = new FileReader();
                reader.onloadend = async () => {
                    await sendMessagePayload(reader.result, 'audio');
                };
                reader.readAsDataURL(blob);
            };
            voiceRecorder.stop();
            clearInterval(voiceTimerInterval);
            document.getElementById('voice-overlay').classList.remove('active');
        }

        function playAudio(msgId, dataUrl) {
            const audio = new Audio(dataUrl);
            audio.play();
        }

        /* Roundel (Telegram Circle Video) Recording */
        async function startRoundelRecord() {
            toggleAttachDrawer();
            try {
                roundelStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 400, height: 400 }, audio: true });
                const videoEl = document.getElementById('roundel-video-preview');
                videoEl.srcObject = roundelStream;

                document.getElementById('roundel-overlay').classList.add('active');
                document.getElementById('roundel-send-btn').style.display = 'none';
                document.getElementById('roundel-rec-btn').style.display = 'block';
            } catch (err) {
                alert('Нет доступа к камере!');
            }
        }

        function toggleRoundelRecording() {
            if (!roundelRecorder || roundelRecorder.state === 'inactive') {
                roundelChunks = [];
                roundelRecorder = new MediaRecorder(roundelStream);
                roundelRecorder.ondataavailable = (e) => roundelChunks.push(e.data);
                roundelRecorder.start();

                roundelSeconds = 0;
                roundelTimerInterval = setInterval(() => {
                    roundelSeconds++;
                    document.getElementById('roundel-timer').textContent = formatRecordTimer(roundelSeconds);
                }, 1000);

                document.getElementById('roundel-rec-btn').style.background = 'var(--accent)';
                document.getElementById('roundel-send-btn').style.display = 'flex';
            }
        }

        function cancelRoundelRecord() {
            if (roundelStream) {
                roundelStream.getTracks().forEach(t => t.stop());
            }
            clearInterval(roundelTimerInterval);
            document.getElementById('roundel-overlay').classList.remove('active');
        }

        async function stopAndSendRoundel() {
            if (roundelRecorder) {
                roundelRecorder.onstop = () => {
                    const blob = new Blob(roundelChunks, { type: 'video/webm' });
                    const reader = new FileReader();
                    reader.onloadend = async () => {
                        await sendMessagePayload(reader.result, 'roundel');
                    };
                    reader.readAsDataURL(blob);
                };
                roundelRecorder.stop();
            }
            cancelRoundelRecord();
        }

        function formatRecordTimer(sec) {
            const m = String(Math.floor(sec / 60)).padStart(2, '0');
            const s = String(sec % 60).padStart(2, '0');
            return `${m}:${s}`;
        }

        /* ================= NEW CHAT & PROFILE MODALS ================= */
        function openNewChatModal() { openModal('new-chat-modal'); }
        function openProfileModal() { openModal('profile-modal'); }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        async function startNewChat() {
            const peerUsername = document.getElementById('new-chat-username').value.trim().toLowerCase().replace('@', '');
            if (!peerUsername) return;

            const snap = await db.ref('usernames/' + peerUsername).once('value');
            if (!snap.exists()) {
                alert('Пользователь не найден!');
                return;
            }

            const peerUid = snap.val().uid;
            const peerSnap = await db.ref('users/' + peerUid).once('value');
            const peerData = peerSnap.val();

            closeModal('new-chat-modal');
            openChatScreen(peerUid, peerUsername, peerData.publicKey, peerData.profilePublicKey);
        }

        function triggerProfileAvatarInput() {
            document.getElementById('profile-avatar-file-input').click();
        }

        function handleProfileAvatarSelected(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async (evt) => {
                const avatarBase64 = evt.target.result;
                await db.ref('users/' + currentUser.uid + '/profile/avatar').set(avatarBase64);
                alert('Аватар обновлен!');
            };
            reader.readAsDataURL(file);
        }

        function backToChats() {
            activeChatPeerUid = null;
            showScreen('chats-screen');
        }

        function showChatInfoOptions() {
            alert(`Чат с @${activeChatPeerUsername}\nСквозное E2E шифрование активна.`);
        }
    </script>
</body>
</html>
