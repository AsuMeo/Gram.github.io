<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Реалистичная Камера (Честный Цвет)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #fff;
        }

        #app {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #000;
        }

        /* Видоискатель */
        .viewport-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: filter 0.1s ease;
        }

        video.fit-contain {
            object-fit: contain;
        }

        /* Сетка для кадрирования */
        .grid-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            opacity: 0;
            transition: opacity 0.2s ease;
            z-index: 2;
        }

        .grid-overlay.active {
            opacity: 0.35;
        }

        .grid-cell {
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* Верхняя панель управления */
        .top-bar {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), rgba(0,0,0,0));
        }

        .status-badge {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            letter-spacing: 0.5px;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #00ff66;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff66;
        }

        .top-actions {
            display: flex;
            gap: 12px;
        }

        .btn-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(30, 30, 30, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        .btn-icon:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.3);
        }

        .btn-icon.active {
            background: #fff;
            color: #000;
        }

        .btn-icon svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        /* Нижняя панель с кнопкой спуска */
        .bottom-bar {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 20px 24px 36px 24px;
            background: linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0));
        }

        /* Кнопка съемки ВО ВЕСЬ ЭКРАН / Главная кнопка затвора */
        .shutter-btn-outer {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s ease;
            background: transparent;
        }

        .shutter-btn-outer:active {
            transform: scale(0.9);
        }

        .shutter-btn-inner {
            width: 66px;
            height: 66px;
            border-radius: 50%;
            background: #fff;
            transition: background 0.2s ease;
        }

        /* Галерея превью */
        .gallery-preview {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.4);
            overflow: hidden;
            background: #222;
            cursor: pointer;
            background-size: cover;
            background-position: center;
        }

        /* Панель ручных регулировок реалистичности */
        .controls-panel {
            position: absolute;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 16px 20px;
            z-index: 15;
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: none;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .controls-panel.show {
            display: flex;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #ddd;
            font-weight: 500;
        }

        .control-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #444;
            outline: none;
        }

        .control-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }

        .btn-reset {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #ff5555;
            padding: 8px;
            border-radius: 10px;
            font-size: 12px;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
        }

        /* Модальное окно просмотра снимка */
        .modal {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 100;
            display: none;
            flex-direction: column;
            justify-content: space-between;
        }

        .modal.open {
            display: flex;
        }

        .modal-header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.6);
            z-index: 10;
        }

        .modal-body {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .modal-body img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .modal-footer {
            padding: 20px;
            display: flex;
            gap: 16px;
            background: rgba(0,0,0,0.8);
        }

        .btn-action {
            flex: 1;
            padding: 14px;
            border-radius: 14px;
            border: none;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: #2979ff;
            color: #fff;
        }

        .btn-secondary {
            background: rgba(255,255,255,0.15);
            color: #fff;
        }

        /* Вспышка экрана при снимке */
        .flash-effect {
            position: absolute;
            inset: 0;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 50;
            transition: opacity 0.05s linear;
        }

        .flash-effect.active {
            opacity: 1;
        }
    </style>
</head>
<body>

<div id="app">
    <!-- Экран вспышки -->
    <div class="flash-effect" id="flash"></div>

    <!-- Область камеры -->
    <div class="viewport-container" id="viewport">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="grid-overlay" id="gridOverlay">
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        </div>
    </div>

    <!-- Верхняя панель -->
    <div class="top-bar">
        <div class="status-badge">
            <div class="status-dot"></div>
            <span id="camModeText">РЕАЛЬНЫЙ ЦВЕТ (RAW)</span>
        </div>
        <div class="top-actions">
            <!-- Кнопка Полноэкранного режима -->
            <button class="btn-icon" id="btnFullscreen" title="На весь экран">
                <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
            </button>
            <!-- Переключатель сетки -->
            <button class="btn-icon" id="btnGrid" title="Сетка">
                <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM8 20H4v-4h4v4zm0-6H4v-4h4v4zm0-6H4V4h4v4zm6 12h-4v-4h4v4zm0-6h-4v-4h4v4zm0-6h-4V4h4v4zm6 12h-4v-4h4v4zm0-6h-4v-4h4v4zm0-6h-4V4h4v4z"/></svg>
            </button>
            <!-- Настройки естественности -->
            <button class="btn-icon" id="btnSettings" title="Настройка изображения">
                <svg viewBox="0 0 24 24"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4v2h6V9h-6z"/></svg>
            </button>
            <!-- Переключение камеры -->
            <button class="btn-icon" id="btnSwitchCam" title="Переключить камеру">
                <svg viewBox="0 0 24 24"><path d="M9.37 5.51A7 7 0 0 0 4 12c0 3.87 3.13 7 7 7 2.06 0 3.92-.89 5.22-2.31l-1.42-1.42A4.98 4.98 0 0 1 11 17c-2.76 0-5-2.24-5-5 0-1.8.96-3.38 2.4-4.25l-1.41-1.41zM16 12c0-1.8-.96-3.38-2.4-4.25l1.41-1.41A7 7 0 0 1 20 12c0 3.87-3.13 7-7 7l1.41-1.41A4.98 4.98 0 0 0 16 12zM12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"/></svg>
            </button>
        </div>
    </div>

    <!-- Выдвижная панель точной подстройки цвета -->
    <div class="controls-panel" id="controlsPanel">
        <div style="font-weight: 600; font-size: 14px; color: #fff; margin-bottom: 2px;">Отключение обработок смартфона</div>
        <div style="font-size: 11px; color: #aaa;">Уберите искусственную насыщенность и контраст, чтобы получить картинку как видит глаз:</div>

        <div class="control-group">
            <div class="control-label">
                <span>Насыщенность (Убирает ядовитые цвета)</span>
                <span id="valSat">100%</span>
            </div>
            <input type="range" class="control-slider" id="sliderSat" min="50" max="130" value="100">
        </div>

        <div class="control-group">
            <div class="control-label">
                <span>Яркость (Экспозиция)</span>
                <span id="valBright">100%</span>
            </div>
            <input type="range" class="control-slider" id="sliderBright" min="70" max="140" value="100">
        </div>

        <div class="control-group">
            <div class="control-label">
                <span>Контраст (Естественность)</span>
                <span id="valContrast">100%</span>
            </div>
            <input type="range" class="control-slider" id="sliderContrast" min="70" max="130" value="100">
        </div>

        <div class="control-group">
            <div class="control-label">
                <span>Баланс белого (Теплота)</span>
                <span id="valHue">0°</span>
            </div>
            <input type="range" class="control-slider" id="sliderHue" min="-20" max="20" value="0">
        </div>

        <button class="btn-reset" id="btnResetFilters">Сбросить в идеальный ноль</button>
    </div>

    <!-- Нижняя панель управления -->
    <div class="bottom-bar">
        <!-- Миниатюра последнего фото -->
        <div class="gallery-preview" id="galleryPreview" title="Открыть фото"></div>

        <!-- Кнопка съемки (Спуск затвора) -->
        <div class="shutter-btn-outer" id="btnShutter" title="Сделать снимок">
            <div class="shutter-btn-inner"></div>
        </div>

        <!-- Масштабирование кадра: Cover / Contain -->
        <button class="btn-icon" id="btnAspect" title="Режим пропорций">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/></svg>
        </button>
    </div>
</div>

<!-- Модальное окно просмотра готового снимка -->
<div class="modal" id="photoModal">
    <div class="modal-header">
        <span style="font-weight:600; font-size: 16px;">Реалистичный снимок</span>
        <button class="btn-icon" id="btnCloseModal">
            <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
    </div>
    <div class="modal-body">
        <img id="modalImg" src="" alt="Captured Photo">
    </div>
    <div class="modal-footer">
        <button class="btn-action btn-secondary" id="btnDiscard">Удалить</button>
        <button class="btn-action btn-primary" id="btnDownload">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            Сохранить фото
        </button>
    </div>
</div>

<script>
    // Основные элементы
    const video = document.getElementById('webcam');
    const btnShutter = document.getElementById('btnShutter');
    const btnSwitchCam = document.getElementById('btnSwitchCam');
    const btnFullscreen = document.getElementById('btnFullscreen');
    const btnGrid = document.getElementById('btnGrid');
    const btnSettings = document.getElementById('btnSettings');
    const btnAspect = document.getElementById('btnAspect');
    const gridOverlay = document.getElementById('gridOverlay');
    const controlsPanel = document.getElementById('controlsPanel');
    const flash = document.getElementById('flash');

    // Модальное окно
    const photoModal = document.getElementById('photoModal');
    const modalImg = document.getElementById('modalImg');
    const btnCloseModal = document.getElementById('btnCloseModal');
    const btnDiscard = document.getElementById('btnDiscard');
    const btnDownload = document.getElementById('btnDownload');
    const galleryPreview = document.getElementById('galleryPreview');

    // Ползунки настройки
    const sliderSat = document.getElementById('sliderSat');
    const sliderBright = document.getElementById('sliderBright');
    const sliderContrast = document.getElementById('sliderContrast');
    const sliderHue = document.getElementById('sliderHue');
    const btnResetFilters = document.getElementById('btnResetFilters');

    // Состояние приложения
    let currentStream = null;
    let currentTrack = null;
    let facingMode = "environment"; // Начинаем с задней камеры
    let lastCapturedDataUrl = null;

    // Настройки фильтров CSS для имитации "сырого" глаза
    let filterValues = {
        saturate: 100,
        brightness: 100,
        contrast: 100,
        hueRotate: 0
    };

    // Запуск камеры с максимальными физическими параметрами (без софтового HDR)
    async function startCamera() {
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
        }

        const constraints = {
            audio: false,
            video: {
                facingMode: { ideal: facingMode },
                width: { ideal: 3840 },
                height: { ideal: 2160 },
                frameRate: { ideal: 60 }
            }
        };

        try {
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            currentStream = stream;
            video.srcObject = stream;
            
            currentTrack = stream.getVideoTracks()[0];

            // Отключаем софтовые экспозиции и баланс белого на устройствах, поддерживающих контрольные API
            if (currentTrack.getCapabilities) {
                const capabilities = currentTrack.getCapabilities();
                const advancedConstraints = {};

                // Просим железо отключить агрессивную постобработку, если поддерживается
                if (capabilities.whiteBalanceMode && capabilities.whiteBalanceMode.includes('continuous')) {
                    advancedConstraints.whiteBalanceMode = 'continuous';
                }
                if (capabilities.exposureMode && capabilities.exposureMode.includes('continuous')) {
                    advancedConstraints.exposureMode = 'continuous';
                }

                if (Object.keys(advancedConstraints).length > 0) {
                    try {
                        await currentTrack.applyConstraints({ advanced: [advancedConstraints] });
                    } catch(e) {
                        console.log("Дополнительные параметры камеры не поддерживаются прямо:", e);
                    }
                }
            }
        } catch (err) {
            alert("Ошибка доступа к камере! Проверьте разрешения в браузере.\n" + err.message);
        }
    }

    // Применение физических фильтров реалистичности
    function applyVideoFilters() {
        const filterStr = `saturate(${filterValues.saturate}%) brightness(${filterValues.brightness}%) contrast(${filterValues.contrast}%) hue-rotate(${filterValues.hueRotate}deg)`;
        video.style.filter = filterStr;
    }

    // Слушатели ползунков
    sliderSat.addEventListener('input', (e) => {
        filterValues.saturate = e.target.value;
        document.getElementById('valSat').innerText = filterValues.saturate + '%';
        applyVideoFilters();
    });

    sliderBright.addEventListener('input', (e) => {
        filterValues.brightness = e.target.value;
        document.getElementById('valBright').innerText = filterValues.brightness + '%';
        applyVideoFilters();
    });

    sliderContrast.addEventListener('input', (e) => {
        filterValues.contrast = e.target.value;
        document.getElementById('valContrast').innerText = filterValues.contrast + '%';
        applyVideoFilters();
    });

    sliderHue.addEventListener('input', (e) => {
        filterValues.hueRotate = e.target.value;
        document.getElementById('valHue').innerText = filterValues.hueRotate + '°';
        applyVideoFilters();
    });

    btnResetFilters.addEventListener('click', () => {
        filterValues = { saturate: 100, brightness: 100, contrast: 100, hueRotate: 0 };
        sliderSat.value = 100;
        sliderBright.value = 100;
        sliderContrast.value = 100;
        sliderHue.value = 0;
        document.getElementById('valSat').innerText = '100%';
        document.getElementById('valBright').innerText = '100%';
        document.getElementById('valContrast').innerText = '100%';
        document.getElementById('valHue').innerText = '0°';
        applyVideoFilters();
    });

    // Переключение передней / задней камеры
    btnSwitchCam.addEventListener('click', () => {
        facingMode = (facingMode === "environment") ? "user" : "environment";
        startCamera();
    });

    // Кнопка режима На Весь Экран (Fullscreen)
    btnFullscreen.addEventListener('click', () => {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                alert(`Не удалось включить полноэкранный режим: ${err.message}`);
            });
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    });

    // Переключение сетки
    btnGrid.addEventListener('click', () => {
        gridOverlay.classList.toggle('active');
        btnGrid.classList.toggle('active');
    });

    // Переключение панели настроек
    btnSettings.addEventListener('click', () => {
        controlsPanel.classList.toggle('show');
        btnSettings.classList.toggle('active');
    });

    // Переключение заполнения экрана (Fit / Cover)
    btnAspect.addEventListener('click', () => {
        video.classList.toggle('fit-contain');
        btnAspect.classList.toggle('active');
    });

    // Съемка фото без искусственных улучшайзеров
    btnShutter.addEventListener('click', takePhoto);

    function takePhoto() {
        if (!video.videoWidth) return;

        // Эффект вспышки затвора
        flash.classList.add('active');
        setTimeout(() => flash.classList.remove('active'), 100);

        // Создаем Canvas высокого разрешения
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');

        // Если камера фронтальная — отзеркаливаем для естественности
        if (facingMode === 'user') {
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
        }

        // Применяем выбранные настройки цвета к хосту съемки
        ctx.filter = `saturate(${filterValues.saturate}%) brightness(${filterValues.brightness}%) contrast(${filterValues.contrast}%) hue-rotate(${filterValues.hueRotate}deg)`;

        // Отрисовка чистого кадра
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        // Сохраняем результат
        lastCapturedDataUrl = canvas.toDataURL('image/jpeg', 0.98);

        // Обновляем превью и модальное окно
        galleryPreview.style.backgroundImage = `url(${lastCapturedDataUrl})`;
        modalImg.src = lastCapturedDataUrl;
        photoModal.classList.add('open');
    }

    // Открыть последнее фото при нажатии на превью
    galleryPreview.addEventListener('click', () => {
        if (lastCapturedDataUrl) {
            photoModal.classList.add('open');
        }
    });

    // Закрытие и удаление модалки
    function closeModal() {
        photoModal.classList.remove('open');
    }

    btnCloseModal.addEventListener('click', closeModal);
    btnDiscard.addEventListener('click', closeModal);

    // Скачивание снимка на устройство
    btnDownload.addEventListener('click', () => {
        if (!lastCapturedDataUrl) return;
        const a = document.createElement('a');
        a.href = lastCapturedDataUrl;
        a.download = `realistic_photo_${Date.now()}.jpg`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    });

    // Запуск при старте
    window.addEventListener('DOMContentLoaded', () => {
        startCamera();
    });
</script>
</body>
</html>
