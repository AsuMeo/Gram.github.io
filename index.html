<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Telegram Video Note Sender Pro</title>
    <style>
        :root {
            --bg-dark: #050508;
            --bg-surface: #0c0d12;
            --bg-input: #14161f;
            --accent: #2481cc;          
            --accent-hover: #2f94e3;
            --text-main: #f0f2f5;
            --text-muted: #70798a;
            --error: #ff4d4d;
            --success: #2ecc71;
            --border-color: #1a1d29;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            height: 100dvh;
            padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            position: relative;
        }

        #login-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #101424 0%, var(--bg-dark) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.3s ease;
        }

        .login-card {
            width: 90%;
            max-width: 380px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            padding: 32px 24px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
        }

        .login-logo {
            font-size: 56px;
            margin-bottom: 16px;
            color: var(--accent);
            display: inline-block;
        }

        .login-card h1 {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 8px;
            color: white;
        }

        .login-card p {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .login-input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: white;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .login-input:focus {
            border-color: var(--accent);
        }

        .btn {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: none;
            background: var(--accent);
            color: white;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 15px rgba(36, 129, 204, 0.3);
        }

        .btn:active { transform: scale(0.98); }
        .btn:disabled { background: #2c3245; color: #5a627a; cursor: not-allowed; box-shadow: none; }

        .error-log {
            color: var(--error);
            font-size: 13px;
            margin-top: 14px;
            background: rgba(255, 77, 77, 0.08);
            padding: 10px 12px;
            border-radius: 10px;
            display: none;
            word-break: break-all;
            text-align: left;
            border: 1px solid rgba(255, 77, 77, 0.2);
        }

        .header {
            width: 100%;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(12, 13, 18, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            z-index: 10;
        }

        .header h1 {
            font-size: 17px;
            font-weight: 700;
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .settings-btn {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .settings-btn:active { transform: scale(0.96); }

        .camera-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            position: relative;
        }

        .circle-viewport {
            width: min(290px, 72vw);
            height: min(290px, 72vw);
            border-radius: 50%;
            overflow: hidden;
            position: relative;
            background: var(--bg-surface);
            border: 4px solid var(--accent);
            box-shadow: 0 0 35px rgba(36, 129, 204, 0.25);
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .circle-viewport.recording {
            border-color: var(--error);
            box-shadow: 0 0 40px rgba(255, 77, 77, 0.4);
            animation: pulse-ring 1.5s infinite;
        }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0.5); }
            70% { box-shadow: 0 0 0 18px rgba(255, 77, 77, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0); }
        }

        #camera-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #camera-preview.back-camera {
            transform: scaleX(1);
        }

        .timer-badge {
            margin-top: 18px;
            background: rgba(20, 22, 31, 0.9);
            border: 1px solid var(--border-color);
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 1px;
        }

        .recording-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--error);
            display: none;
        }

        .recording-dot.active {
            display: block;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        .status-msg {
            margin-top: 12px;
            font-size: 13.5px;
            color: var(--text-muted);
            text-align: center;
            min-height: 20px;
            padding: 0 20px;
        }

        .status-msg.error { color: var(--error); }
        .status-msg.success { color: var(--success); }

        .controls-bar {
            width: 100%;
            padding: 24px 20px 36px 20px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            background: var(--bg-surface);
            border-top: 1px solid var(--border-color);
        }

        .action-icon-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }

        .action-icon-btn:active { transform: scale(0.92); }

        .record-main-btn {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: var(--accent);
            border: 4px solid var(--bg-surface);
            box-shadow: 0 0 0 3px var(--accent);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .record-main-btn:active { transform: scale(0.92); }

        .record-main-btn.recording {
            background: var(--error);
            box-shadow: 0 0 0 3px var(--error);
            border-radius: 22px;
        }

        /* Невидимый Canvas для обрезки ровно 1:1 под официальный кружочек Telegram */
        #recording-canvas {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Экран Авторизации -->
    <div id="login-screen">
        <div class="login-card">
            <div class="login-logo">🔵</div>
            <h1>Кружочки Telegram</h1>
            <p>Введите данные бота. Вход сохраняется в IndexedDB навсегда.</p>
            
            <div class="input-group">
                <label>BOT TOKEN</label>
                <input type="password" id="login-token-field" class="login-input" placeholder="123456789:AAH...">
            </div>

            <div class="input-group">
                <label>CHAT ID ПОЛУЧАТЕЛЯ</label>
                <input type="text" id="login-chatid-field" class="login-input" placeholder="например, 987654321">
            </div>

            <button class="btn" id="login-btn" onclick="handleLogin()">ВОЙТИ И СОХРАНИТЬ</button>
            <div id="login-error" class="error-log"></div>
        </div>
    </div>

    <!-- Главный интерфейс -->
    <div class="header">
        <h1>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
            Запись кружочка TG
        </h1>
        <button class="settings-btn" onclick="showLoginScreen()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            Сменить бота
        </button>
    </div>

    <div class="camera-container">
        <div class="circle-viewport" id="viewport-box">
            <video id="camera-preview" autoplay playsinline muted></video>
        </div>

        <div class="timer-badge">
            <div class="recording-dot" id="rec-dot"></div>
            <span id="timer-display">00:00</span>
        </div>

        <div class="status-msg" id="status-display">Нажмите синюю кнопку для записи</div>
    </div>

    <div class="controls-bar">
        <button class="action-icon-btn" onclick="toggleCameraFacing()" title="Сменить камеру">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0-4.42-3.58-8-8-8s-8 3.58-8 8c0 1.58.46 3.05 1.25 4.3L2 17l2.7-.25C6.12 18.06 8.89 19 12 19c4.42 0 8-3.58 8-8z"/><path d="M16 14l4 4-4 4"/></svg>
        </button>

        <button class="record-main-btn" id="record-btn" onclick="toggleRecording()">
            <svg id="record-icon" width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="8"/></svg>
        </button>

        <button class="action-icon-btn" onclick="cancelRecording()" title="Сбросить">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
    </div>

    <canvas id="recording-canvas" width="480" height="480"></canvas>

    <script>
        // ==========================================
        // INDEXEDDB ХРАНИЛИЩЕ ДЛЯ АВТОРИЗАЦИИ
        // ==========================================
        let dbInstance = null;

        function initIndexedDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open("VideoNoteBotDB", 1);
                request.onupgradeneeded = function(e) {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains("auth")) {
                        db.createObjectStore("auth");
                    }
                };
                request.onsuccess = function(e) {
                    dbInstance = e.target.result;
                    resolve(dbInstance);
                };
                request.onerror = function(e) {
                    reject(e);
                };
            });
        }

        function dbGet(key) {
            return new Promise((resolve) => {
                if (!dbInstance) return resolve(null);
                const tx = dbInstance.transaction(["auth"], "readonly");
                const store = tx.objectStore("auth");
                const req = store.get(key);
                req.onsuccess = () => resolve(req.result || null);
                req.onerror = () => resolve(null);
            });
        }

        function dbSet(key, val) {
            return new Promise((resolve) => {
                if (!dbInstance) return resolve();
                const tx = dbInstance.transaction(["auth"], "readwrite");
                const store = tx.objectStore("auth");
                const req = store.put(val, key);
                req.onsuccess = () => resolve();
                req.onerror = () => resolve();
            });
        }

        // ==========================================
        // ПЕРЕМЕННЫЕ И МГНОВЕННАЯ ЗАЧИСТКА КЕША
        // ==========================================
        let botToken = "";
        let targetChatId = "";

        let activeStream = null;
        let mediaRecorder = null;
        let videoChunks = [];
        let isRecording = false;
        let facingMode = 'user';
        let timerInterval = null;
        let secondsElapsed = 0;
        let animFrameId = null;

        // Полное затирание всех байтов в RAM
        function purgeVideoMemory() {
            videoChunks = [];
            if (animFrameId) {
                cancelAnimationFrame(animFrameId);
                animFrameId = null;
            }
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                try { mediaRecorder.stop(); } catch(e) {}
            }
            mediaRecorder = null;
            console.log("🔒 [Защита] Вся память кружочка уничтожена с устройства!");
        }

        setInterval(purgeVideoMemory, 3 * 60 * 1000);
        document.addEventListener('visibilitychange', () => { if (document.hidden) purgeVideoMemory(); });
        window.addEventListener('beforeunload', purgeVideoMemory);
        window.addEventListener('pagehide', purgeVideoMemory);

        // ==========================================
        // ВХОД И АВТОРИЗАЦИЯ
        // ==========================================
        window.onload = async function() {
            try {
                await initIndexedDB();
                botToken = await dbGet("bot_token") || "";
                targetChatId = await dbGet("target_chat_id") || "";

                if (botToken && targetChatId) {
                    hideLoginScreen();
                    await initCamera();
                } else {
                    showLoginScreen();
                }
            } catch(e) {
                showLoginScreen();
            }
        };

        function showLoginScreen() {
            document.getElementById('login-token-field').value = botToken;
            document.getElementById('login-chatid-field').value = targetChatId;
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('login-screen').style.opacity = '1';
        }

        function hideLoginScreen() {
            document.getElementById('login-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('login-screen').style.display = 'none';
            }, 300);
        }

        async function handleLogin() {
            const tokenInput = document.getElementById('login-token-field').value.trim();
            const chatIdInput = document.getElementById('login-chatid-field').value.trim();
            const errDiv = document.getElementById('login-error');
            const btn = document.getElementById('login-btn');

            if (!tokenInput || !chatIdInput) {
                errDiv.innerText = "Заполните Bot Token и Chat ID!";
                errDiv.style.display = "block";
                return;
            }

            errDiv.style.display = "none";
            btn.disabled = true;
            btn.innerText = "ПРОВЕРКА...";

            try {
                const res = await fetch(`https://api.telegram.org/bot${tokenInput}/getMe`);
                const data = await res.json();

                if (data.ok) {
                    botToken = tokenInput;
                    targetChatId = chatIdInput;

                    await dbSet("bot_token", botToken);
                    await dbSet("target_chat_id", targetChatId);

                    hideLoginScreen();
                    await initCamera();
                } else {
                    errDiv.innerText = ` Ошибка токена: ${data.description || 'Неверный токен'}`;
                    errDiv.style.display = "block";
                }
            } catch(e) {
                errDiv.innerText = ` Не удалось связаться с Telegram API. Проверьте сеть или токен.`;
                errDiv.style.display = "block";
            } finally {
                btn.disabled = false;
                btn.innerText = "ВОЙТИ И СОХРАНИТЬ";
            }
        }

        // ==========================================
        // КАМЕРА ПРЕВЬЮ
        // ==========================================
        async function initCamera() {
            if (activeStream) {
                activeStream.getTracks().forEach(track => track.stop());
            }

            const videoEl = document.getElementById('camera-preview');
            const constraints = {
                video: { facingMode: facingMode },
                audio: true
            };

            try {
                activeStream = await navigator.mediaDevices.getUserMedia(constraints);
                videoEl.srcObject = activeStream;

                if (facingMode === 'environment') {
                    videoEl.classList.add('back-camera');
                } else {
                    videoEl.classList.remove('back-camera');
                }
            } catch (err) {
                showStatus("Не удалось открыть камеру: " + err.message, "error");
            }
        }

        async function toggleCameraFacing() {
            if (isRecording) return;
            facingMode = (facingMode === 'user') ? 'environment' : 'user';
            await initCamera();
        }

        function getOptimalMimeType() {
            const types = [
                'video/webm;codecs=vp8,opus',
                'video/webm',
                'video/mp4'
            ];
            for (let t of types) {
                if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) {
                    return t;
                }
            }
            return '';
        }

        // ==========================================
        // ОДНОРОДНАЯ КВАДРАТНАЯ ОТРИСОВКА (1:1) ДЛЯ КРУЖОЧКОВ TG
        // ==========================================
        function drawSquareFrame() {
            const video = document.getElementById('camera-preview');
            const canvas = document.getElementById('recording-canvas');
            const ctx = canvas.getContext('2d');

            if (video && video.readyState === video.HAVE_ENOUGH_DATA) {
                const vw = video.videoWidth;
                const vh = video.videoHeight;
                const size = Math.min(vw, vh);
                const sx = (vw - size) / 2;
                const sy = (vh - size) / 2;

                ctx.save();
                if (facingMode === 'user') {
                    ctx.translate(480, 0);
                    ctx.scale(-1, 1);
                }
                ctx.drawImage(video, sx, sy, size, size, 0, 0, 480, 480);
                ctx.restore();
            }

            if (isRecording) {
                animFrameId = requestAnimationFrame(drawSquareFrame);
            }
        }

        // ==========================================
        // ЗАПИСЬ НАСТОЯЩЕГО КРУЖОЧКА С КАНВАСА (1:1)
        // ==========================================
        function toggleRecording() {
            if (!isRecording) {
                startRecording();
            } else {
                stopAndSendRecording();
            }
        }

        function startRecording() {
            if (!activeStream) {
                showStatus("Камера недоступна!", "error");
                return;
            }

            videoChunks = [];
            const canvas = document.getElementById('recording-canvas');
            
            isRecording = true;
            drawSquareFrame();

            // Создаем 1:1 квадратный видеопоток с Canvas + Микрофон
            const canvasStream = canvas.captureStream(30);
            const audioTrack = activeStream.getAudioTracks()[0];
            if (audioTrack) {
                canvasStream.addTrack(audioTrack);
            }

            const mimeType = getOptimalMimeType();
            const options = mimeType ? { mimeType: mimeType } : {};

            try {
                mediaRecorder = new MediaRecorder(canvasStream, options);
            } catch(e) {
                showStatus("Ошибка запуска записи: " + e.message, "error");
                isRecording = false;
                return;
            }

            mediaRecorder.ondataavailable = e => {
                if (e.data && e.data.size > 0) {
                    videoChunks.push(e.data);
                }
            };

            mediaRecorder.start(100);

            document.getElementById('viewport-box').classList.add('recording');
            document.getElementById('record-btn').classList.add('recording');
            document.getElementById('record-icon').innerHTML = '<rect x="6" y="6" width="12" height="12" rx="2"/>';
            document.getElementById('rec-dot').classList.add('active');
            showStatus("Запись кружочка...", "");

            secondsElapsed = 0;
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                secondsElapsed++;
                updateTimerDisplay();
                if (secondsElapsed >= 60) {
                    stopAndSendRecording();
                }
            }, 1000);
        }

        function stopAndSendRecording() {
            if (!mediaRecorder || mediaRecorder.state === 'inactive') return;

            clearInterval(timerInterval);
            document.getElementById('rec-dot').classList.remove('active');
            document.getElementById('viewport-box').classList.remove('recording');
            document.getElementById('record-btn').classList.remove('recording');
            document.getElementById('record-icon').innerHTML = '<circle cx="12" cy="12" r="8"/>';

            showStatus("Отправка кружочка в Telegram...", "");

            mediaRecorder.onstop = async () => {
                isRecording = false;

                if (videoChunks.length === 0) {
                    showStatus(" Ошибка: пустая запись.", "error");
                    purgeVideoMemory();
                    return;
                }

                const mimeType = mediaRecorder.mimeType || 'video/webm';
                const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
                const videoBlob = new Blob(videoChunks, { type: mimeType });

                try {
                    const formData = new FormData();
                    formData.append('chat_id', targetChatId);
                    // Telegram API требует строго 1:1 соотношение сторон для sendVideoNote
                    formData.append('video_note', videoBlob, `video_note.${ext}`);

                    const response = await fetch(`https://api.telegram.org/bot${botToken}/sendVideoNote`, {
                        method: 'POST',
                        body: formData
                    });

                    const data = await response.json();

                    if (data.ok) {
                        showStatus(" Кружочек успешно отправлен!", "success");
                    } else {
                        showStatus(" Ошибка Telegram API: " + (data.description || "Не удалось отправить"), "error");
                    }
                } catch (e) {
                    showStatus(" Ошибка сети при отправке.", "error");
                } finally {
                    // МГНОВЕННОЕ УНИЧТОЖЕНИЕ КЕША
                    purgeVideoMemory();
                    secondsElapsed = 0;
                    updateTimerDisplay();
                }
            };

            mediaRecorder.stop();
        }

        function cancelRecording() {
            if (isRecording) {
                clearInterval(timerInterval);
                if (mediaRecorder) mediaRecorder.stop();
                isRecording = false;
                document.getElementById('rec-dot').classList.remove('active');
                document.getElementById('viewport-box').classList.remove('recording');
                document.getElementById('record-btn').classList.remove('recording');
                document.getElementById('record-icon').innerHTML = '<circle cx="12" cy="12" r="8"/>';
            }
            purgeVideoMemory();
            secondsElapsed = 0;
            updateTimerDisplay();
            showStatus("Запись отменена. Память очищена.", "");
        }

        function updateTimerDisplay() {
            const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
            const secs = String(secondsElapsed % 60).padStart(2, '0');
            document.getElementById('timer-display').innerText = `${mins}:${secs}`;
        }

        function showStatus(text, type) {
            const el = document.getElementById('status-display');
            el.innerText = text;
            el.className = "status-msg " + (type || "");
        }
    </script>
</body>
</html>
